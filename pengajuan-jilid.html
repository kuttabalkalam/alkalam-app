<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ujian Quran - Kuttab Al-Kalam</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
<link rel="stylesheet" href="ui.css">
<style>
  .nav-tabs .nav-link { color: #1a1a1a; }
  .nav-tabs .nav-link.active { background: #f2c94c; border-color: #d4a52a; color: #1a1a1a; font-weight: 600; }
  .st-Diajukan { background: #f0ad4e; color: #fff; }
  .st-Dijadwalkan { background: #2a6fdb; color: #fff; }
  .st-Lulus { background: #28a745; color: #fff; }
  .st-BelumLulus { background: #dc3545; color: #fff; }
  .st-Ditolak { background: #6f42c1; color: #fff; }
  .st-Dibatalkan { background: #888; color: #fff; }
  .kartu-pengajuan { border-left: 4px solid #f2c94c; }
</style>
</head>
<body class="hold-transition sidebar-mini">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="ui.js"></script>
<script src="wa.js"></script>

<script>
  KUTTAB.halaman({
    aktif: "pengajuan-jilid",
    judul: "Ujian Quran",
    roles: ["admin", "kepala", "guru"],
    render: async ({ sb, me, sem, konten, toast, gagal, peringatan, konfirmasi, esc }) => {
      if (!sem) {
        konten.innerHTML = '<div class="alert alert-warning">Belum ada semester aktif.</div>';
        return;
      }

      const $ = id => document.getElementById(id);
      const KODE_QURAN = ["tilawah", "tahfidz", "kitabah"];
      // Pilihan jilid atau juz untuk tiap jenis ujian
      const PILIHAN = {
        Tilawati: Array.from({ length: 4 }, (_, i) => "Jilid " + (i + 1)),
        Quran: Array.from({ length: 30 }, (_, i) => "Juz " + (i + 1)),
        Tahfidz: Array.from({ length: 30 }, (_, i) => "Juz " + (i + 1))
      };
      const JAM_UJIAN = (() => {
        const out = [];
        for (let m = 7 * 60 + 30; m <= 11 * 60 + 30; m += 30) {
          out.push(String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"));
        }
        return out;
      })();
      const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
      const tglIndo = iso => { const d = new Date(iso + "T00:00:00"); return d.getDate() + " " + BULAN[d.getMonth()] + " " + d.getFullYear(); };
      const hariIni = () => {
        const d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      };
      const kelasStatus = s => ({
        "Diajukan": "st-Diajukan", "Dijadwalkan": "st-Dijadwalkan", "Lulus": "st-Lulus",
        "Belum Lulus": "st-BelumLulus", "Ditolak": "st-Ditolak", "Dibatalkan": "st-Dibatalkan"
      })[s] || "";

      const admin = me.peran === "admin";
      const sayaPenguji = p => p.penguji_id === me.id;
      const sayaPengaju = p => p.pengaju_id === me.id;

      const [rb, pm, pd] = await Promise.all([
        sb.from("rombel").select("id, nama, tingkat_kode, wali_kelas_id").eq("tahun_ajaran_id", sem.tahun_ajaran_id).order("nama"),
        sb.from("penugasan_mapel").select("rombel_id, pegawai_id, mapel:mapel_id(kode)"),
        sb.rpc("penguji_default")
      ]);
      if (rb.error) return gagal(rb.error);
      if (pm.error) return gagal(pm.error);

      const pengujiDefault = (!pd.error && pd.data && pd.data.length)
        ? { id: pd.data[0].id, nama: pd.data[0].nama } : null;

      const rombelAll = rb.data || [];
      const quranSet = new Set((pm.data || [])
        .filter(x => x.pegawai_id === me.id && KODE_QURAN.includes(x.mapel?.kode))
        .map(x => x.rombel_id));
      const rombelQuran = admin ? rombelAll : rombelAll.filter(x => quranSet.has(x.id));
      const bisaAjukan = admin || rombelQuran.length > 0;

      const tabs = [];
      if (bisaAjukan) tabs.push(["ajukan", "Ajukan"]);
      tabs.push(["daftar", "Daftar"]);
      if (admin) tabs.push(["penguji", "Penguji"]);

      konten.innerHTML = `
        <p class="small text-muted mb-2">TA ${esc(sem.tahun_ajaran.kode)} · Semester ${sem.nomor === 1 ? "Ganjil" : "Genap"}</p>
        <ul class="nav nav-tabs mb-3">
          ${tabs.map(([k, l]) => `<li class="nav-item"><a class="nav-link" href="#" data-tab="${k}">${l}</a></li>`).join("")}
        </ul>
        ${tabs.map(([k]) => `<div class="panel" id="p-${k}" style="display:none"></div>`).join("")}`;

      let penguji = [];
      let rows = [];

      // ===== AJUKAN =====
      if (bisaAjukan) {
        $("p-ajukan").innerHTML = `
          <div class="card card-outline card-warning"><div class="card-body">
            ${pengujiDefault ? "" : '<div class="alert alert-warning small">Belum ada penguji default. Hubungi admin.</div>'}
            <div class="form-row">
              <div class="col-md-6 form-group"><label class="small mb-1">Kelas</label>
                <select id="aRombel" class="form-control"></select></div>
              <div class="col-md-6 form-group"><label class="small mb-1">Santri</label>
                <select id="aSantri" class="form-control"></select></div>
              <div class="col-md-6 form-group"><label class="small mb-1">Jenis</label>
                <select id="aGrup" class="form-control">
                  <option value="tahsin">Tahsin</option>
                  <option value="tahfidz">Tahfidz</option>
                </select></div>
              <div class="col-md-6 form-group" id="aKitabBox"><label class="small mb-1">Kitab</label>
                <select id="aKitab" class="form-control">
                  <option value="Tilawati">Tilawati</option>
                  <option value="Quran">Quran</option>
                </select></div>
              <div class="col-md-6 form-group"><label class="small mb-1" id="aJilidLbl">Jilid</label>
                <select id="aJilid" class="form-control"></select></div>
              <div class="col-md-6 form-group"><label class="small mb-1">Penguji</label>
                <input class="form-control" value="${esc(pengujiDefault ? pengujiDefault.nama : "-")}" disabled></div>
              <div class="col-md-6 form-group"><label class="small mb-1">Tanggal ujian</label>
                <input type="date" id="aTgl" class="form-control" min="${hariIni()}" value="${hariIni()}"></div>
              <div class="col-md-6 form-group"><label class="small mb-1">Jam ujian</label>
                <select id="aJam" class="form-control">
                  ${JAM_UJIAN.map(j => `<option value="${j}">${j}</option>`).join("")}
                </select></div>
            </div>
            <button class="btn btn-kuning" id="aKirim" ${pengujiDefault ? "" : "disabled"}>
              <i class="fas fa-paper-plane"></i> Ajukan
            </button>
            <p class="small text-muted mt-2 mb-0">Penguji akan diberi tahu lewat WhatsApp untuk menyetujui atau menolak.</p>
          </div></div>`;

        const rombelUntukAjukan = admin ? rombelAll : rombelQuran;
        $("aRombel").innerHTML = rombelUntukAjukan.map(x => `<option value="${x.id}">${esc(x.nama)}</option>`).join("");
        $("aRombel").onchange = isiSantriAjukan;
        $("aGrup").onchange = isiJilid;
        $("aKitab").onchange = isiJilid;
        $("aKirim").onclick = ajukan;
      }

      // ===== DAFTAR =====
      $("p-daftar").innerHTML = `
        <div class="card card-outline card-info"><div class="card-body">
          <div class="form-group mb-0">
            <label class="small mb-1">Filter status</label>
            <select id="fStatus" class="form-control" style="max-width:280px">
              <option value="">Semua</option>
              <option value="Diajukan">Menunggu persetujuan</option>
              <option value="Dijadwalkan">Dijadwalkan</option>
              <option value="Lulus">Lulus</option>
              <option value="Belum Lulus">Belum Lulus</option>
              <option value="Ditolak">Ditolak</option>
              <option value="Dibatalkan">Dibatalkan</option>
            </select>
          </div>
        </div></div>
        <div id="dList"></div>`;
      $("fStatus").onchange = muatDaftar;

      // ===== PENGUJI (ADMIN) =====
      if (admin) {
        $("p-penguji").innerHTML = `
          <div class="card card-outline card-info"><div class="card-body">
            <p class="small text-muted">Centang pegawai yang boleh ditetapkan sebagai penguji ujian.</p>
            <div id="pList"></div>
          </div></div>`;
      }

      function bukaTab(k) {
        konten.querySelectorAll("[data-tab]").forEach(a => a.classList.toggle("active", a.dataset.tab === k));
        konten.querySelectorAll(".panel").forEach(p => p.style.display = p.id === "p-" + k ? "" : "none");
        if (k === "ajukan") { isiJilid(); isiSantriAjukan(); }
        if (k === "daftar") muatDaftar();
        if (k === "penguji") muatPengujiTab();
      }

      konten.querySelectorAll("[data-tab]").forEach(a => a.onclick = e => {
        e.preventDefault();
        bukaTab(a.dataset.tab);
      });

      // Jenis yang disimpan ke database: Tilawati, Quran, atau Tahfidz
      function jenisAjuan() {
        return $("aGrup").value === "tahfidz" ? "Tahfidz" : $("aKitab").value;
      }

      function isiJilid() {
        const grup = $("aGrup").value;
        $("aKitabBox").style.display = grup === "tahsin" ? "" : "none";
        const jenis = jenisAjuan();
        $("aJilidLbl").textContent = jenis === "Tilawati" ? "Jilid" : "Juz";
        $("aJilid").innerHTML = PILIHAN[jenis].map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join("");
      }

      async function isiSantriAjukan() {
        const rid = Number($("aRombel").value);
        if (!rid) { $("aSantri").innerHTML = ""; return; }
        const [kr, pend] = await Promise.all([
          sb.from("keanggotaan_rombel").select("santri:santri_id(id, nis, nama_lengkap)")
            .eq("rombel_id", rid).eq("tahun_ajaran_id", sem.tahun_ajaran_id),
          sb.from("pengajuan_jilid").select("santri_id").in("status", ["Diajukan", "Dijadwalkan"])
        ]);
        if (kr.error) return gagal(kr.error);
        const sibuk = new Set((pend.data || []).map(x => x.santri_id));
        const list = (kr.data || []).map(x => x.santri)
          .filter(s => s && !sibuk.has(s.id))
          .sort((a, b) => a.nama_lengkap.localeCompare(b.nama_lengkap));
        $("aSantri").innerHTML = `<option value="">-- pilih santri --</option>` +
          list.map(s => `<option value="${s.id}">${esc(s.nama_lengkap)} (${esc(s.nis || "-")})</option>`).join("");
      }

      async function ajukan() {
        const sid = Number($("aSantri").value), rid = Number($("aRombel").value);
        const jenis = jenisAjuan();
        const jilid = $("aJilid").value;
        const tgl = $("aTgl").value, jam = $("aJam").value;
        if (!sid || !rid) return peringatan("Pilih kelas dan santri.");
        if (!jilid) return peringatan("Pilih jilid atau juz.");
        if (!tgl) return peringatan("Pilih tanggal ujian.");
        if (!pengujiDefault) return peringatan("Belum ada penguji default. Hubungi admin.");

        $("aKirim").disabled = true;
        const { data: baru, error } = await sb.from("pengajuan_jilid").insert({
          santri_id: sid, rombel_id: rid, jenis, jilid_juz: jilid,
          status: "Diajukan", tanggal_ujian: tgl, jam_ujian: jam,
          penguji_id: pengujiDefault.id,
          pengaju_id: me.id, diubah_oleh: me.id
        }).select("id").single();
        $("aKirim").disabled = false;
        if (error) return gagal(error);

        const r = await WA.kirim("pengajuan_baru", { pengajuan_id: baru.id });
        if (r.ok) toast("Pengajuan tersimpan. Penguji sudah diberi tahu.");
        else peringatan("Pengajuan tersimpan, tetapi WhatsApp ke penguji belum terkirim: " + r.pesan);

        await isiSantriAjukan();
        bukaTab("daftar");
      }

      // ===== DAFTAR =====
      async function muatPenguji() {
        const { data } = await sb.from("penguji_jilid")
          .select("pegawai_id, pegawai:pegawai_id(nama_lengkap)").eq("aktif", true);
        penguji = (data || []).map(x => ({ id: x.pegawai_id, nama: x.pegawai?.nama_lengkap || "-" }));
      }

      async function muatDaftar() {
        const status = $("fStatus").value;
        let q = sb.from("pengajuan_jilid")
          .select("id, santri_id, rombel_id, jenis, jilid_juz, status, tanggal_ujian, jam_ujian, tanggal_final, catatan, penguji_id, pengaju_id, updated_at, santri:santri_id(nis, nama_lengkap), rombel:rombel_id(nama), penguji:penguji_id(nama_lengkap), pengaju:pengaju_id(nama_lengkap)")
          .order("created_at", { ascending: false });
        if (status) q = q.eq("status", status);
        const { data, error } = await q;
        if (error) return gagal(error);
        rows = data || [];
        renderDaftar();
      }

      function aksiUntuk(p) {
        const a = [];
        const bisaPenguji = admin || sayaPenguji(p);
        if (p.status === "Diajukan" && bisaPenguji) {
          a.push(["setujui", "Setujui"], ["jadwal", "Ubah jadwal"], ["tolak", "Tolak"]);
        }
        if (p.status === "Dijadwalkan" && bisaPenguji) {
          a.push(["jadwal", "Ubah jadwal"], ["hasil", "Isi hasil"]);
        }
        if (p.status === "Diajukan" && (admin || sayaPengaju(p))) {
          a.push(["batal", "Batalkan"]);
        }
        return a;
      }

      function renderDaftar() {
        const box = $("dList");
        if (!rows.length) { box.innerHTML = '<p class="text-muted">Belum ada pengajuan.</p>'; return; }
        box.innerHTML = rows.map(p => {
          const aksi = aksiUntuk(p);
          const labelStatus = p.status === "Diajukan" ? "Menunggu persetujuan" : p.status;
          return `<div class="card kartu-pengajuan mb-2"><div class="card-body py-2">
            <div class="font-weight-bold">${esc(p.santri?.nama_lengkap || "-")}
              <span class="text-muted small">(${esc(p.santri?.nis || "-")})</span></div>
            <div class="small">${esc(p.rombel?.nama || "-")} · ${esc(p.jenis)} · ${esc(p.jilid_juz)}</div>
            <div class="small mt-1"><span class="badge ${kelasStatus(p.status)}">${esc(labelStatus)}</span>
              ${p.tanggal_ujian ? " · " + tglIndo(p.tanggal_ujian) + (p.jam_ujian ? " pukul " + p.jam_ujian.slice(0, 5) : "") : ""}</div>
            ${p.penguji?.nama_lengkap ? `<div class="small">Penguji: ${esc(p.penguji.nama_lengkap)}</div>` : ""}
            ${p.pengaju?.nama_lengkap ? `<div class="small text-muted">Diajukan oleh: ${esc(p.pengaju.nama_lengkap)}</div>` : ""}
            ${p.catatan ? `<div class="small">Catatan: ${esc(p.catatan)}</div>` : ""}
            ${p.tanggal_final ? `<div class="small">Tanggal final: ${tglIndo(p.tanggal_final)}</div>` : ""}
            <div class="mt-2">${aksi.map(([k, l]) =>
              `<button class="btn btn-sm ${k === "tolak" || k === "batal" ? "btn-danger" : (k === "setujui" ? "btn-kuning" : "btn-outline-dark")} mr-1 mb-1" data-act="${k}" data-id="${p.id}">${l}</button>`).join("")}</div>
            <div class="mt-2" id="form-${p.id}"></div>
          </div></div>`;
        }).join("");

        box.querySelectorAll("button[data-act]").forEach(b =>
          b.onclick = () => aksiKlik(b.dataset.act, Number(b.dataset.id)));
      }

      function aksiKlik(act, id) {
        const p = rows.find(x => x.id === id);
        if (!p) return;
        if (act === "setujui") return setujui(id);
        if (act === "batal") return batalkan(id);
        const box = $("form-" + id);

        if (act === "jadwal") {
          const jamTerpilih = p.jam_ujian ? p.jam_ujian.slice(0, 5) : "08:00";
          box.innerHTML = `
            <div class="form-row">
              <div class="col-md-6 form-group"><label class="small mb-1">Tanggal ujian</label>
                <input type="date" class="form-control tgl" min="${hariIni()}" value="${p.tanggal_ujian || hariIni()}"></div>
              <div class="col-md-6 form-group"><label class="small mb-1">Jam ujian</label>
                <select class="form-control jam">${JAM_UJIAN.map(j =>
                  `<option value="${j}" ${j === jamTerpilih ? "selected" : ""}>${j}</option>`).join("")}</select></div>
            </div>
            <button class="btn btn-kuning btn-sm" data-simpan="jadwal">Simpan jadwal</button>
            <small class="text-muted d-block mt-1">Jadwal yang diubah langsung berstatus Dijadwalkan.</small>`;
          box.querySelector("[data-simpan]").onclick = () => simpanJadwal(id);
        }

        if (act === "tolak") {
          box.innerHTML = `
            <div class="form-group"><label class="small mb-1">Alasan penolakan *</label>
              <textarea class="form-control catatan" rows="2" placeholder="Contoh: jadwal bentrok dengan kegiatan kuttab"></textarea></div>
            <button class="btn btn-danger btn-sm" data-simpan="tolak">Tolak pengajuan</button>`;
          box.querySelector("[data-simpan]").onclick = () => tolak(id);
        }

        if (act === "hasil") {
          box.innerHTML = `
            <div class="form-row">
              <div class="col-md-4 form-group"><label class="small mb-1">Hasil</label>
                <select class="form-control hasil">
                  <option value="Lulus">Lulus</option>
                  <option value="Belum Lulus">Belum Lulus</option>
                </select></div>
              <div class="col-md-4 form-group"><label class="small mb-1">Tanggal final</label>
                <input type="date" class="form-control tglFinal" value="${hariIni()}"></div>
              <div class="col-md-4 form-group"><label class="small mb-1">Catatan</label>
                <textarea class="form-control catatan" rows="1"></textarea></div>
            </div>
            <button class="btn btn-kuning btn-sm" data-simpan="hasil">Simpan hasil</button>`;
          box.querySelector("[data-simpan]").onclick = () => simpanHasil(id);
        }
      }

      // Penguji menyetujui jadwal yang sudah diusulkan guru. Hanya guru pengaju yang diberi tahu.
      async function setujui(id) {
        const ok = await konfirmasi("Setujui jadwal ini?", "Guru pengaju akan menerima pemberitahuan WhatsApp.");
        if (!ok) return;

        const { error } = await sb.from("pengajuan_jilid").update({
          status: "Dijadwalkan", diubah_oleh: me.id, updated_at: new Date().toISOString()
        }).eq("id", id);
        if (error) return gagal(error);

        const r = await WA.kirim("setujui_jilid", { pengajuan_id: id });
        if (r.ok) toast("Jadwal disetujui. WhatsApp ke guru pengaju terkirim.");
        else peringatan("Jadwal disetujui, tetapi WhatsApp belum terkirim: " + r.pesan);
        muatDaftar();
      }

      // Penguji atau admin mengubah jadwal. Hanya guru pengaju yang diberi tahu.
      async function simpanJadwal(id) {
        const box = $("form-" + id);
        const tgl = box.querySelector(".tgl").value;
        const jam = box.querySelector(".jam").value;
        if (!tgl || !jam) return peringatan("Lengkapi tanggal dan jam.");

        const { error } = await sb.from("pengajuan_jilid").update({
          tanggal_ujian: tgl, jam_ujian: jam,
          status: "Dijadwalkan", diubah_oleh: me.id, updated_at: new Date().toISOString()
        }).eq("id", id);
        if (error) return gagal(error);

        const r = await WA.kirim("reschedule_jilid", { pengajuan_id: id });
        if (r.ok) toast("Jadwal diubah. WhatsApp ke guru pengaju terkirim.");
        else peringatan("Jadwal diubah, tetapi WhatsApp belum terkirim: " + r.pesan);
        muatDaftar();
      }

      // Penguji menolak. Guru pengaju diberi tahu.
      async function tolak(id) {
        const box = $("form-" + id);
        const catatan = box.querySelector(".catatan").value.trim();
        if (!catatan) return peringatan("Isi alasan penolakan.");

        const { error } = await sb.from("pengajuan_jilid").update({
          status: "Ditolak", catatan, diubah_oleh: me.id, updated_at: new Date().toISOString()
        }).eq("id", id);
        if (error) return gagal(error);

        const r = await WA.kirim("tolak_jilid", { pengajuan_id: id });
        if (r.ok) toast("Pengajuan ditolak. Guru pengaju sudah diberi tahu.");
        else peringatan("Pengajuan ditolak, tetapi WhatsApp belum terkirim: " + r.pesan);
        muatDaftar();
      }

      // Hasil ujian. Orang tua diberi tahu.
      async function simpanHasil(id) {
        const box = $("form-" + id);
        const status = box.querySelector(".hasil").value;
        const tglFinal = box.querySelector(".tglFinal").value;
        const catatan = box.querySelector(".catatan").value.trim() || null;
        if (!tglFinal) return peringatan("Isi tanggal final.");

        const { error } = await sb.from("pengajuan_jilid").update({
          status, tanggal_final: tglFinal, catatan,
          diubah_oleh: me.id, updated_at: new Date().toISOString()
        }).eq("id", id);
        if (error) return gagal(error);

        const r = await WA.kirim("hasil_jilid", { pengajuan_id: id });
        if (r.ok) toast("Hasil tersimpan. WhatsApp ke orang tua terkirim.");
        else peringatan("Hasil tersimpan, tetapi WhatsApp belum terkirim: " + r.pesan);
        muatDaftar();
      }

      async function batalkan(id) {
        if (!(await konfirmasi("Batalkan pengajuan ini?", "Pengajuan tidak bisa dijadwalkan lagi."))) return;
        const { error } = await sb.from("pengajuan_jilid").update({
          status: "Dibatalkan", diubah_oleh: me.id, updated_at: new Date().toISOString()
        }).eq("id", id);
        if (error) return gagal(error);
        toast("Pengajuan dibatalkan.");
        muatDaftar();
      }

      // ===== PENGUJI (ADMIN) =====
      async function muatPengujiTab() {
        const [pg, pj] = await Promise.all([
          sb.from("pegawai").select("id, nama_lengkap, peran").eq("status_aktif", true).order("nama_lengkap"),
          sb.from("penguji_jilid").select("pegawai_id").eq("aktif", true)
        ]);
        if (pg.error) return gagal(pg.error);
        const set = new Set((pj.data || []).map(x => x.pegawai_id));
        $("pList").innerHTML = (pg.data || []).map(p =>
          `<div class="custom-control custom-checkbox mb-1">
             <input class="custom-control-input" type="checkbox" id="pg-${p.id}" data-id="${p.id}" ${set.has(p.id) ? "checked" : ""}>
             <label class="custom-control-label" for="pg-${p.id}">${esc(p.nama_lengkap)} <span class="text-muted small">(${esc(p.peran)})</span></label>
           </div>`).join("");

        $("pList").querySelectorAll("input[type=checkbox]").forEach(cb => cb.onchange = async () => {
          const id = Number(cb.dataset.id);
          let error;
          if (cb.checked) {
            ({ error } = await sb.from("penguji_jilid").upsert({ pegawai_id: id, aktif: true }, { onConflict: "pegawai_id" }));
          } else {
            ({ error } = await sb.from("penguji_jilid").delete().eq("pegawai_id", id));
          }
          if (error) { cb.checked = !cb.checked; return gagal(error); }
          toast("Daftar penguji diperbarui.");
          await muatPenguji();
        });
      }

      await muatPenguji();
      bukaTab(bisaAjukan ? "ajukan" : "daftar");
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulir Pendaftaran - Kuttab Al-Kalam</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
  :root { --primary-green: #28a745; --text-muted: #6c757d; }
  body { background: #fff; font-family: Arial, sans-serif; }
  .header-title { text-align: center; margin-top: 30px; }
  .header-title h1 { font-size: 24px; color: #333; margin-bottom: 5px; }
  .header-title p { color: var(--text-muted); font-size: 14px; }
  .wizard-container { max-width: 900px; margin: 30px auto; padding: 20px; }
  .stepper { display: flex; justify-content: space-between; margin-bottom: 40px; position: relative; }
  .stepper::before { content: ""; position: absolute; top: 25px; left: 50px; right: 50px; height: 2px; background: #ddd; z-index: 1; }
  .step-item { flex: 1; text-align: center; position: relative; z-index: 2; }
  .step-circle { width: 50px; height: 50px; border-radius: 50%; background: #fff; border: 2px solid #ddd; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; color: #ddd; font-size: 20px; transition: 0.3s; }
  .step-label { font-size: 14px; color: var(--text-muted); font-weight: 500; }
  .step-item.active .step-circle { border-color: var(--primary-green); color: var(--primary-green); }
  .step-item.active .step-label { color: var(--primary-green); font-weight: bold; }
  .step-item.completed .step-circle { background: var(--primary-green); border-color: var(--primary-green); color: #fff; }
  .form-section { display: none; }
  .form-section.active { display: block; }
  .form-label { font-weight: 600; color: #444; font-size: 14px; }
  .navigation-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 40px; border-top: 1px solid #eee; padding-top: 20px; }
  .btn-prev { background: #f0ad4e; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; }
  .btn-next, .btn-submit { background: var(--primary-green); color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; }
  .btn-prev:hover, .btn-next:hover, .btn-submit:hover { opacity: 0.9; color: #fff; }
</style>
</head>
<body>

<div class="header-title" id="mainHeader">
  <h1>Pendaftaran Santri Kuttab Al-Kalam</h1>
  <p>kuttabalkalam.id</p>
</div>

<p id="loading" class="text-center text-muted mt-5">Memuat...</p>

<div class="wizard-container">
  <div class="stepper" id="mainStepper" style="display:none;">

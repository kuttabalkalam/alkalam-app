<style>
  :root { --kuning: #f2c94c; --hitam: #1a1a1a; --biru: #e6f4fb; }

  .card { border-top: 3px solid var(--kuning); margin-bottom: 16px; }
  .card-header { background: #bfe3f5; font-weight: 600; }
  .btn-kuning { background: var(--kuning); color: var(--hitam); border: none; font-weight: 600; }

  .btn-kuning:disabled { background: #cfcfcf; color: #666; }
  .bagian { font-weight: 700; color: var(--hitam); border-bottom: 1px solid #ddd; margin: 14px 0 10px; padding-bottom: 4px; }
  .biaya { background: #fff8e1; border: 1px solid var(--kuning); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .honeypot { position: absolute; left: -9999px; }
  .hint { font-size: 12px; color: #6c757d; margin-bottom: 6px; }
</style>
</head>

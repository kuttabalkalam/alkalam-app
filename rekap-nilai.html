<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rekap Nilai - Kuttab Al-Kalam</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
<link rel="stylesheet" href="ui.css">
<style>
  .tabel-wrap { overflow-x: auto; }
  .tabel-wrap th, .tabel-wrap td { white-space: nowrap; vertical-align: middle; }
  .tabel-wrap td.nama { white-space: normal; min-width: 170px; }
  .rumus { font-size: 13px; color: #444; background: #fff; border-left: 4px solid #f2c94c; padding: 10px 12px; }
  .embed-body { padding: 8px; }
</style>
</head>
<body class="hold-transition sidebar-mini">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Di dalam dialog (embed=1), AdminLTE tidak dimuat agar plugin-nya tidak mencari elemen layout
  if (!/embed=1/.test(location.search)) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"><\/script>');
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="ui.js"></script>

<script>
  // Label kolom: untuk tahfidz dan tilawah, komponen tertentu punya nama tampilan sendiri
  const LABEL_ASPEK = { ujian_periodik: "Nilai Harian", keaktifan: "Progres", uas: "UAS", adab: "Adab", kehadiran: "Kehadiran" };
  function labelKomponen(kode, kodeMapel, namaAsli) {
    if (["tahfidz", "tilawah"].includes(kodeMapel) && LABEL_ASPEK[kode]) return LABEL_ASPEK[kode];
    return namaAsli;
  }

  KUTTAB.halaman({
    aktif: "rekap-nilai",
    judul: "Rekap Nilai",
    roles: ["admin", "kepala", "guru"],
    render: async ({ sb, me, sem, konten, gagal, peringatan, esc }) => {
      if (!sem) {
        konten.innerHTML = '<div class="alert alert-warning">Belum ada semester aktif.</div>';
        return;
      }

      const [rb, pm, pg] = await Promise.all([
        sb.from("rombel").select("id, nama, wali_kelas_id").eq("tahun_ajaran_id", sem.tahun_ajaran_id).order("nama"),
        sb.from("penugasan_mapel").select("rombel_id, pegawai_id, mapel:mapel_id(id, kode, nama, urutan)"),
        sb.from("pengaturan").select("kunci, nilai").in("kunci", ["faktor_nilai_akhir", "pembagi_rapor"])
      ]);
      if (rb.error) return gagal(rb.error);
      if (pm.error) return gagal(pm.error);

      const faktor = Number((pg.data || []).find(x => x.kunci === "faktor_nilai_akhir")?.nilai ?? 0.9);
      const pembagi = Number((pg.data || []).find(x => x.kunci === "pembagi_rapor")?.nilai ?? 10);
      const skalaAkhir = Math.round(100 * faktor);
      const skalaRapor = Math.round(100 * faktor / pembagi);

      const semuaRombel = rb.data || [];
      const idTA = new Set(semuaRombel.map(r => r.id));
      const penugasan = (pm.data || []).filter(x => x.mapel && idTA.has(x.rombel_id));
      const lihatSemua = me.peran !== "guru";

      const adalahWali = rid => (semuaRombel.find(r => r.id === rid) || {}).wali_kelas_id === me.id;
      const mengajarDi = rid => penugasan.some(x => x.rombel_id === rid && x.pegawai_id === me.id);
      const rombelBisa = semuaRombel.filter(r => lihatSemua || adalahWali(r.id) || mengajarDi(r.id));

      if (!rombelBisa.length) {
        konten.innerHTML = '<div class="alert alert-info">Belum ada kelas yang bisa Anda lihat.</div>';
        return;
      }

      // Wali kelas melihat semua mapel di kelasnya. Guru mapel hanya melihat mapelnya.
      function mapelUntuk(rid) {
        const semua = penugasan.filter(x => x.rombel_id === rid);
        const boleh = (lihatSemua || adalahWali(rid)) ? semua : semua.filter(x => x.pegawai_id === me.id);
        const m = new Map();
        boleh.forEach(x => m.set(x.mapel.id, x.mapel));
        return [...m.values()].sort((a, b) => a.urutan - b.urutan);
      }

      const kodeMapelDari = mid => (penugasan.find(x => x.mapel.id === mid) || {}).mapel?.kode || "";

      konten.innerHTML = `
        <div class="card">
          <div class="card-body">
            <div class="form-row align-items-end">
              <div class="col-12 col-md-4 mb-2">
                <label class="small mb-1">Kelas</label>
                <select id="rombel" class="form-control">
                  ${rombelBisa.map(r => `<option value="${r.id}">${esc(r.nama)}</option>`).join("")}
                </select>
              </div>
              <div class="col-12 col-md-5 mb-2">
                <label class="small mb-1">Mapel</label>
                <select id="mapel" class="form-control"></select>
              </div>
              <div class="col-12 col-md-3 mb-2">
                <button class="btn btn-kuning btn-block" id="tampil"><i class="fas fa-table"></i> Tampilkan</button>
              </div>
            </div>
            <p class="small text-muted mb-0" id="info"></p>
          </div>
        </div>
        <div class="tabel-wrap" id="tabel"></div>
        <div class="rumus mt-2">
          Angka di bawah nama kolom adalah bobot. Kehadiran dihitung otomatis dari data absensi.
          Nilai akhir = (jumlah rata-rata komponen × bobot) ÷ total bobot × ${skalaAkhir} / 100.
          Nilai rapor = nilai akhir ÷ ${pembagi}.
          Sel bertanda <span class="badge badge-warning">belum</span> berarti komponen belum diisi, sehingga nilai akhir belum muncul.
        </div>`;

      const $ = id => document.getElementById(id);
      const f2 = v => Number(v).toFixed(2);

      function isiMapel() {
        const list = mapelUntuk(Number($("rombel").value));
        $("mapel").innerHTML = list.length
          ? list.map(m => `<option value="${m.id}">${esc(m.nama)}</option>`).join("")
          : `<option value="">(tidak ada mapel)</option>`;
      }

      $("rombel").onchange = () => { isiMapel(); tampil(); };
      $("mapel").onchange = tampil;
      $("tampil").onclick = tampil;

      async function tampil() {
        const rid = Number($("rombel").value), mid = Number($("mapel").value);
        if (!rid || !mid) return peringatan("Pilih kelas dan mapel.");
        $("info").textContent = "Memuat...";
        const kodeMapel = kodeMapelDari(mid);

        const [kr, bn, nl, kh, na] = await Promise.all([
          sb.from("keanggotaan_rombel").select("santri:santri_id(id, nis, nama_lengkap)")
            .eq("rombel_id", rid).eq("tahun_ajaran_id", sem.tahun_ajaran_id),
          sb.from("bobot_nilai").select("bobot, komponen:komponen_id(id, kode, nama, urutan)")
            .eq("mapel_id", mid),
          sb.from("nilai").select("santri_id, komponen_id, nilai")
            .eq("semester_id", sem.id).eq("mapel_id", mid),
          sb.from("kehadiran_santri").select("santri_id, nilai").eq("semester_id", sem.id),
          sb.from("nilai_akhir").select("santri_id, nilai_akhir, nilai_rapor")
            .eq("semester_id", sem.id).eq("mapel_id", mid)
        ]);
        for (const r of [kr, bn, nl, kh, na]) if (r.error) return gagal(r.error);

        const santri = (kr.data || []).map(x => x.santri).filter(Boolean)
          .sort((a, b) => a.nama_lengkap.localeCompare(b.nama_lengkap));
        if (!santri.length) {
          $("tabel").innerHTML = "";
          $("info").textContent = "Belum ada santri di kelas ini.";
          return;
        }

        const komponen = (bn.data || []).filter(b => b.komponen)
          .map(b => ({
            id: b.komponen.id, kode: b.komponen.kode, nama: b.komponen.nama,
            urutan: b.komponen.urutan, bobot: Number(b.bobot)
          }))
          .sort((a, b) => a.urutan - b.urutan);

        // Rata-rata item per komponen (misalnya Nilai 1 sampai 4)
        const nilaiMap = {};
        (nl.data || []).forEach(n => {
          const k = n.santri_id + "|" + n.komponen_id;
          (nilaiMap[k] ||= []).push(Number(n.nilai));
        });
        const khMap = {};
        (kh.data || []).forEach(k => khMap[k.santri_id] = Number(k.nilai));
        const naMap = {};
        (na.data || []).forEach(a => naMap[a.santri_id] = a);

        function nilaiKomponen(sid, k) {
          if (k.kode === "kehadiran") return khMap[sid] ?? null;
          const arr = nilaiMap[sid + "|" + k.id];
          return arr && arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
        }

        let lengkap = 0, totalRapor = 0;
        const baris = santri.map((s, i) => {
          const sel = komponen.map(k => {
            const v = nilaiKomponen(s.id, k);
            return `<td class="text-center">${v == null ? '<span class="badge badge-warning">belum</span>' : f2(v)}</td>`;
          }).join("");
          const a = naMap[s.id];
          if (a) { lengkap++; totalRapor += Number(a.nilai_rapor); }
          return `<tr>
            <td>${i + 1}</td>
            <td>${esc(s.nis || "-")}</td>
            <td class="nama">${esc(s.nama_lengkap)}</td>
            ${sel}
            <td class="text-center font-weight-bold">${a ? f2(a.nilai_akhir) : "-"}</td>
            <td class="text-center font-weight-bold">${a ? f2(a.nilai_rapor) : "-"}</td>
          </tr>`;
        }).join("");

        $("tabel").innerHTML = `
          <table class="table table-sm table-bordered bg-white">
            <thead><tr>
              <th>No</th><th>NIS</th><th>Nama</th>
              ${komponen.map(k => `<th>${esc(labelKomponen(k.kode, kodeMapel, k.nama))}<br><small>${k.bobot}%</small></th>`).join("")}
              <th>Nilai Akhir<br><small>skala ${skalaAkhir}</small></th>
              <th>Rapor<br><small>skala ${skalaRapor}</small></th>
            </tr></thead>
            <tbody>${baris}</tbody>
          </table>`;

        $("info").textContent = lengkap + " dari " + santri.length + " santri sudah lengkap"
          + (lengkap ? ". Rata-rata nilai rapor: " + f2(totalRapor / lengkap) : "") + ".";
      }

      isiMapel();
      const q = new URLSearchParams(location.search);
      if (q.get("rombel")) $("rombel").value = q.get("rombel");
      isiMapel();
      if (q.get("mapel")) $("mapel").value = q.get("mapel");
      if ($("mapel").value) tampil();
    }
  });
</script>
</body>
</html>

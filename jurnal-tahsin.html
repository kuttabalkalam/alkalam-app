<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jurnal Tahsin - Kuttab Al-Kalam</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; font-size: 16px; margin: 0; padding: 0 0 90px; background: #f7f7f7; color: #111; }
  header { background: #222; color: #f2c94c; padding: 12px 16px; }
  header a { color: #f2c94c; text-decoration: none; }
  main { max-width: 640px; margin: 0 auto; padding: 12px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 10px; border: 1px solid #bbb; background: #fff; border-radius: 6px; font-size: 15px; }
  .tabs button.aktif { background: #f2c94c; border-color: #d4a52a; font-weight: bold; }
  .panel { display: none; }
  .panel.aktif { display: block; }
  .box { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  label { display: block; margin-bottom: 10px; font-size: 14px; color: #444; }
  select, input, textarea { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 6px; margin-top: 4px; font-family: inherit; }
  .btn { padding: 12px; font-size: 16px; border: none; border-radius: 6px; background: #28a745; color: #fff; width: 100%; }
  .kitab { display: flex; gap: 6px; margin-bottom: 10px; }
  .kitab button { flex: 1; padding: 10px; border: 1px solid #bbb; background: #fff; border-radius: 6px; font-size: 15px; }
  .kitab button.aktif { background: #28a745; color: #fff; border-color: #28a745; }
  .santri { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .santri .nama { font-weight: bold; }
  .santri .nis { font-size: 13px; color: #666; margin-bottom: 8px; }
  .baris { display: flex; gap: 8px; align-items: center; }
  .baris input.halaman { width: 84px; margin-top: 0; }
  .ket { display: flex; gap: 6px; flex: 1; }
  .ket button { flex: 1; padding: 10px 4px; border: 1px solid #bbb; background: #fff; border-radius: 6px; font-size: 15px; }
  .ket button.L.aktif { background: #28a745; color: #fff; border-color: #28a745; }
  .ket button.CL.aktif { background: #f0ad4e; color: #fff; border-color: #f0ad4e; }
  .ket button.TL.aktif { background: #dc3545; color: #fff; border-color: #dc3545; }
  .santri textarea { min-height: 80px; font-size: 15px; }
  .bawah { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #ddd; padding: 10px; }
  .bawah .btn { max-width: 640px; margin: 0 auto; display: block; }
  #pesan { font-weight: bold; min-height: 20px; margin: 8px 0; }
  .muted { color: #666; font-size: 14px; }
</style>
</head>
<body>
<header><a href="dashboard.html">← Dashboard</a> &nbsp; <strong>Jurnal Tahsin</strong></header>

<main>
  <p class="muted" id="info"></p>
  <div class="tabs">
    <button id="tabJurnal" class="aktif">Catat Jurnal</button>
    <button id="tabCatatan">Catatan Pekanan/Bulanan</button>
  </div>
  <p id="pesan"></p>

  <section class="panel aktif" id="pJurnal">
    <div class="box">
      <label>Kelas
        <select id="jRombel"></select>
      </label>
      <label>Tanggal
        <input type="date" id="jTanggal">
      </label>
      <label>Kitab</label>
      <div class="kitab" id="jKitab">
        <button type="button" data-k="tilawati" class="aktif">Tilawati</button>
        <button type="button" data-k="quran">Quran</button>
      </div>
      <button class="btn" id="jMuat">Tampilkan Santri</button>
    </div>
    <div id="jDaftar"></div>
  </section>

  <section class="panel" id="pCatatan">
    <div class="box">
      <label>Kelas
        <select id="cRombel"></select>
      </label>
      <label>Jenis
        <select id="cJenis">
          <option value="pekan">Pekanan</option>
          <option value="bulan">Bulanan</option>
        </select>
      </label>
      <label>Tanggal dalam periode
        <input type="date" id="cTanggal">
      </label>
      <p class="muted" id="cPeriode"></p>
      <button class="btn" id="cMuat">Tampilkan Santri</button>
    </div>
    <div id="cDaftar"></div>
  </section>
</main>

<div class="bawah" id="bawahBar">
  <button class="btn" id="simpanBtn">Simpan</button>
</div>

<script>
  const SUPABASE_URL = "https://epynlmuqxumuwcjsrnsz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Oq_to1zgHLnachvWYLV_yA_DoOTGI3s";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const pesan = t => $("pesan").textContent = t;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  const tglIndo = iso => { const d = new Date(iso + "T00:00:00"); return d.getDate() + " " + BULAN[d.getMonth()] + " " + d.getFullYear(); };
  const KODE_QURAN = ["tilawah", "tahfidz", "kitabah"];

  // Pekan = Senin s.d. Minggu. Bulan = tanggal 1 s.d. akhir bulan.
  function batasPeriode(jenis, iso) {
    const d = new Date(iso + "T00:00:00");
    if (jenis === "pekan") {
      const senin = new Date(d);
      senin.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      const minggu = new Date(senin);
      minggu.setDate(senin.getDate() + 6);
      return { mulai: fmt(senin), selesai: fmt(minggu) };
    }
    return {
      mulai: fmt(new Date(d.getFullYear(), d.getMonth(), 1)),
      selesai: fmt(new Date(d.getFullYear(), d.getMonth() + 1, 0))
    };
  }

  let me = null, sem = null, rombelJurnal = [], rombelCatatan = [];
  let daftar = [], existing = {}, existingCatatan = {}, rombelAktif = null;
  let kitab = "tilawati", modeAktif = "jurnal";

  function setBar(on) { $("bawahBar").style.display = on ? "block" : "none"; }

  function isiSelect(id, list) {
    $(id).innerHTML = list.map(r => `<option value="${r.id}">${esc(r.nama)}</option>`).join("");
  }

  function updatePeriode() {
    const { mulai, selesai } = batasPeriode($("cJenis").value, $("cTanggal").value);
    $("cPeriode").textContent = "Periode: " + tglIndo(mulai) + " s.d. " + tglIndo(selesai);
  }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { location.href = "login.html"; return; }

    const { data: p, error: eP } = await sb.from("pegawai")
      .select("id, peran").eq("auth_user_id", session.user.id).maybeSingle();
    if (eP) return pesan("Gagal memuat akun: " + eP.message);
    if (!p || !["admin", "guru"].includes(p.peran)) return pesan("Halaman ini hanya untuk guru dan admin.");
    me = p;

    const { data: s } = await sb.from("semester")
      .select("id, nomor, tahun_ajaran_id, tahun_ajaran:tahun_ajaran_id(kode)")
      .eq("aktif", true).maybeSingle();
    if (!s) return pesan("Belum ada semester aktif.");
    sem = s;
    $("info").textContent = "TA " + s.tahun_ajaran.kode + " · Semester " + (s.nomor === 1 ? "Ganjil" : "Genap");

    const [{ data: r }, { data: pm }] = await Promise.all([
      sb.from("rombel").select("id, nama, wali_kelas_id").eq("tahun_ajaran_id", s.tahun_ajaran_id).order("nama"),
      sb.from("penugasan_mapel").select("rombel_id, pegawai_id, mapel:mapel_id(kode)")
    ]);
    const semua = r || [];
    const quran = new Set((pm || []).filter(x => x.pegawai_id === me.id && KODE_QURAN.includes(x.mapel?.kode)).map(x => x.rombel_id));
    const wali = new Set(semua.filter(x => x.wali_kelas_id === me.id).map(x => x.id));

    rombelJurnal = me.peran === "admin" ? semua : semua.filter(x => quran.has(x.id) || wali.has(x.id));
    rombelCatatan = me.peran === "admin" ? semua : semua.filter(x => wali.has(x.id));

    isiSelect("jRombel", rombelJurnal);
    isiSelect("cRombel", rombelCatatan);
    if (!rombelJurnal.length) pesan("Anda belum punya kelas tahsin, tahfidz, atau kitabah di tahun ajaran ini.");

    $("jTanggal").value = fmt(new Date());
    $("cTanggal").value = fmt(new Date());
    updatePeriode();
  }

  function bukaTab(mode) {
    modeAktif = mode;
    $("tabJurnal").classList.toggle("aktif", mode === "jurnal");
    $("tabCatatan").classList.toggle("aktif", mode === "catatan");
    $("pJurnal").classList.toggle("aktif", mode === "jurnal");
    $("pCatatan").classList.toggle("aktif", mode === "catatan");
    daftar = [];
    $("jDaftar").innerHTML = "";
    $("cDaftar").innerHTML = "";
    setBar(false);
    pesan("");
  }

  async function ambilSantri(rid) {
    const { data, error } = await sb.from("keanggotaan_rombel")
      .select("santri:santri_id(id, nis, nama_lengkap)")
      .eq("rombel_id", rid).eq("tahun_ajaran_id", sem.tahun_ajaran_id);
    if (error) throw new Error(error.message);
    return (data || []).map(x => x.santri).filter(Boolean)
      .sort((a, b) => a.nama_lengkap.localeCompare(b.nama_lengkap));
  }

  // ===== JURNAL HARIAN =====
  async function jurnalMuat() {
    const rid = Number($("jRombel").value), tgl = $("jTanggal").value;
    if (!rid || !tgl) return pesan("Pilih kelas dan tanggal.");
    pesan("Memuat...");
    try {
      rombelAktif = rid;
      daftar = await ambilSantri(rid);
      const ids = daftar.map(s => s.id);
      existing = {};
      if (ids.length) {
        const { data, error } = await sb.from("jurnal_tahsin")
          .select("santri_id, kitab, halaman, keterangan")
          .eq("tanggal", tgl).in("santri_id", ids);
        if (error) throw new Error(error.message);
        (data || []).forEach(j => existing[j.santri_id + "|" + j.kitab] = j);
      }
      renderJurnal();
      pesan(daftar.length ? "" : "Belum ada santri di kelas ini.");
    } catch (e) {
      pesan("Gagal memuat: " + e.message);
    }
  }

  function renderJurnal() {
    const box = $("jDaftar");
    box.innerHTML = "";
    daftar.forEach(s => {
      const ex = existing[s.id + "|" + kitab] || {};
      const div = document.createElement("div");
      div.className = "santri";
      div.dataset.santri = s.id;
      div.innerHTML = `
        <div class="nama">${esc(s.nama_lengkap)}</div>
        <div class="nis">${esc(s.nis || "-")}</div>
        <div class="baris">
          <input class="halaman" type="number" inputmode="numeric" min="0" placeholder="Hal" value="${ex.halaman ?? ""}">
          <div class="ket">
            <button type="button" class="L ${ex.keterangan === "L" ? "aktif" : ""}" data-v="L">L</button>
            <button type="button" class="CL ${ex.keterangan === "CL" ? "aktif" : ""}" data-v="CL">CL</button>
            <button type="button" class="TL ${ex.keterangan === "TL" ? "aktif" : ""}" data-v="TL">TL</button>
          </div>
        </div>`;
      div.querySelectorAll(".ket button").forEach(b => b.onclick = () => {
        const sudah = b.classList.contains("aktif");
        div.querySelectorAll(".ket button").forEach(x => x.classList.remove("aktif"));
        if (!sudah) b.classList.add("aktif");
      });
      box.appendChild(div);
    });
    setBar(daftar.length > 0);
  }

  async function simpanJurnal() {
    const tgl = $("jTanggal").value;
    const cards = [...document.querySelectorAll("#jDaftar .santri")];
    const rows = [], hapus = [], salah = [];
    cards.forEach(c => c.style.borderColor = "");

    cards.forEach(card => {
      const sid = Number(card.dataset.santri);
      const hal = card.querySelector(".halaman").value.trim();
      const ket = card.querySelector(".ket button.aktif")?.dataset.v || "";
      const ex = existing[sid + "|" + kitab];

      if (hal === "" && ket === "") {
        if (ex) hapus.push(sid);
        return;
      }
      const h = Number(hal);
      if (hal === "" || ket === "" || !Number.isInteger(h) || h < 0) {
        salah.push(card);
        return;
      }
      rows.push({
        santri_id: sid, rombel_id: rombelAktif, semester_id: sem.id,
        tanggal: tgl, kitab, halaman: h, keterangan: ket,
        diisi_oleh: me.id, updated_at: new Date().toISOString()
      });
    });

    if (salah.length) {
      salah.forEach(c => c.style.borderColor = "#dc3545");
      salah[0].scrollIntoView({ behavior: "smooth", block: "center" });
      return pesan("Santri bertanda merah perlu halaman dan keterangan (L/CL/TL) yang lengkap.");
    }
    if (!rows.length && !hapus.length) return pesan("Belum ada data yang diisi.");

    pesan("Menyimpan...");
    if (rows.length) {
      const { error } = await sb.from("jurnal_tahsin").upsert(rows, { onConflict: "santri_id,tanggal,kitab" });
      if (error) return pesan("Gagal menyimpan: " + error.message);
    }
    if (hapus.length) {
      const { error } = await sb.from("jurnal_tahsin").delete()
        .eq("tanggal", tgl).eq("kitab", kitab).in("santri_id", hapus);
      if (error) return pesan("Gagal menghapus: " + error.message);
    }
    await jurnalMuat();
    pesan("Tersimpan " + rows.length + " jurnal.");
  }

  // ===== CATATAN PEKANAN / BULANAN =====
  async function catatanMuat() {
    const rid = Number($("cRombel").value), jenis = $("cJenis").value, tgl = $("cTanggal").value;
    if (!rid || !tgl) return pesan("Pilih kelas dan tanggal.");
    const { mulai } = batasPeriode(jenis, tgl);
    updatePeriode();
    pesan("Memuat...");
    try {
      rombelAktif = rid;
      daftar = await ambilSantri(rid);
      const ids = daftar.map(s => s.id);
      existingCatatan = {};
      if (ids.length) {
        const { data, error } = await sb.from("catatan_periodik")
          .select("santri_id, catatan")
          .eq("jenis", jenis).eq("periode_mulai", mulai).in("santri_id", ids);
        if (error) throw new Error(error.message);
        (data || []).forEach(c => existingCatatan[c.santri_id] = c.catatan);
      }
      renderCatatan();
      pesan(daftar.length ? "" : "Belum ada santri di kelas ini.");
    } catch (e) {
      pesan("Gagal memuat: " + e.message);
    }
  }

  function renderCatatan() {
    const box = $("cDaftar");
    box.innerHTML = "";
    daftar.forEach(s => {
      const div = document.createElement("div");
      div.className = "santri";
      div.innerHTML = `
        <div class="nama">${esc(s.nama_lengkap)}</div>
        <div class="nis">${esc(s.nis || "-")}</div>
        <textarea data-santri="${s.id}" placeholder="Catatan perkembangan periode ini...">${esc(existingCatatan[s.id] || "")}</textarea>`;
      box.appendChild(div);
    });
    setBar(daftar.length > 0);
  }

  async function simpanCatatan() {
    const jenis = $("cJenis").value;
    const { mulai } = batasPeriode(jenis, $("cTanggal").value);
    const rows = [], hapus = [];

    document.querySelectorAll("#cDaftar textarea").forEach(t => {
      const sid = Number(t.dataset.santri), isi = t.value.trim();
      if (!isi) {
        if (existingCatatan[sid]) hapus.push(sid);
        return;
      }
      rows.push({
        santri_id: sid, semester_id: sem.id, jenis,
        periode_mulai: mulai, catatan: isi,
        diisi_oleh: me.id, updated_at: new Date().toISOString()
      });
    });

    if (!rows.length && !hapus.length) return pesan("Belum ada catatan yang diisi.");

    pesan("Menyimpan...");
    if (rows.length) {
      const { error } = await sb.from("catatan_periodik").upsert(rows, { onConflict: "santri_id,jenis,periode_mulai" });
      if (error) return pesan("Gagal menyimpan: " + error.message);
    }
    if (hapus.length) {
      const { error } = await sb.from("catatan_periodik").delete()
        .eq("jenis", jenis).eq("periode_mulai", mulai).in("santri_id", hapus);
      if (error) return pesan("Gagal menghapus: " + error.message);
    }
    await catatanMuat();
    pesan("Tersimpan " + rows.length + " catatan.");
  }

  // ===== EVENT =====
  $("tabJurnal").onclick = () => bukaTab("jurnal");
  $("tabCatatan").onclick = () => bukaTab("catatan");
  $("jMuat").onclick = jurnalMuat;
  $("cMuat").onclick = catatanMuat;
  $("cJenis").onchange = updatePeriode;
  $("cTanggal").onchange = updatePeriode;
  $("simpanBtn").onclick = () => modeAktif === "jurnal" ? simpanJurnal() : simpanCatatan();
  document.querySelectorAll("#jKitab button").forEach(b => b.onclick = () => {
    kitab = b.dataset.k;
    document.querySelectorAll("#jKitab button").forEach(x => x.classList.toggle("aktif", x === b));
    if (daftar.length && modeAktif === "jurnal") renderJurnal();
  });

  init();
</script>
</body>
</html>

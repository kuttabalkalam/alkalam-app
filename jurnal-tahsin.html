<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jurnal Tahsin - Kuttab Al-Kalam</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
<link rel="stylesheet" href="ui.css">
<style>
  .nav-tabs .nav-link { color: #1a1a1a; }
  .nav-tabs .nav-link.active { background: #f2c94c; border-color: #d4a52a; color: #1a1a1a; font-weight: 600; }
  .kitab-btn.active { background: #1a1a1a; color: #f2c94c; border-color: #1a1a1a; }
  .btn-ket.L.active { background: #28a745; color: #fff; border-color: #28a745; }
  .btn-ket.CL.active { background: #f0ad4e; color: #fff; border-color: #f0ad4e; }
  .btn-ket.TL.active { background: #dc3545; color: #fff; border-color: #dc3545; }
  .form-jurnal { border-top: 1px dashed #ccc; padding-top: 10px; }
  .badge-kitab { background: #1a1a1a; color: #f2c94c; }
</style>
</head>
<body class="hold-transition sidebar-mini">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="ui.js"></script>

<script>
  const KITAB = { tilawati: "Tilawati", quran: "Quran", tahfidz: "Tahfidz" };
  const LABEL = {
    tilawati: { unit: "Jilid", angka: "Halaman" },
    quran:    { unit: "Juz",   angka: "Halaman" },
    tahfidz:  { unit: "Surat", angka: "Ayat" }
  };
  const SURAH = [
    "Al-Fatihah","Al-Baqarah","Ali Imran","An-Nisa","Al-Ma'idah","Al-An'am","Al-A'raf","Al-Anfal","At-Taubah","Yunus",
    "Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Taha",
    "Al-Anbiya","Al-Hajj","Al-Mu'minun","An-Nur","Al-Furqan","Asy-Syu'ara","An-Naml","Al-Qasas","Al-Ankabut","Ar-Rum",
    "Luqman","As-Sajdah","Al-Ahzab","Saba","Fatir","Yasin","As-Saffat","Sad","Az-Zumar","Gafir",
    "Fussilat","Asy-Syura","Az-Zukhruf","Ad-Dukhan","Al-Jasiyah","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf",
    "Az-Zariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah","Al-Hadid","Al-Mujadilah","Al-Hasyr","Al-Mumtahanah",
    "As-Saff","Al-Jumu'ah","Al-Munafiqun","At-Tagabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij",
    "Nuh","Al-Jinn","Al-Muzzammil","Al-Muddassir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","Abasa",
    "At-Takwir","Al-Infitar","Al-Muthaffifin","Al-Insyiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Gasyiyah","Al-Fajr","Al-Balad",
    "Asy-Syams","Al-Lail","Ad-Duha","Asy-Syarh","At-Tin","Al-Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-Adiyat",
    "Al-Qari'ah","At-Takasur","Al-Asr","Al-Humazah","Al-Fil","Quraisy","Al-Ma'un","Al-Kautsar","Al-Kafirun","An-Nasr",
    "Al-Lahab","Al-Ikhlas","Al-Falaq","An-Nas"
  ];
  const OPSI = {
    tilawati: Array.from({ length: 4 }, (_, i) => [String(i + 1), "Jilid " + (i + 1)]),
    quran:    Array.from({ length: 30 }, (_, i) => [String(i + 1), "Juz " + (i + 1)]),
    tahfidz:  SURAH.map((n, i) => [String(i + 1), (i + 1) + ". " + n])
  };
  const KODE_QURAN = ["tilawah", "tahfidz", "kitabah"];
  const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

  const fmt = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const tglIndo = iso => { const d = new Date(iso + "T00:00:00"); return d.getDate() + " " + BULAN[d.getMonth()] + " " + d.getFullYear(); };
  const namaUnit = (k, u) => {
    const o = (OPSI[k] || []).find(x => x[0] === String(u));
    return o ? o[1] : (u ?? "-");
  };

  // Pekan = Senin s.d. Minggu. Bulan = tanggal 1 s.d. akhir bulan.
  function periode(jenis, iso) {
    const d = new Date(iso + "T00:00:00");
    if (jenis === "pekan") {
      const senin = new Date(d);
      senin.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      const minggu = new Date(senin);
      minggu.setDate(senin.getDate() + 6);
      return { mulai: fmt(senin), selesai: fmt(minggu) };
    }
    return {
      mulai: fmt(new Date(d.getFullYear(), d.getMonth(), 1)),
      selesai: fmt(new Date(d.getFullYear(), d.getMonth() + 1, 0))
    };
  }

  KUTTAB.halaman({
    aktif: "jurnal-tahsin",
    judul: "Jurnal Tahsin",
    roles: ["admin", "guru"],
    render: async ({ sb, me, sem, konten, toast, gagal, peringatan, konfirmasi, esc }) => {
      if (!sem) {
        konten.innerHTML = '<div class="alert alert-warning">Belum ada semester aktif.</div>';
        return;
      }

      const [rb, pm] = await Promise.all([
        sb.from("rombel").select("id, nama").eq("tahun_ajaran_id", sem.tahun_ajaran_id).order("nama"),
        sb.from("penugasan_mapel").select("rombel_id, pegawai_id, mapel:mapel_id(kode)")
      ]);
      if (rb.error) return gagal(rb.error);
      if (pm.error) return gagal(pm.error);

      const quranSet = new Set((pm.data || [])
        .filter(x => me.peran === "admin" || x.pegawai_id === me.id)
        .filter(x => KODE_QURAN.includes(x.mapel?.kode))
        .map(x => x.rombel_id));
      const rombelList = (rb.data || []).filter(r => me.peran === "admin" || quranSet.has(r.id));

      if (!rombelList.length) {
        konten.innerHTML = '<div class="alert alert-info">Jurnal tahsin hanya tersedia untuk guru Quran di kelas tahun ajaran ini.</div>';
        return;
      }

      // Penguji default untuk pendaftaran ujian jilid
      let pengujiDefault = null;
      const pd = await sb.rpc("penguji_default");
      if (!pd.error && pd.data && pd.data.length) {
        pengujiDefault = { id: pd.data[0].id, nama: pd.data[0].nama };
      }

      konten.innerHTML = `
        <div class="card card-outline card-warning"><div class="card-body">
          <div class="form-row align-items-end">
            <div class="col-12 col-md-4 mb-2">
              <label class="small mb-1">Kelas</label>
              <select id="rombel" class="form-control">
                ${rombelList.map(r => `<option value="${r.id}">${esc(r.nama)}</option>`).join("")}
              </select>
            </div>
            <div class="col-6 col-md-3 mb-2">
              <label class="small mb-1">Tanggal</label>
              <input type="date" id="tanggal" class="form-control">
            </div>
            <div class="col-6 col-md-5 mb-2">
              <label class="small mb-1">Kitab</label>
              <div class="btn-group d-flex" role="group">
                <button type="button" class="btn btn-outline-dark kitab-btn active" data-kitab="tilawati">Tilawati</button>
                <button type="button" class="btn btn-outline-dark kitab-btn" data-kitab="quran">Quran</button>
                <button type="button" class="btn btn-outline-dark kitab-btn" data-kitab="tahfidz">Tahfidz</button>
              </div>
            </div>
          </div>
        </div></div>

        <ul class="nav nav-tabs mb-3">
          <li class="nav-item"><a class="nav-link active" href="#" data-tab="jurnal">Catat Jurnal</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-tab="catatan">Catatan Pekanan/Bulanan</a></li>
        </ul>

        <div id="panelJurnal"></div>

        <div id="panelCatatan" style="display:none">
          <div class="card card-outline card-info"><div class="card-body">
            <div class="form-row align-items-end">
              <div class="col-6 mb-2">
                <label class="small mb-1">Jenis</label>
                <select id="cJenis" class="form-control">
                  <option value="pekan">Pekanan</option>
                  <option value="bulan">Bulanan</option>
                </select>
              </div>
              <div class="col-6 mb-2">
                <label class="small mb-1">Tanggal dalam periode</label>
                <input type="date" id="cTanggal" class="form-control">
              </div>
            </div>
            <p class="small text-muted mb-0" id="cPeriode"></p>
          </div></div>
          <div id="cList"></div>
          <button class="btn btn-kuning" id="cSimpan" style="display:none"><i class="fas fa-save"></i> Simpan Catatan</button>
        </div>`;

      const $ = id => document.getElementById(id);
      const tgl = () => $("tanggal").value;
      const rid = () => Number($("rombel").value);

      let tab = "jurnal", kitab = "tilawati";
      let santri = [], jurnalRaw = [];
      let lastMap = {}, lastKitab = {}, todayMap = {}, catatanMap = {};

      $("tanggal").value = fmt(new Date());
      $("cTanggal").value = fmt(new Date());

      // lastMap: jurnal terakhir per santri (semua kitab)
      // lastKitab: jurnal terakhir per santri per kitab (dipakai untuk jilid/juz/surat)
      // todayMap: jurnal hari ini untuk kitab yang dipilih
      function hitungMap() {
        lastMap = {}; lastKitab = {}; todayMap = {};
        jurnalRaw.forEach(j => {
          if (!lastMap[j.santri_id]) lastMap[j.santri_id] = j;
          const kk = j.santri_id + "|" + j.kitab;
          if (!lastKitab[kk]) lastKitab[kk] = j;
          if (j.kitab === kitab && j.tanggal === tgl() && !todayMap[j.santri_id]) todayMap[j.santri_id] = j;
        });
      }

      function ringkas(j) {
        const lbl = LABEL[j.kitab] || LABEL.tilawati;
        return `<span class="badge badge-kitab">${esc(KITAB[j.kitab] || j.kitab)}</span>
          ${esc(namaUnit(j.kitab, j.unit))} · ${lbl.angka} ${j.halaman} · <strong>${esc(j.keterangan)}</strong> · ${tglIndo(j.tanggal)}`;
      }

      function renderJurnal() {
        const lbl = LABEL[kitab];
        if (!santri.length) {
          $("panelJurnal").innerHTML = '<div class="alert alert-light">Belum ada santri di kelas ini.</div>';
          return;
        }
        const bisaDaftar = kitab === "tilawati" || kitab === "quran";

        $("panelJurnal").innerHTML = santri.map((s, i) => {
          const hari = todayMap[s.id];
          const last = lastMap[s.id];
          const lastK = lastKitab[s.id + "|" + kitab];
          return `<div class="card mb-2">
            <div class="card-body py-2">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <div class="font-weight-bold">${i + 1}. ${esc(s.nama_lengkap)}</div>
                  <small class="text-muted">${esc(s.nis || "-")}</small>
                </div>
                ${hari ? '<span class="badge badge-success">sudah hari ini</span>' : ""}
              </div>
              <div class="small mt-1">${last ? ringkas(last) : '<span class="text-muted">Belum ada jurnal</span>'}</div>
              <button class="btn btn-sm btn-kuning mt-2" data-buka="${s.id}">
                <i class="fas fa-pen"></i> ${hari ? "Ubah" : "Isi"} ${esc(lbl.angka.toLowerCase())} ${esc(KITAB[kitab])}
              </button>
              ${bisaDaftar && lastK ? `
              <button class="btn btn-sm btn-outline-dark mt-2 ml-1" data-daftar="${s.id}">
                <i class="fas fa-award"></i> Daftarkan ujian ${esc(KITAB[kitab])}
              </button>` : ""}
              <div class="form-jurnal mt-2" id="form-${s.id}" style="display:none"></div>
            </div>
          </div>`;
        }).join("");

        $("panelJurnal").querySelectorAll("[data-buka]").forEach(b =>
          b.onclick = () => bukaForm(Number(b.dataset.buka)));
        $("panelJurnal").querySelectorAll("[data-daftar]").forEach(b =>
          b.onclick = () => daftarUjian(Number(b.dataset.daftar)));
      }

      function bukaForm(sid) {
        const box = $("form-" + sid);
        if (box.style.display !== "none") { box.style.display = "none"; return; }
        document.querySelectorAll(".form-jurnal").forEach(f => f.style.display = "none");

        const hari = todayMap[sid] || {};
        const lbl = LABEL[kitab];
        box.innerHTML = `
          <div class="form-row">
            <div class="col-12 col-md-6 mb-2">
              <label class="small mb-1">${lbl.unit}</label>
              <select class="form-control f-unit">
                <option value="">-- pilih ${esc(lbl.unit.toLowerCase())} --</option>
                ${OPSI[kitab].map(([v, t]) =>
                  `<option value="${v}" ${String(hari.unit ?? "") === v ? "selected" : ""}>${esc(t)}</option>`).join("")}
              </select>
            </div>
            <div class="col-12 col-md-3 mb-2">
              <label class="small mb-1">${lbl.angka}</label>
              <input type="number" min="0" step="1" class="form-control f-angka" value="${hari.halaman ?? ""}">
            </div>
            <div class="col-12 col-md-3 mb-2">
              <label class="small mb-1">Keterangan</label>
              <div class="btn-group btn-group-sm d-flex" data-ket="${esc(hari.keterangan || "")}">
                ${["L", "CL", "TL"].map(v =>
                  `<button type="button" class="btn btn-outline-dark btn-ket ${v} ${hari.keterangan === v ? "active" : ""}" data-v="${v}">${v}</button>`).join("")}
              </div>
            </div>
          </div>
          <button class="btn btn-kuning btn-sm f-simpan"><i class="fas fa-save"></i> Simpan</button>`;
        box.style.display = "block";

        box.querySelectorAll(".btn-ket").forEach(b => b.onclick = () => {
          box.querySelectorAll(".btn-ket").forEach(x => x.classList.remove("active"));
          b.classList.add("active");
          box.querySelector(".btn-group").dataset.ket = b.dataset.v;
        });
        box.querySelector(".f-simpan").onclick = () => simpanJurnal(sid, box);
      }

      async function simpanJurnal(sid, box) {
        const unit = box.querySelector(".f-unit").value;
        const angkaStr = box.querySelector(".f-angka").value.trim();
        const angka = Number(angkaStr);
        const ket = box.querySelector(".btn-group").dataset.ket;
        const lbl = LABEL[kitab];

        if (!unit) return peringatan("Pilih " + lbl.unit.toLowerCase() + " terlebih dahulu.");
        if (angkaStr === "" || !Number.isInteger(angka) || angka < 0)
          return peringatan("Isi " + lbl.angka.toLowerCase() + " dengan angka 0 atau lebih.");
        if (!ket) return peringatan("Pilih L, CL, atau TL.");

        const btn = box.querySelector(".f-simpan");
        btn.disabled = true;
        const { error } = await sb.from("jurnal_tahsin").upsert({
          santri_id: sid, rombel_id: rid(), semester_id: sem.id,
          tanggal: tgl(), kitab, unit, halaman: angka, keterangan: ket,
          diisi_oleh: me.id, updated_at: new Date().toISOString()
        }, { onConflict: "santri_id,tanggal,kitab" });
        btn.disabled = false;
        if (error) return gagal(error);

        const nama = (santri.find(s => s.id === sid) || {}).nama_lengkap || "";
        toast("Jurnal " + nama + " tersimpan.");
        await muat();
      }

      // ===== PENDAFTARAN UJIAN JILID DARI JURNAL =====
            async function daftarUjian(sid) {
        const sk = santri.find(s => s.id === sid);
        if (!sk) return;

        const terakhir = lastKitab[sid + "|" + kitab];
        if (!terakhir) return peringatan("Belum ada jurnal " + KITAB[kitab] + " untuk " + sk.nama_lengkap + ".");
        if (!pengujiDefault) return peringatan("Belum ada penguji default. Hubungi admin.");

        const jenis = kitab === "quran" ? "Quran" : "Tilawati";
        const jilid = namaUnit(kitab, terakhir.unit);

        const { data: aktif, error: e1 } = await sb.from("pengajuan_jilid")
          .select("id, status, jilid_juz")
          .eq("santri_id", sid).in("status", ["Diajukan", "Dijadwalkan"]).maybeSingle();
        if (e1) return gagal(e1);
        if (aktif) {
          return peringatan(sk.nama_lengkap + " masih punya pengajuan " + aktif.jilid_juz +
            " berstatus " + aktif.status + ". Selesaikan atau batalkan dulu.");
        }

        const hariIni = fmt(new Date());
        const jamOpsi = [];
        for (let m = 7 * 60 + 30; m <= 11 * 60 + 30; m += 30) {
          jamOpsi.push(String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"));
        }

        const r = await Swal.fire({
          title: "Daftarkan ujian " + jenis + "?",
          html: `
            <div class="text-left small mb-2">${esc(sk.nama_lengkap)} · ${esc(jilid)}<br>
              Penguji: <b>${esc(pengujiDefault.nama)}</b></div>
            <label class="small mb-1">Tanggal ujian</label>
            <input id="swTgl" type="date" class="swal2-input" min="${hariIni}" value="${hariIni}">
            <label class="small mb-1 mt-2">Jam ujian</label>
            <select id="swJam" class="swal2-select">
              ${jamOpsi.map(j => `<option value="${j}">${j}</option>`).join("")}
            </select>
            <p class="small text-muted mt-2">Penguji akan menyetujui, mengubah jadwal, atau menolak.</p>`,
          showCancelButton: true,
          confirmButtonText: "Daftarkan",
          cancelButtonText: "Batal",
          confirmButtonColor: "#1a1a1a",
          preConfirm: () => {
            const tgl = document.getElementById("swTgl").value;
            const jam = document.getElementById("swJam").value;
            if (!tgl) { Swal.showValidationMessage("Pilih tanggal ujian."); return false; }
            return { tgl, jam };
          }
        });
        if (!r.isConfirmed) return;

        const { data: baru, error } = await sb.from("pengajuan_jilid").insert({
          santri_id: sid, rombel_id: rid(), jenis, jilid_juz: jilid,
          status: "Diajukan",
          tanggal_ujian: r.value.tgl, jam_ujian: r.value.jam,
          penguji_id: pengujiDefault.id,
          pengaju_id: me.id, diubah_oleh: me.id
        }).select("id").single();
        if (error) return gagal(error);

        const w = await WA.kirim("pengajuan_baru", { pengajuan_id: baru.id });
        if (w.ok) toast("Ujian " + jenis + " " + sk.nama_lengkap + " didaftarkan. Penguji sudah diberi tahu.");
        else peringatan("Ujian didaftarkan, tetapi WhatsApp ke penguji belum terkirim: " + w.pesan);
      }
      async function muat() {
        const id = rid();
        if (!id) return;
        const [kr, jr] = await Promise.all([
          sb.from("keanggotaan_rombel").select("santri:santri_id(id, nis, nama_lengkap)")
            .eq("rombel_id", id).eq("tahun_ajaran_id", sem.tahun_ajaran_id),
          sb.from("jurnal_tahsin").select("santri_id, kitab, unit, halaman, keterangan, tanggal, updated_at")
            .eq("rombel_id", id).eq("semester_id", sem.id)
            .order("tanggal", { ascending: false })
            .order("updated_at", { ascending: false })
        ]);
        if (kr.error) return gagal(kr.error);
        if (jr.error) return gagal(jr.error);

        santri = (kr.data || []).map(x => x.santri).filter(Boolean)
          .sort((a, b) => a.nama_lengkap.localeCompare(b.nama_lengkap));
        jurnalRaw = jr.data || [];
        hitungMap();
        renderJurnal();
        if (tab === "catatan") muatCatatan();
      }

      // ===== CATATAN PEKANAN / BULANAN =====
      async function muatCatatan() {
        const jenis = $("cJenis").value;
        const { mulai, selesai } = periode(jenis, $("cTanggal").value || tgl());
        $("cPeriode").textContent = "Periode: " + tglIndo(mulai) + " s.d. " + tglIndo(selesai);

        catatanMap = {};
        if (santri.length) {
          const { data, error } = await sb.from("catatan_periodik").select("santri_id, catatan")
            .eq("jenis", jenis).eq("periode_mulai", mulai).in("santri_id", santri.map(s => s.id));
          if (error) return gagal(error);
          (data || []).forEach(c => catatanMap[c.santri_id] = c.catatan);
        }

        $("cList").innerHTML = santri.length ? santri.map(s => `
          <div class="card mb-2"><div class="card-body py-2">
            <div class="font-weight-bold">${esc(s.nama_lengkap)}</div>
            <textarea class="form-control mt-1 c-isi" rows="2" data-santri="${s.id}"
              placeholder="Catatan perkembangan periode ini...">${esc(catatanMap[s.id] || "")}</textarea>
          </div></div>`).join("") : '<div class="alert alert-light">Belum ada santri di kelas ini.</div>';
        $("cSimpan").style.display = santri.length ? "" : "none";
      }

      async function simpanCatatan() {
        const jenis = $("cJenis").value;
        const { mulai } = periode(jenis, $("cTanggal").value || tgl());
        const rows = [], hapus = [];

        document.querySelectorAll(".c-isi").forEach(t => {
          const sid = Number(t.dataset.santri), isi = t.value.trim();
          if (!isi) { if (catatanMap[sid]) hapus.push(sid); return; }
          rows.push({
            santri_id: sid, semester_id: sem.id, jenis, periode_mulai: mulai,
            catatan: isi, diisi_oleh: me.id, updated_at: new Date().toISOString()
          });
        });

        if (!rows.length && !hapus.length) return peringatan("Belum ada catatan yang diisi.");

        if (rows.length) {
          const { error } = await sb.from("catatan_periodik")
            .upsert(rows, { onConflict: "santri_id,jenis,periode_mulai" });
          if (error) return gagal(error);
        }
        if (hapus.length) {
          const { error } = await sb.from("catatan_periodik").delete()
            .eq("jenis", jenis).eq("periode_mulai", mulai).in("santri_id", hapus);
          if (error) return gagal(error);
        }

        toast("Catatan tersimpan.");
        muatCatatan();
      }

      // ===== NAVIGASI & EVENT =====
      function setTab(t) {
        tab = t;
        konten.querySelectorAll("[data-tab]").forEach(a => a.classList.toggle("active", a.dataset.tab === t));
        $("panelJurnal").style.display = t === "jurnal" ? "" : "none";
        $("panelCatatan").style.display = t === "catatan" ? "" : "none";
        if (t === "catatan") muatCatatan();
      }

      konten.querySelectorAll("[data-tab]").forEach(a => a.onclick = e => {
        e.preventDefault();
        setTab(a.dataset.tab);
      });

      konten.querySelectorAll("[data-kitab]").forEach(b => b.onclick = () => {
        kitab = b.dataset.kitab;
        konten.querySelectorAll("[data-kitab]").forEach(x => x.classList.toggle("active", x === b));
        hitungMap();
        renderJurnal();
      });

      $("rombel").onchange = muat;
      $("tanggal").onchange = () => { hitungMap(); renderJurnal(); };
      $("cJenis").onchange = muatCatatan;
      $("cTanggal").onchange = muatCatatan;
      $("cSimpan").onclick = simpanCatatan;

      setTab("jurnal");
      muat();
    }
  });
</script>
</body>
</html>

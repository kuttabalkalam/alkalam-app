<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengaturan - Kuttab Al-Kalam</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
<link rel="stylesheet" href="ui.css">
<style>
  .tabel-wrap { overflow-x: auto; }
  .tabel-wrap th, .tabel-wrap td { white-space: nowrap; vertical-align: middle; }
  .total-ok { color: #28a745; font-weight: 700; }
  .total-bad { color: #dc3545; font-weight: 700; }
  .nav-tabs .nav-link { color: #1a1a1a; }
  .nav-tabs .nav-link.active { background: #f2c94c; border-color: #d4a52a; color: #1a1a1a; font-weight: 600; }
</style>
</head>
<body class="hold-transition sidebar-mini">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="ui.js"></script>

<script>
  KUTTAB.halaman({
    aktif: "pengaturan",
    judul: "Pengaturan",
    roles: ["admin"],
    render: async ({ sb, konten, toast, gagal, peringatan, esc }) => {
      konten.innerHTML = `
        <ul class="nav nav-tabs mb-3">
          <li class="nav-item"><a class="nav-link active" href="#" data-tab="pendaftaran">Pendaftaran</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-tab="tahun">Tahun Ajaran</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-tab="bobot">Bobot Nilai</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-tab="komponen">Komponen & Mapel</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-tab="aspek">Aspek Deskripsi</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-tab="rumus">Rumus & Kehadiran</a></li>
        </ul>
        <div id="panel"></div>`;

      const $ = id => document.getElementById(id);
      const panel = $("panel");

      // ===== PENDAFTARAN =====
      async function tabPendaftaran() {
        panel.innerHTML = '<p class="text-muted">Memuat...</p>';
        const [pg, ta] = await Promise.all([
          sb.from("pengaturan").select("nilai").eq("kunci", "pendaftaran_buka").maybeSingle(),
          sb.from("tahun_ajaran").select("id, kode, aktif, pendaftaran").order("kode")
        ]);
        if (pg.error) return gagal(pg.error);
        if (ta.error) return gagal(ta.error);

        const buka = Number(pg.data?.nilai) === 1;
        const tahun = ta.data || [];

        panel.innerHTML = `
          <div class="card card-outline card-warning"><div class="card-body">
            <div class="custom-control custom-switch mb-3">
              <input type="checkbox" class="custom-control-input" id="swBuka" ${buka ? "checked" : ""}>
              <label class="custom-control-label" for="swBuka"><strong>Pendaftaran dibuka</strong></label>
            </div>
            <div class="form-group">
              <label class="small mb-1">Tahun ajaran yang menerima pendaftaran</label>
              <select id="selTahunDaftar" class="form-control" style="max-width:280px">
                <option value="">-- belum dipilih --</option>
                ${tahun.map(t => `<option value="${t.id}" ${t.pendaftaran ? "selected" : ""}>${esc(t.kode)}</option>`).join("")}
              </select>
            </div>
            <p class="small text-muted">Pendaftaran hanya bisa dibuka jika tahun pendaftaran sudah dipilih.</p>
            <button class="btn btn-kuning" id="btnSimpanDaftar"><i class="fas fa-save"></i> Simpan</button>
          </div></div>`;

        $("btnSimpanDaftar").onclick = async () => {
          const bukaBaru = $("swBuka").checked;
          const idPilih = Number($("selTahunDaftar").value) || null;
          if (bukaBaru && !idPilih) return peringatan("Pilih tahun ajaran pendaftaran sebelum membuka pendaftaran.");

          let { error } = await sb.from("tahun_ajaran").update({ pendaftaran: false }).eq("pendaftaran", true);
          if (error) return gagal(error);
          if (idPilih) {
            ({ error } = await sb.from("tahun_ajaran").update({ pendaftaran: true }).eq("id", idPilih));
            if (error) return gagal(error);
          }
          ({ error } = await sb.from("pengaturan").update({ nilai: bukaBaru ? 1 : 0 }).eq("kunci", "pendaftaran_buka"));
          if (error) return gagal(error);

          toast("Pengaturan pendaftaran tersimpan.");
          tabPendaftaran();
        };
      }

      // ===== TAHUN AJARAN =====
      async function tabTahun() {
        panel.innerHTML = '<p class="text-muted">Memuat...</p>';
        const [ta, sm] = await Promise.all([
          sb.from("tahun_ajaran").select("id, kode, aktif, pendaftaran").order("kode"),
          sb.from("semester").select("id, nomor, aktif, tahun_ajaran_id")
        ]);
        if (ta.error) return gagal(ta.error);
        if (sm.error) return gagal(sm.error);

        const daftarTA = ta.data || [];
        const semesterDi = id => (sm.data || []).filter(s => s.tahun_ajaran_id === id).sort((a, b) => a.nomor - b.nomor);

        panel.innerHTML = `
          <div class="card card-outline card-warning"><div class="card-body p-0"><div class="tabel-wrap">
            <table class="table table-sm mb-0">
              <thead><tr><th>Tahun ajaran</th><th>Status</th><th>Semester</th><th>Aksi</th></tr></thead>
              <tbody>
                ${daftarTA.map(t => `<tr>
                  <td>${esc(t.kode)}</td>
                  <td>${t.aktif ? '<span class="badge badge-success">aktif</span>' : '<span class="badge badge-secondary">tidak aktif</span>'}</td>
                  <td>${semesterDi(t.id).map(s => `<span class="badge ${s.aktif ? "badge-warning" : "badge-light border"}">${s.nomor === 1 ? "Ganjil" : "Genap"}</span>`).join(" ")}</td>
                  <td>${t.aktif ? "" : `<button class="btn btn-sm btn-hitam" data-aktifkan="${esc(t.kode)}">Aktifkan</button>`}</td>
                </tr>`).join("")}
              </tbody>
            </table>
          </div></div></div>
          <div class="card card-outline card-info mt-3"><div class="card-body">
            <h6 class="font-weight-bold">Tambah tahun ajaran baru</h6>
            <div class="form-row align-items-end">
              <div class="col-8 col-md-4 mb-2">
                <label class="small mb-1">Kode (contoh 2027-2028)</label>
                <input id="tBaru" class="form-control" placeholder="2027-2028">
              </div>
              <div class="col-4 mb-2"><button class="btn btn-kuning" id="btnTambahTa"><i class="fas fa-plus"></i> Tambah</button></div>
            </div>
            <p class="small text-muted mb-0">Tahun baru dibuat tidak aktif, dengan dua semester. Aktifkan setelah rombel dan penugasannya siap.</p>
          </div></div>`;

        panel.querySelectorAll("[data-aktifkan]").forEach(b => b.onclick = async () => {
          const kode = b.dataset.aktifkan;
          const r = await Swal.fire({
            icon: "warning",
            title: "Aktifkan tahun ajaran " + kode + "?",
            html: "Setelah aktif, guru langsung bekerja di rombel tahun ini.<br><br>Ketik <b>" + kode + "</b> untuk konfirmasi.",
            input: "text",
            inputPlaceholder: kode,
            showCancelButton: true,
            confirmButtonText: "Aktifkan",
            cancelButtonText: "Batal",
            confirmButtonColor: "#1a1a1a",
            cancelButtonColor: "#6c757d",
            preConfirm: v => {
              if ((v || "").trim() !== kode) {
                Swal.showValidationMessage("Ketik kode tahun dengan benar.");
                return false;
              }
              return true;
            }
          });
          if (!r.isConfirmed) return;

          const { error } = await sb.rpc("aktifkan_tahun_ajaran", { p_kode: kode });
          if (error) return gagal(error);
          toast("Tahun ajaran " + kode + " aktif.");
          tabTahun();
        });

        $("btnTambahTa").onclick = async () => {
          const kode = $("tBaru").value.trim();
          if (!/^\d{4}-\d{4}$/.test(kode)) return peringatan("Kode harus berformat 2027-2028.");
          if (daftarTA.some(t => t.kode === kode)) return peringatan("Tahun ajaran " + kode + " sudah ada.");

          const { data: baru, error: e1 } = await sb.from("tahun_ajaran")
            .insert({ kode, aktif: false }).select("id").single();
          if (e1) return gagal(e1);

          const { error: e2 } = await sb.from("semester")
            .insert([1, 2].map(n => ({ tahun_ajaran_id: baru.id, nomor: n, aktif: false })));
          if (e2) return gagal(e2);

          toast("Tahun ajaran " + kode + " ditambahkan.");
          tabTahun();
        };
      }

      // ===== BOBOT NILAI =====
      async function tabBobot() {
        panel.innerHTML = '<p class="text-muted">Memuat...</p>';
        const [mp, kn, bn] = await Promise.all([
          sb.from("mata_pelajaran").select("id, kode, nama, urutan, aktif").order("urutan"),
          sb.from("komponen_nilai").select("id, kode, nama, urutan").order("urutan"),
          sb.from("bobot_nilai").select("mapel_id, komponen_id, bobot")
        ]);
        for (const r of [mp, kn, bn]) if (r.error) return gagal(r.error);

        const bobot = {};
        (bn.data || []).forEach(b => bobot[b.mapel_id + "|" + b.komponen_id] = Number(b.bobot));
        const komp = kn.data || [];

        panel.innerHTML = `
          <p class="small text-muted">Isi bobot tiap komponen per mapel. Total harus 100 sebelum disimpan. Kosong atau 0 berarti komponen tidak dipakai di mapel itu.</p>
          <div class="card"><div class="card-body p-0"><div class="tabel-wrap">
            <table class="table table-sm table-bordered mb-0">
              <thead><tr><th>Mapel</th>${komp.map(k => `<th>${esc(k.nama)}</th>`).join("")}<th>Total</th><th></th></tr></thead>
              <tbody>
                ${(mp.data || []).map(m => `<tr data-mapel="${m.id}">
                  <td class="font-weight-bold">${esc(m.nama)}</td>
                  ${komp.map(k => `<td><input type="number" min="0" max="100" step="1" class="form-control form-control-sm"
                    data-komp="${k.id}" value="${bobot[m.id + "|" + k.id] ?? ""}" style="width:80px"></td>`).join("")}
                  <td class="text-center total">0</td>
                  <td><button class="btn btn-sm btn-hitam" data-simpan="${m.id}">Simpan</button></td>
                </tr>`).join("")}
              </tbody>
            </table>
          </div></div></div>`;

        const hitungBaris = tr => {
          let t = 0;
          tr.querySelectorAll("input[data-komp]").forEach(i => t += Number(i.value) || 0);
          const el = tr.querySelector(".total");
          el.textContent = t;
          el.className = "text-center total " + (t === 100 ? "total-ok" : "total-bad");
        };

        panel.querySelectorAll("tr[data-mapel]").forEach(tr => {
          tr.querySelectorAll("input").forEach(i => i.oninput = () => hitungBaris(tr));
          hitungBaris(tr);
        });

        panel.querySelectorAll("[data-simpan]").forEach(btn => btn.onclick = async () => {
          const mid = Number(btn.dataset.simpan);
          const tr = panel.querySelector(`tr[data-mapel="${mid}"]`);
          const nama = tr.querySelector("td").textContent.trim();
          const rows = [], salah = [];

          tr.querySelectorAll("input[data-komp]").forEach(i => {
            i.classList.remove("is-invalid");
            const v = i.value.trim() === "" ? 0 : Number(i.value);
            if (!Number.isFinite(v) || v < 0 || v > 100) { i.classList.add("is-invalid"); salah.push(i); return; }
            if (v > 0) rows.push({ mapel_id: mid, komponen_id: Number(i.dataset.komp), bobot: v });
          });

          if (salah.length) return peringatan("Bobot harus angka 0 sampai 100.");
          const total = rows.reduce((t, r) => t + r.bobot, 0);
          if (total !== 100) return peringatan("Total bobot " + nama + " harus 100, sekarang " + total + ".");

          btn.disabled = true;
          let { error } = await sb.from("bobot_nilai").delete().eq("mapel_id", mid);
          if (!error && rows.length) ({ error } = await sb.from("bobot_nilai").insert(rows));
          btn.disabled = false;
          if (error) return gagal(error);

          toast("Bobot " + nama + " tersimpan.");
        });
      }

      // ===== KOMPONEN & MAPEL =====
      async function tabKomponen() {
        panel.innerHTML = '<p class="text-muted">Memuat...</p>';
        const [kn, mp] = await Promise.all([
          sb.from("komponen_nilai").select("id, kode, nama, urutan").order("urutan"),
          sb.from("mata_pelajaran").select("id, kode, nama, kelompok, urutan, aktif").order("urutan")
        ]);
        if (kn.error) return gagal(kn.error);
        if (mp.error) return gagal(mp.error);

        panel.innerHTML = `
          <div class="card card-outline card-warning">
            <div class="card-header"><h3 class="card-title">Komponen Nilai</h3></div>
            <div class="card-body p-0"><div class="tabel-wrap"><table class="table table-sm mb-0">
              <thead><tr><th>Kode</th><th>Nama tampil</th><th>Urutan</th><th></th></tr></thead>
              <tbody>
                ${(kn.data || []).map(k => `<tr>
                  <td><code>${esc(k.kode)}</code></td>
                  <td><input class="form-control form-control-sm" data-f="nama" value="${esc(k.nama)}"></td>
                  <td><input type="number" class="form-control form-control-sm" data-f="urutan" value="${k.urutan}" style="width:90px"></td>
                  <td><button class="btn btn-sm btn-hitam" data-save-k="${k.id}">Simpan</button></td>
                </tr>`).join("")}
              </tbody>
            </table></div></div>
          </div>
          <div class="card card-outline card-info mt-3">
            <div class="card-header"><h3 class="card-title">Mata Pelajaran</h3></div>
            <div class="card-body p-0"><div class="tabel-wrap"><table class="table table-sm mb-0">
              <thead><tr><th>Kode</th><th>Nama</th><th>Kelompok</th><th>Urutan</th><th>Aktif</th><th></th></tr></thead>
              <tbody>
                ${(mp.data || []).map(m => `<tr>
                  <td><code>${esc(m.kode)}</code></td>
                  <td><input class="form-control form-control-sm" data-f="nama" value="${esc(m.nama)}"></td>
                  <td><input class="form-control form-control-sm" data-f="kelompok" value="${esc(m.kelompok || "")}"></td>
                  <td><input type="number" class="form-control form-control-sm" data-f="urutan" value="${m.urutan}" style="width:90px"></td>
                  <td><input type="checkbox" data-f="aktif" ${m.aktif ? "checked" : ""}></td>
                  <td><button class="btn btn-sm btn-hitam" data-save-m="${m.id}">Simpan</button></td>
                </tr>`).join("")}
              </tbody>
            </table></div></div>
          </div>`;

        panel.querySelectorAll("[data-save-k]").forEach(b => b.onclick = async () => {
          const tr = b.closest("tr");
          const nama = tr.querySelector('[data-f="nama"]').value.trim();
          const urutan = Number(tr.querySelector('[data-f="urutan"]').value);
          if (!nama || !Number.isInteger(urutan)) return peringatan("Nama dan urutan wajib diisi.");

          const { error } = await sb.from("komponen_nilai").update({ nama, urutan }).eq("id", Number(b.dataset.saveK));
          if (error) return gagal(error);
          toast("Komponen tersimpan.");
        });

        panel.querySelectorAll("[data-save-m]").forEach(b => b.onclick = async () => {
          const tr = b.closest("tr");
          const nama = tr.querySelector('[data-f="nama"]').value.trim();
          const kelompok = tr.querySelector('[data-f="kelompok"]').value.trim() || null;
          const urutan = Number(tr.querySelector('[data-f="urutan"]').value);
          const aktif = tr.querySelector('[data-f="aktif"]').checked;
          if (!nama || !Number.isInteger(urutan)) return peringatan("Nama dan urutan wajib diisi.");

          const { error } = await sb.from("mata_pelajaran")
            .update({ nama, kelompok, urutan, aktif }).eq("id", Number(b.dataset.saveM));
          if (error) return gagal(error);
          toast("Mata pelajaran tersimpan.");
        });
      }

      // ===== ASPEK DESKRIPSI =====
      async function tabAspek() {
        panel.innerHTML = '<p class="text-muted">Memuat...</p>';
        const [mp, asp] = await Promise.all([
          sb.from("mata_pelajaran").select("id, nama, urutan").order("urutan"),
          sb.from("aspek_deskripsi").select("id, mapel_id, kode, nama, urutan, aktif").order("urutan")
        ]);
        if (mp.error) return gagal(mp.error);
        if (asp.error) return gagal(asp.error);

        const namaMapel = id => (mp.data.find(m => m.id === id) || {}).nama || "-";

        panel.innerHTML = `
          <div class="card card-outline card-warning"><div class="card-body p-0"><div class="tabel-wrap">
            <table class="table table-sm mb-0">
              <thead><tr><th>Mapel</th><th>Nama aspek</th><th>Urutan</th><th>Aktif</th><th></th></tr></thead>
              <tbody>
                ${(asp.data || []).map(a => `<tr>
                  <td>${esc(namaMapel(a.mapel_id))}</td>
                  <td><input class="form-control form-control-sm" data-f="nama" value="${esc(a.nama)}"></td>
                  <td><input type="number" class="form-control form-control-sm" data-f="urutan" value="${a.urutan}" style="width:90px"></td>
                  <td><input type="checkbox" data-f="aktif" ${a.aktif ? "checked" : ""}></td>
                  <td><button class="btn btn-sm btn-hitam" data-save="${a.id}">Simpan</button></td>
                </tr>`).join("")}
              </tbody>
            </table>
          </div></div></div>
          <div class="card card-outline card-info mt-3"><div class="card-body">
            <h6 class="font-weight-bold">Tambah aspek</h6>
            <div class="form-row align-items-end">
              <div class="col-12 col-md-4 mb-2">
                <label class="small mb-1">Mapel</label>
                <select id="aMapel" class="form-control">
                  ${(mp.data || []).map(m => `<option value="${m.id}">${esc(m.nama)}</option>`).join("")}
                </select>
              </div>
              <div class="col-12 col-md-4 mb-2">
                <label class="small mb-1">Nama aspek</label>
                <input id="aNama" class="form-control" placeholder="contoh: Adab">
              </div>
              <div class="col-6 col-md-2 mb-2">
                <label class="small mb-1">Urutan</label>
                <input id="aUrut" type="number" value="1" class="form-control">
              </div>
              <div class="col-6 col-md-2 mb-2">
                <button class="btn btn-kuning btn-block" id="btnTambahAspek"><i class="fas fa-plus"></i> Tambah</button>
              </div>
            </div>
          </div></div>`;

        panel.querySelectorAll("[data-save]").forEach(b => b.onclick = async () => {
          const tr = b.closest("tr");
          const nama = tr.querySelector('[data-f="nama"]').value.trim();
          const urutan = Number(tr.querySelector('[data-f="urutan"]').value);
          const aktif = tr.querySelector('[data-f="aktif"]').checked;
          if (!nama) return peringatan("Nama aspek wajib diisi.");

          const { error } = await sb.from("aspek_deskripsi")
            .update({ nama, urutan, aktif }).eq("id", Number(b.dataset.save));
          if (error) return gagal(error);
          toast("Aspek tersimpan.");
        });

        $("btnTambahAspek").onclick = async () => {
          const mapel_id = Number($("aMapel").value);
          const nama = $("aNama").value.trim();
          const urutan = Number($("aUrut").value) || 0;
          if (!nama) return peringatan("Isi nama aspek.");

          const kode = nama.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
          const { error } = await sb.from("aspek_deskripsi")
            .insert({ mapel_id, kode, nama, urutan, aktif: true });
          if (error) return gagal(error);

          toast("Aspek ditambahkan.");
          tabAspek();
        };
      }

      // ===== RUMUS & KEHADIRAN =====
      async function tabRumus() {
        panel.innerHTML = '<p class="text-muted">Memuat...</p>';
        const { data, error } = await sb.from("pengaturan").select("kunci, nilai")
          .in("kunci", ["faktor_nilai_akhir", "pembagi_rapor", "kehadiran_bobot_izin", "kehadiran_bobot_alpha"]);
        if (error) return gagal(error);

        const nilaiDari = k => ((data || []).find(x => x.kunci === k) || {}).nilai ?? "";
        const FIELD = [
          ["faktor_nilai_akhir", "Faktor nilai akhir", "0.9 berarti nilai tertinggi 90", 0, 1, 0.01],
          ["pembagi_rapor", "Pembagi nilai rapor", "10 berarti skala rapor 0 sampai 10", 0.01, 1000, 1],
          ["kehadiran_bobot_izin", "Pengurang kehadiran per hari izin", "poin dikurangi dari 100", 0, 100, 0.5],
          ["kehadiran_bobot_alpha", "Pengurang kehadiran per hari tanpa uzur syar'i", "poin dikurangi dari 100", 0, 100, 0.5]
        ];

        panel.innerHTML = `
          <div class="card card-outline card-warning"><div class="card-body">
            ${FIELD.map(([k, l, h, min, max, step]) => `
              <div class="form-group">
                <label class="small mb-1 font-weight-bold">${esc(l)}</label>
                <input type="number" class="form-control" style="max-width:300px"
                  data-k="${k}" data-min="${min}" data-max="${max}" step="${step}" value="${nilaiDari(k)}">
                <small class="text-muted">${esc(h)}</small>
              </div>`).join("")}
            <button class="btn btn-kuning" id="btnRumus"><i class="fas fa-save"></i> Simpan</button>
          </div></div>`;

        $("btnRumus").onclick = async () => {
          const inputs = [...panel.querySelectorAll("input[data-k]")];
          for (const i of inputs) {
            const n = Number(i.value), min = Number(i.dataset.min), max = Number(i.dataset.max);
            if (i.value === "" || !Number.isFinite(n) || n < min || n > max) {
              i.classList.add("is-invalid");
              return peringatan("Nilai tidak valid. Periksa kotak merah.");
            }
            i.classList.remove("is-invalid");
          }
          for (const i of inputs) {
            const { error } = await sb.from("pengaturan")
              .update({ nilai: Number(i.value) }).eq("kunci", i.dataset.k);
            if (error) return gagal(error);
          }
          toast("Rumus dan kehadiran tersimpan.");
        };
      }

      // ===== NAVIGASI TAB =====
      const TAB = {
        pendaftaran: tabPendaftaran,
        tahun: tabTahun,
        bobot: tabBobot,
        komponen: tabKomponen,
        aspek: tabAspek,
        rumus: tabRumus
      };

      konten.querySelectorAll("[data-tab]").forEach(a => a.onclick = e => {
        e.preventDefault();
        konten.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("active", x === a));
        TAB[a.dataset.tab]();
      });

      tabPendaftaran();
    }
  });
</script>
</body>
</html>

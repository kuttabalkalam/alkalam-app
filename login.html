<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk - Kuttab Al-Kalam</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #0f172a; }

  .split { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }

  /* ===== Kiri: gambar login ===== */
  .kiri {
    position: relative; color: #fff; padding: 40px 56px;
    background: url('login.png') center / cover no-repeat;
    display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
  }
  .footer-kiri {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: .08em;
    color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }

  /* ===== Kanan ===== */
  .kanan { background: #eef2f7; display: flex; flex-direction: column; padding: 40px 56px; }
  .form-wrap { margin: auto; width: 100%; max-width: 400px; }

  .logo-form { display: block; width: 200px; max-width: 70%; height: auto; margin: 0 auto 32px; }

  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .label-row { display: flex; justify-content: space-between; align-items: baseline; }
  .label-row a { font-size: 13px; font-weight: 600; color: #1a1a1a; text-decoration: none; }
  .label-row a:hover { text-decoration: underline; }

  .input {
    display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #d5dce6;
    border-radius: 10px; padding: 0 12px; margin-bottom: 16px; height: 46px;
  }
  .input:focus-within { border-color: #f2c94c; box-shadow: 0 0 0 3px rgba(242,201,76,.25); }
  .input svg { flex-shrink: 0; color: #94a3b8; }
  .input input {
    flex: 1; border: 0; outline: 0; font-size: 15px; background: transparent; min-width: 0; color: #0f172a;
  }
  .input input::placeholder { color: #94a3b8; }
  .input button {
    border: 0; background: none; color: #64748b; font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px;
  }

  .btn {
    width: 100%; height: 48px; border: 0; border-radius: 10px; background: #f2c94c; color: #1a1a1a;
    font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px;
    box-shadow: 0 6px 16px rgba(242,201,76,.35);
  }
  .btn:hover { background: #e0b53a; }
  .btn:disabled { background: #cbd5e1; box-shadow: none; cursor: default; color: #64748b; }

  #pesan { min-height: 20px; font-size: 14px; margin-top: 14px; font-weight: 600; }
  #pesan.error { color: #dc2626; }
  #pesan.info { color: #475569; }

  .catatan { font-size: 13px; color: #64748b; margin-top: 28px; line-height: 1.6; }

  .footer-kanan { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 40px; line-height: 1.6; }

  @media (max-width: 900px) {
    .split { grid-template-columns: 1fr; }
    .kiri { min-height: 260px; padding: 24px; }
    .kanan { padding: 32px 24px; }
  }
</style>
</head>
<body>

<div class="split">
  <aside class="kiri">
    <div class="footer-kiri">© 2026 · BAMBU APUS, PAMULANG</div>
  </aside>

  <main class="kanan">
    <div class="form-wrap">
      <img src="logo.png" alt="Logo Kuttab Al-Kalam" class="logo-form">

      <form id="fLogin" novalidate>
        <label for="email">Email</label>
        <div class="input">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <input id="email" type="email" placeholder="nama@email.com" autocomplete="username" required>
        </div>

        <div class="label-row">
          <label for="pw">Password</label>
          <a href="#" id="lupa">Lupa?</a>
        </div>
        <div class="input">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" id="tampilPw">Tampil</button>
        </div>

        <button type="submit" class="btn" id="btnMasuk">Masuk →</button>
        <div id="pesan"></div>
      </form>

      <p class="catatan">Akun dibuat oleh admin. Jika belum memiliki akun, hubungi admin Kuttab Al-Kalam.</p>
    </div>

    <div class="footer-kanan">Dengan masuk, Anda menyetujui penggunaan data sekolah sesuai kebijakan Kuttab Al-Kalam.</div>
  </main>
</div>

<script>
  const SUPABASE_URL = "https://epynlmuqxumuwcjsrnsz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Oq_to1zgHLnachvWYLV_yA_DoOTGI3s";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);
  const pesan = (t, tipe = "info") => {
    $("pesan").textContent = t;
    $("pesan").className = tipe;
  };

  // Jika sudah login, langsung ke dashboard
  sb.auth.getSession().then(({ data }) => {
    if (data.session) location.href = "dashboard.html";
  });

  $("tampilPw").onclick = () => {
    const pw = $("pw");
    const tampil = pw.type === "password";
    pw.type = tampil ? "text" : "password";
    $("tampilPw").textContent = tampil ? "Sembunyi" : "Tampil";
  };

  $("fLogin").addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("email").value.trim().toLowerCase();
    const password = $("pw").value;

    if (!email || !password) return pesan("Isi email dan password.", "error");

    const btn = $("btnMasuk");
    btn.disabled = true;
    btn.textContent = "Memproses...";
    pesan("");

    const { error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      btn.disabled = false;
      btn.textContent = "Masuk →";
      const teks = /Invalid login credentials/i.test(error.message)
        ? "Email atau password salah."
        : "Gagal masuk: " + error.message;
      return pesan(teks, "error");
    }

    location.href = "dashboard.html";
  });

  $("lupa").addEventListener("click", async e => {
    e.preventDefault();
    const email = $("email").value.trim().toLowerCase();
    if (!email) return pesan("Isi email terlebih dahulu, lalu klik Lupa lagi.", "error");

    const redirectTo = new URL("set-password.html", location.href).href;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
    if (error) return pesan("Gagal mengirim tautan: " + error.message, "error");

    pesan("Jika email terdaftar, tautan untuk membuat password baru sudah dikirim.", "info");
  });
</script>
</body>
</html>

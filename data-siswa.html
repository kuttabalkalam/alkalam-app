<body class="hold-transition sidebar-mini">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>

<script src="ui.js"></script>

<script>
  const esc = KUTTAB.esc;
  const sb = KUTTAB.sb;
  const SB_URL = "https://epynlmuqxumuwcjsrnsz.supabase.co";

  const TINGKAT = [
    ["0", "Kuttab Awal 1"], ["1", "Kuttab Awal 2"], ["2", "Kuttab Awal 3"],
    ["3", "Kuttab Qonuni 1"], ["4", "Kuttab Qonuni 2"], ["5", "Kuttab Qonuni 3"], ["6", "Kuttab Qonuni 4"]
  ];
  const STATUS = ["Calon Santri", "Aktif", "Lulus", "Keluar", "Pindah"];
  const BULAN_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  const BULAN_SINGKAT = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  const HARI_ID = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];

  const STATUS_KELUARGA = [
    ["Anak Kandung", "Anak Kandung"],
    ["Anak Tiri", "Anak Tiri (dari ayah)"],
    ["Anak Angkat", "Anak Angkat"]
  ];
  const labelStatusKeluarga = v => (STATUS_KELUARGA.find(x => x[0] === v) || [])[1] || v || "";

  const PEKERJAAN = ["PNS / ASN", "Karyawan Swasta", "Wirausaha / Dagang", "Pekerja Lepas / Freelance", "Tidak Bekerja"];
  const PEKERJAAN_IBU = [...PEKERJAAN, "Ibu Rumah Tangga"];
  const PENGHASILAN = ["Tidak Ada", "s/d 3 juta", "s/d 5 juta", "s/d 10 juta", "s/d 15 juta", ">20 juta"];
  const EKONOMI_OPSI = ["Rumah Pribadi", "Mobil", "Motor", "Tempat Usaha"];
  const listOpsi = arr => arr.map(x => [x, x]);

  const FIELD = [
    ["nama_lengkap", "Nama lengkap (sesuai akta) *", "text"],
    ["nama_panggilan", "Nama panggilan", "text"],
    ["jenis_kelamin", "Jenis kelamin *", "select", [["L", "Laki-laki"], ["P", "Perempuan"]]],
    ["nik", "NIK", "text"],
    ["nisn", "NISN", "text"],
    ["tempat_lahir", "Tempat lahir", "text"],
    ["tanggal_lahir", "Tanggal lahir", "date"],
    ["no_registrasi_akta", "No. registrasi akta", "text"],
    ["agama", "Agama", "text"],
    ["anak_ke", "Anak ke", "anak"],
    ["status_dalam_keluarga", "Status dalam keluarga", "select", STATUS_KELUARGA],
    ["sekolah_asal", "Sekolah asal (opsional)", "text"],
    ["alamat_kk", "Alamat sesuai KK", "textarea"],
    ["rt_kk", "RT (KK)", "text"],
    ["rw_kk", "RW (KK)", "text"],
    ["desa_kelurahan", "Desa/Kelurahan", "text"],
    ["kecamatan", "Kecamatan", "text"],
    ["kode_pos", "Kode pos", "text"],
    ["alamat", "Alamat domisili", "textarea"],
    ["nama_ayah", "Nama ayah", "text"],
    ["nik_ayah", "NIK ayah", "text"],
    ["hp_ayah", "No. HP ayah", "text"],
    ["pekerjaan_ayah", "Pekerjaan ayah", "select", listOpsi(PEKERJAAN)],
    ["penghasilan_ayah", "Penghasilan ayah", "select", listOpsi(PENGHASILAN)],
    ["nama_ibu", "Nama ibu kandung", "text"],
    ["nik_ibu", "NIK ibu", "text"],
    ["hp_ibu", "No. HP ibu", "text"],
    ["pekerjaan_ibu", "Pekerjaan ibu", "select", listOpsi(PEKERJAAN_IBU)],
    ["penghasilan_ibu", "Penghasilan ibu", "select", listOpsi(PENGHASILAN)],
    ["email_ortu", "Email orang tua", "text"],
    ["status_ekonomi", "Status ekonomi (kepemilikan)", "ekonomi"],
    ["bidang_usaha", "Bidang usaha (isi jika memilih Tempat Usaha)", "text"],
    ["wali_nama", "Nama wali (opsional)", "text"],
    ["wali_alamat", "Alamat wali (opsional)", "textarea"],
    ["wali_telp", "No. telp wali (opsional)", "text"],
    ["wali_pekerjaan", "Pekerjaan wali (opsional)", "text"],
    ["tingkat_masuk", "Mendaftar untuk tingkat", "select", TINGKAT],
    ["jenis_pendaftaran", "Jenis pendaftaran", "select", [["Siswa Baru", "Siswa Baru"], ["Pindahan", "Pindahan"]]]
  ];

  const namaTingkat = k => (TINGKAT.find(x => x[0] === String(k)) || [])[1] || "-";
  const titleCase = v => v.trim().toLowerCase().replace(/(^|\s)\S/g, m => m.toUpperCase());

  const tglIndoSingkat = iso => {
    if (!iso) return "-";
    const d = new Date(iso + "T00:00:00");
    return d.getDate() + " " + BULAN_SINGKAT[d.getMonth()] + " " + d.getFullYear();
  };

  const tglLengkap = iso => {
    if (!iso) return "-";
    const d = new Date(iso + "T00:00:00");
    return d.getDate() + " " + BULAN_ID[d.getMonth()] + " " + d.getFullYear();
  };

  const waktuIndo = iso => {
    if (!iso) return "";
    const d = new Date(iso);
    const jam = String(d.getHours()).padStart(2, "0") + "." + String(d.getMinutes()).padStart(2, "0");
    return d.getDate() + " " + BULAN_SINGKAT[d.getMonth()] + " " + d.getFullYear() + ", " + jam;
  };

  function formatJadwal(tgl, jam) {
    const d = new Date(tgl + "T00:00:00");
    return HARI_ID[d.getDay()] + ", " + d.getDate() + " " + BULAN_ID[d.getMonth()] + " " +
      d.getFullYear() + " pukul " + jam.replace(":", ".");
  }

  const gabung = (...x) => x.filter(v => v && String(v).trim()).join(", ") || null;

  // Nilai kosong ditampilkan kosong (tanpa strip) untuk cetakan
  const teksKosong = v => (v == null || String(v).trim() === "") ? "" : esc(String(v));

  function inputHtml(k, t, o, row) {
    const v = row && row[k] != null ? row[k] : "";
    const id = "f_" + k;
    if (t === "ekonomi") {
      const pilih = Array.isArray(v) ? v : [];
      return `<div id="${id}">
        ${EKONOMI_OPSI.map((o2, i) => `
          <div class="custom-control custom-checkbox">
            <input class="custom-control-input eko-cb" type="checkbox" id="${id}_${i}" value="${esc(o2)}" ${pilih.includes(o2) ? "checked" : ""}>
            <label class="custom-control-label" for="${id}_${i}">${esc(o2)}</label>
          </div>`).join("")}
      </div>`;
    }
    if (t === "anak") {
      const angka = ["1", "2", "3", "4", "5"];
      const pilih = angka.includes(String(v)) ? String(v) : (v ? "lainnya" : "");
      return `<select id="${id}" class="form-control form-control-sm"
          onchange="document.getElementById('${id}_lain').classList.toggle('d-none', this.value !== 'lainnya')">
        <option value="">-- pilih --</option>
        ${angka.map(a => `<option value="${a}" ${pilih === a ? "selected" : ""}>${a}</option>`).join("")}
        <option value="lainnya" ${pilih === "lainnya" ? "selected" : ""}>Lainnya</option>
      </select>
      <input id="${id}_lain" type="number" min="1" class="form-control form-control-sm mt-1 ${pilih === "lainnya" ? "" : "d-none"}"
        placeholder="Tulis angka" value="${pilih === "lainnya" ? esc(v) : ""}">`;
    }
    if (t === "select") {
      return `<select id="${id}" class="form-control form-control-sm">
        <option value="">-- pilih --</option>
        ${o.map(([a, b]) => `<option value="${esc(a)}" ${String(v) === String(a) ? "selected" : ""}>${esc(b)}</option>`).join("")}
      </select>`;
    }
    if (t === "textarea") return `<textarea id="${id}" rows="2" class="form-control form-control-sm">${esc(v)}</textarea>`;
    return `<input id="${id}" type="${t}" class="form-control form-control-sm" value="${esc(v)}">`;
  }

  async function kirimNotif(body) {
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return { ok: false, pesan: "Sesi login habis. Muat ulang halaman." };

      const r = await fetch(SB_URL + "/functions/v1/kirim-wa", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token },
        body: JSON.stringify(body)
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) return { ok: false, pesan: j.error || ("Server membalas HTTP " + r.status) };
      if ((j.terkirim ?? 0) === 0) return { ok: false, pesan: (j.gagal && j.gagal[0]) || "Tidak ada nomor tujuan yang valid" };
      return { ok: true, pesan: "" };
    } catch (e) {
      return { ok: false, pesan: "Gagal menghubungi server: " + e.message };
    }
  }

  async function catatWa(id) {
    const { error } = await sb.from("santri")
      .update({ wa_diumumkan_at: new Date().toISOString() }).eq("id", id);
    if (error) KUTTAB.gagal(error);
  }

    // ===== CETAK: PROFIL DAN SURAT PERNYATAAN ORANG TUA =====
  const CSS_CETAK = `
    @page { size: A4; margin: 0; }
    html, body { margin: 0; padding: 0; background: #fff; font-family: Arial, sans-serif; color: #111; width: 210mm; }
    .page { width: 210mm; min-height: 297mm; box-sizing: border-box; page-break-after: always; }
    .page:last-child { page-break-after: auto; }
    .kop { display: block; width: 100%; margin: 0; }
    .isi { padding: 0 12mm 10mm; font-size: 11px; line-height: 1.4; }
    .judul { text-align: center; font-size: 14px; font-weight: bold; margin: 8mm 0 5mm; }
    .seg { margin-top: 4mm; }
    .seg-judul { font-weight: bold; border-bottom: 1px solid #111; padding-bottom: 1mm; margin-bottom: 1.5mm; }
    .tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .tbl td { padding: 0.8px 2px; vertical-align: top; word-wrap: break-word; }
    .ind { display: inline-block; width: 6mm; }
    .cek { display: inline-block; margin-right: 5mm; white-space: nowrap; }
    .cb { display: inline-block; width: 3mm; height: 3mm; border: 1px solid #111; margin-right: 1.5mm;
          text-align: center; line-height: 3mm; font-size: 9px; font-weight: bold; vertical-align: -0.5mm; }
    .perj-q { margin: 5mm 0 2mm; font-size: 12px; line-height: 1.6; }
    .garis { border-bottom: 1px solid #555; height: 8mm; }
    .perj-sub { font-weight: bold; margin: 10mm 0 3mm; font-size: 12px; }
    .perj-item { display: flex; font-size: 12px; line-height: 1.6; margin-bottom: 1.5mm; }
    .perj-item .n { flex: 0 0 8mm; }
    .perj-item .t { flex: 1; text-align: justify; }
    .ttd-wrap { margin-top: 10mm; display: flex; justify-content: flex-end; padding-right: 14mm; font-size: 12px; }
    .ttd { width: 92mm; }
    .baris-tgl { display: flex; align-items: flex-end; }
    .tgl-lbl { white-space: nowrap; }
    .tgl-isi { flex: 1; border-bottom: 1px dotted #111; height: 5mm; margin-left: 2mm; }
    .meterai { height: 24mm; display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .ttd-nama { text-align: center; margin-top: 14mm; }
  `;

  // Lebar kolom dikunci agar titik dua sejajar di semua segmen
  const COLS_PROFIL = `<colgroup><col style="width:9mm"><col style="width:62mm"><col style="width:4mm"><col></colgroup>`;

  function htmlProfil(s) {
    const jk = s.jenis_kelamin === "L" ? "Laki-laki" : s.jenis_kelamin === "P" ? "Perempuan" : "";
    const ttl = [s.tempat_lahir, s.tanggal_lahir ? tglLengkap(s.tanggal_lahir) : ""].filter(Boolean).join(", ");
    const alamat = gabung(s.alamat,
      s.alamat_dom_rt && "RT " + s.alamat_dom_rt,
      s.alamat_dom_rw && "RW " + s.alamat_dom_rw,
      s.alamat_dom_desa, s.alamat_dom_kecamatan, s.alamat_dom_kodepos);
    const alamatKk = s.alamat_sama_kk === true ? "Sama dengan alamat domisili"
      : gabung(s.alamat_kk, s.rt_kk && "RT " + s.rt_kk, s.rw_kk && "RW " + s.rw_kk,
          s.desa_kelurahan, s.kecamatan, s.kode_pos);
    const adaWali = [s.wali_nama, s.wali_alamat, s.wali_telp, s.wali_pekerjaan]
      .some(v => v && String(v).trim() !== "");

    // Checklist: semua pilihan tampil, yang dipilih diberi tanda X. Belum diisi = kotak kosong.
    const cek = (opsi, dipilih) => opsi.map(([v, l]) =>
      `<span class="cek"><span class="cb">${dipilih.includes(v) ? "X" : ""}</span>${esc(l)}</span>`).join("");

    const bagian = (judul, items) => {
      let n = 0;
      const rows = items.map(it => {
        if (it.checklist) return `<tr><td>${++n}.</td><td>${esc(it.label)}</td><td>:</td><td>${it.checklist}</td></tr>`;
        if (it.head) return `<tr><td>${++n}.</td><td colspan="3"><b>${esc(it.head)}</b></td></tr>`;
        if (it.sub) return `<tr><td></td><td><span class="ind"></span>${it.sub[0]}. ${esc(it.sub[1])}</td><td>:</td><td>${teksKosong(it.sub[2])}</td></tr>`;
        return `<tr><td>${++n}.</td><td>${esc(it[0])}</td><td>:</td><td>${teksKosong(it[1])}</td></tr>`;
      }).join("");
      return `<div class="seg"><div class="seg-judul">${esc(judul)}</div><table class="tbl">${COLS_PROFIL}${rows}</table></div>`;
    };

    const dataSantri = [
      ["Nama lengkap (sesuai akta)", s.nama_lengkap],
      ["Nama panggilan", s.nama_panggilan],
      ["Jenis kelamin", jk],
      ["NIK", s.nik],
      ["NISN", s.nisn],
      ["Tempat, tanggal lahir", ttl],
      ["Nomor registrasi akta lahir", s.no_registrasi_akta],
      ["Agama", s.agama],
      ["Anak ke", s.anak_ke],
      { label: "Status dalam keluarga", checklist: cek(STATUS_KELUARGA, s.status_dalam_keluarga ? [s.status_dalam_keluarga] : []) },
      ["Sekolah asal", s.sekolah_asal],
      ["Tahun ajaran tujuan", s.tahun_ajaran_masuk],
      ["Jenis pendaftaran", s.jenis_pendaftaran],
      ["Alamat domisili", alamat],
      ["Alamat sesuai KK", alamatKk]
    ];

    const dataOrtu = [
      { head: "Ayah kandung" },
      { sub: ["a", "Nama lengkap", s.nama_ayah] },
      { sub: ["b", "NIK", s.nik_ayah] },
      { sub: ["c", "No. telp", s.hp_ayah] },
      { head: "Ibu kandung" },
      { sub: ["a", "Nama lengkap", s.nama_ibu] },
      { sub: ["b", "NIK", s.nik_ibu] },
      { sub: ["c", "No. telp", s.hp_ibu] },
      ["Email orang tua", s.email_ortu],
      ...(adaWali ? [
        { head: "Wali santri" },
        { sub: ["a", "Nama lengkap", s.wali_nama] },
        { sub: ["b", "Alamat", s.wali_alamat] },
        { sub: ["c", "No. telp", s.wali_telp] }
      ] : [])
    ];

    const statusKerja = [
      ["Pekerjaan ayah", s.pekerjaan_ayah],
      ["Pekerjaan ibu", s.pekerjaan_ibu],
      ...(s.wali_pekerjaan ? [["Pekerjaan wali", s.wali_pekerjaan]] : [])
    ];

    const statusEkonomi = [
      ["Penghasilan ayah", s.penghasilan_ayah],
      ["Penghasilan ibu", s.penghasilan_ibu],
      {
        label: "Kepemilikan",
        checklist: cek(EKONOMI_OPSI.map(x => [x, x]), s.status_ekonomi || []) +
          (s.status_ekonomi && s.status_ekonomi.includes("Tempat Usaha") && s.bidang_usaha
            ? `<br>Bidang usaha: ${esc(s.bidang_usaha)}` : "")
      }
    ];

    return `<section class="page">
      <img class="kop" src="kop.png" alt="">
      <div class="isi">
        <h3 class="judul">PROFIL DAN SURAT PERNYATAAN ORANG TUA</h3>
        ${bagian("DATA SANTRI", dataSantri)}
        ${bagian("DATA ORANG TUA SANTRI", dataOrtu)}
        ${bagian("STATUS PEKERJAAN", statusKerja)}
        ${bagian("STATUS EKONOMI", statusEkonomi)}
      </div>
    </section>`;
  }

  function htmlSurat() {
    const garis = n => Array.from({ length: n }, () => `<div class="garis"></div>`).join("");
    const pertanyaan = [
      "Apa yang Bapak & Ibu sudah lakukan untuk mendidik anak mempersiapkan aqil balighnya?",
      "Kontribusi apa yang Bapak & Ibu dapat berikan untuk mendukung pengembangan Kuttab Al-Kalam?"
    ];
    const pernyataan = [
      "Data yang diisi adalah benar dan dapat dipertanggungjawabkan.",
      "Bersungguh-sungguh mendidik calon santri (anak) sepenuh jiwa sesuai dengan tuntunan Rasulullah ﷺ.",
      "Bersedia mengikuti semua peraturan Kuttab.",
      "Berkomitmen untuk senantiasa mengikuti MAWAS (Majelis Ilmu Wali Santri) sebagai bagian dari peran aktif dalam pendidikan anak.",
      "Apabila terjadi hal-hal yang tidak diinginkan (selama tidak membahayakan keselamatan) tidak menuntut pihak Kuttab. Dan akan diselesaikan sesuai syariat"
    ];

    return `<section class="page">
      <img class="kop" src="kop.png" alt="">
      <div class="isi">
        ${pertanyaan.map((t, i) => `
          <div class="perj-q">${i + 1}. ${esc(t)}</div>
          ${garis(2)}`).join("")}
        <div class="perj-sub">Dengan bersungguh-sungguh dan penuh kesadaran kami menyatakan bahwa:</div>
        ${pernyataan.map((t, i) => `
          <div class="perj-item"><div class="n">${i + 1}.</div><div class="t">${esc(t)}</div></div>`).join("")}
        <div class="ttd-wrap">
          <div class="ttd">
            <div class="baris-tgl">
              <span class="tgl-lbl">Tangerang Selatan,</span>
              <span class="tgl-isi"></span>
            </div>
            <div class="meterai">Meterai Rp. 10.000</div>
            <div class="ttd-nama">( ........................................ )</div>
          </div>
        </div>
      </div>
    </section>`;
  }

  KUTTAB.halaman({
    aktif: "data-siswa",
    judul: "Data Siswa",
    roles: ["admin", "kepala", "staf", "guru"],
    render: async ({ sb, me, sem, konten, toast, gagal, peringatan, konfirmasi, esc }) => {
      if (!sem) {
        konten.innerHTML = '<div class="alert alert-warning">Belum ada semester aktif.</div>';
        return;
      }

      const taId = sem.tahun_ajaran_id, taKode = sem.tahun_ajaran.kode;
      const admin = me.peran === "admin", staf = me.peran === "staf";
      const bisaTulis = admin || staf;

      const [rr, pmr] = await Promise.all([
        sb.from("rombel").select("id, nama, wali_kelas_id, tingkat_kode").eq("tahun_ajaran_id", taId).order("nama"),
        sb.from("penugasan_mapel").select("rombel_id").eq("pegawai_id", me.id)
      ]);
      if (rr.error) return gagal(rr.error);

      const rombelAll = rr.data || [];
      const waliSet = new Set(rombelAll.filter(x => x.wali_kelas_id === me.id).map(x => x.id));
      const rombelSaya = new Set([...waliSet, ...(pmr.data || []).map(x => x.rombel_id)]);
      const rombelTampil = (admin || me.peran === "kepala") ? rombelAll : rombelAll.filter(x => rombelSaya.has(x.id));

      const tabs = [["daftar", "Daftar Santri"]];
      if (bisaTulis) tabs.push(["calon", "Calon Santri"], ["form", "Tambah Santri"]);
      if (admin) tabs.push(["pindah", "Aktivasi & Pindah"]);

      konten.innerHTML = `
        <ul class="nav nav-tabs tabs-kuttab mb-3">
          ${tabs.map(([k, l]) => `<li class="nav-item"><a class="nav-link" href="#" data-tab="${k}">${l}</a></li>`).join("")}
        </ul>
        ${tabs.map(([k]) => `<div class="panel" id="p-${k}" style="display:none"></div>`).join("")}`;

      const panel = k => document.getElementById("p-" + k);
      let editId = null;
      let namaCalon = {};
      let daftarPindah = [];

      function buka(k) {

      // ===== DAFTAR SANTRI =====

      async function tampilDaftar() {
        const rid = staf ? null : (Number(document.getElementById("dRombel").value) || null);
        const tbl = document.getElementById("dTabel");
        if (!staf && !rid) { tbl.innerHTML = ""; return; }

        let daftar = [];
        if (staf) {
          const { data, error } = await sb.from("santri")
            .select("id, nis, nama_lengkap, jenis_kelamin, hp_orang_tua, status").order("nama_lengkap");
          if (error) return gagal(error);
          daftar = data || [];
        } else {
          const { data, error } = await sb.from("keanggotaan_rombel")
            .select("santri:santri_id(id, nis, nama_lengkap, jenis_kelamin, hp_orang_tua, status)")
            .eq("rombel_id", rid).eq("tahun_ajaran_id", taId);
          if (error) return gagal(error);
          daftar = (data || []).map(x => x.santri).filter(s => s && s.status === "Aktif")
            .sort((a, b) => a.nama_lengkap.localeCompare(b.nama_lengkap));
        }

        document.getElementById("dInfo").textContent = staf
          ? daftar.length + " santri (semua status)."
          : daftar.length + " santri aktif.";

        const bolehAbsen = admin || (rid !== null && waliSet.has(rid));
        const absen = {};
        if (bolehAbsen && daftar.length) {
          const { data } = await sb.from("absensi_rapor").select("santri_id, sakit, izin, tanpa_uzur")
            .eq("semester_id", sem.id).in("santri_id", daftar.map(s => s.id));
          (data || []).forEach(a => absen[a.santri_id] = a);
        }

        const kolom = ["No", "NIS", "Nama", "JK", "HP Orang Tua", "Status"];
        if (bolehAbsen) kolom.push("Sakit", "Izin", "Tanpa Uzur");
        if (admin) kolom.push("Aksi");

        tbl.innerHTML = `
          <table class="table table-sm table-bordered bg-white">
            <thead><tr>${kolom.map(k => `<th>${k}</th>`).join("")}</tr></thead>
            <tbody>
              ${daftar.map((s, i) => `<tr>
                <td>${i + 1}</td>
                <td>${esc(s.nis || "-")}</td>
                <td>${esc(s.nama_lengkap)}</td>
                <td>${esc(s.jenis_kelamin || "-")}</td>
                <td>${esc(s.hp_orang_tua || "-")}</td>
                <td>${esc(s.status)}</td>
                ${bolehAbsen ? ["sakit", "izin", "tanpa_uzur"].map(k => `
                  <td><input type="number" min="0" step="1" class="form-control form-control-sm"
                    data-santri="${s.id}" data-kolom="${k}" value="${absen[s.id] ? absen[s.id][k] : ""}"></td>`).join("") : ""}
                ${admin ? `<td><button class="btn btn-sm btn-hitam" data-edit="${s.id}"><i class="fas fa-edit"></i></button></td>` : ""}
              </tr>`).join("")}
            </tbody>
          </table>
          ${bolehAbsen && daftar.length ? '<button class="btn btn-kuning" id="dSimpanAbsen"><i class="fas fa-save"></i> Simpan Absensi</button>' : ""}`;

        tbl.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openForm(Number(b.dataset.edit)));
        const btnAbsen = document.getElementById("dSimpanAbsen");
        if (btnAbsen) btnAbsen.onclick = simpanAbsen;
      }

      async function simpanAbsen() {
        const per = {}, salah = [];
        document.querySelectorAll("#dTabel input[data-santri]").forEach(inp => {
          inp.classList.remove("is-invalid");
          const sid = Number(inp.dataset.santri);
          per[sid] = per[sid] || { ada: false, isi: {} };
          const v = inp.value.trim();
          if (v !== "") per[sid].ada = true;
          const n = v === "" ? 0 : Number(v);
          if (!Number.isInteger(n) || n < 0) { inp.classList.add("is-invalid"); salah.push(inp); }
          per[sid].isi[inp.dataset.kolom] = n;
        });
        if (salah.length) { salah[0].focus(); return peringatan("Jumlah hari harus bilangan bulat, minimal 0."); }

        const rows = Object.entries(per).filter(([, v]) => v.ada).map(([sid, v]) => ({
          santri_id: Number(sid), semester_id: sem.id,
          sakit: v.isi.sakit, izin: v.isi.izin, tanpa_uzur: v.isi.tanpa_uzur,
          sumber: "manual", diisi_oleh: me.id, updated_at: new Date().toISOString()
        }));
        if (!rows.length) return peringatan("Belum ada absensi yang diisi.");

        const { error } = await sb.from("absensi_rapor").upsert(rows, { onConflict: "santri_id,semester_id" });
        if (error) return gagal(error);
        toast("Absensi tersimpan untuk " + rows.length + " santri.");
      }

            .eq("status", "Calon Santri").order("created_at"),
          sb.from("pengaturan").select("nilai").eq("kunci", "tingkat_tertinggi_dibuka").maybeSingle(),
          sb.rpc("tahun_pendaftaran")

        if (calon.error) return gagal(calon.error);
        if (peng.error) return gagal(peng.error);
        const taDaftar = tp.data || null;

        const semua = calon.data || [];

        const diterima = semua.filter(s => s.tahap_calon === "Diterima");

                  <td>${esc(s.jenis_pendaftaran || "-")}</td>

                    ${s.jadwal_interview ? `<button class="btn btn-sm btn-outline-dark ml-1" data-cetak="${s.id}"><i class="fas fa-print"></i> Cetak</button>` : ""}
                    ${!admin ? "" : `

                      <button class="btn btn-sm btn-outline-dark ml-1" data-jadwal="${s.id}"><i class="fas fa-calendar"></i> Jadwal</button>

            isiKelas();
          };
          p.querySelectorAll(".cPilih").forEach(c => c.onchange = isiKelas);
          document.getElementById("cAktif").onclick = aktifkanTerpilih;

          p.querySelectorAll("[data-ta]").forEach(b => b.onclick = () => ubahTa(byId[Number(b.dataset.ta)], taDaftar));
          p.querySelectorAll("[data-jadwal]").forEach(b => b.onclick = () => aturJadwal(byId[Number(b.dataset.jadwal)]));
          p.querySelectorAll("[data-terima]").forEach(b => b.onclick = () => terimaCalon(byId[Number(b.dataset.terima)], batas));
          p.querySelectorAll("[data-wa]").forEach(b => b.onclick = () => kirimUlang(byId[Number(b.dataset.wa)]));
          p.querySelectorAll("[data-bukti]").forEach(b => b.onclick = () => bukaBukti(byId[Number(b.dataset.bukti)].bukti_bayar_path));
        }
      }

      async function kirimUlang(s) {
        if (!s) return;
        const ok = await konfirmasi("Kirim pengumuman ke WhatsApp orang tua?",
          "Pesan akan dikirim ulang ke " + s.nama_lengkap + ".");
        if (!ok) return;

        const r = await kirimNotif({ event: "diterima", santri_id: s.id });
        if (r.ok) {
          await catatWa(s.id);
          toast("Pengumuman WhatsApp terkirim.");
        } else {
          peringatan("WhatsApp belum terkirim: " + r.pesan);
        }
        loadCalon();
      }

      async function aturJadwal(s) {
        const hariIni = new Date().toISOString().slice(0, 10);
        const r = await Swal.fire({
          title: "Jadwal interview",
          html: `
            <label class="small mb-1">Tanggal interview</label>
            <input id="swTgl" type="date" class="swal2-input" min="${hariIni}">
            <label class="small mb-1 mt-2">Jam</label>
            <input id="swJam" type="time" class="swal2-input" value="08:00">
            <p class="small text-muted mt-2">Jadwal ini akan tersimpan sebagai teks pada data calon.</p>`,
          showCancelButton: true,
          confirmButtonText: "Simpan",
          cancelButtonText: "Batal",
          confirmButtonColor: "#1a1a1a",
          preConfirm: () => {
            const tgl = document.getElementById("swTgl").value;
            const jam = document.getElementById("swJam").value;
            if (!tgl) { Swal.showValidationMessage("Pilih tanggal interview."); return false; }
            if (!jam) { Swal.showValidationMessage("Pilih jam interview."); return false; }
            return formatJadwal(tgl, jam);
          }
        });
        if (!r.isConfirmed) return;

        const { error } = await sb.rpc("tandai_interview", { p_santri: s.id, p_jadwal: r.value });
        if (error) return gagal(error);
        toast("Jadwal tersimpan. Sampaikan jadwal di grup dan japri.");
        loadCalon();
      }

      async function terimaCalon(s, batas) {
        if (!s) return;

        const tingkatList = s.tahun_ajaran_masuk === taKode
          ? [...new Set(rombelAll.map(x => Number(x.tingkat_kode)))].sort((a, b) => a - b)
          : Array.from({ length: batas }, (_, i) => i);
        if (!tingkatList.length) return peringatan("Belum ada rombel di tahun ajaran berjalan.");

        const opsi = tingkatList.map(i => `<option value="${i}">${esc(namaTingkat(i))}</option>`).join("");
        const besok3 = new Date(Date.now() + 3 * 86400000).toISOString().slice(0, 10);
        const r = await Swal.fire({
          title: "Terima " + s.nama_lengkap + "?",
          html: `
            <label class="small mb-1">Jenjang</label>
            <select id="swJenjang" class="swal2-select">${opsi}</select>
            <label class="small mb-1 mt-2">Batas pelunasan</label>
            <input id="swBatas" type="date" class="swal2-input" value="${besok3}">
            <p class="small text-muted mt-2">Pengumuman akan dikirim ke WhatsApp orang tua setelah diterima.</p>`,
          showCancelButton: true,
          confirmButtonText: "Terima santri",
          cancelButtonText: "Batal",
          confirmButtonColor: "#1a1a1a",
          preConfirm: () => ({
            tingkat: Number(document.getElementById("swJenjang").value),
            batas: document.getElementById("swBatas").value
          })
        });
        if (!r.isConfirmed) return;
        if (!r.value.batas) return peringatan("Isi batas pelunasan.");

        const { error } = await sb.rpc("terima_calon", {
          p_santri: s.id, p_tingkat: r.value.tingkat, p_batas: r.value.batas
        });
        if (error) return gagal(error);

        const kirim = await kirimNotif({ event: "diterima", santri_id: s.id });
        if (kirim.ok) {
          await catatWa(s.id);
          toast("Diterima. Pengumuman WhatsApp terkirim.");
        } else {
          peringatan("Calon sudah diterima, tetapi WhatsApp belum terkirim: " + kirim.pesan +
            ". Gunakan tombol Kirim ulang di tabel Diterima.");
        }
        loadCalon();
      }

      async function aktifkanTerpilih() {
        const rid = Number(document.getElementById("cRombel").value);
        if (!rid) return peringatan("Pilih kelas tujuan terlebih dahulu.");
        const kelas = rombelAll.find(x => x.id === rid);

        const pilih = [...panel("calon").querySelectorAll(".cPilih:checked")]
          .map(c => ({ id: Number(c.dataset.calon), tingkat: Number(c.dataset.tingkat) }));
        if (!pilih.length) return peringatan("Centang calon yang akan diaktifkan.");

        const tidakCocok = pilih.filter(x => x.tingkat !== kelas.tingkat_kode);
        if (tidakCocok.length) {
          return peringatan("Jenjang tidak sesuai dengan " + kelas.nama + ": " +
            tidakCocok.map(x => namaCalon[x.id]).join(", ") + ".");
        }

        if (!(await konfirmasi("Aktifkan " + pilih.length + " santri?",
          "Mereka akan masuk ke " + kelas.nama + " dan mendapat NIS."))) return;

        let ok = 0;
        const galat = [];
        for (const x of pilih) {
          const { error } = await sb.rpc("aktifkan_santri", { p_santri: x.id, p_rombel: rid });
          if (error) galat.push((namaCalon[x.id] || "") + ": " + error.message);
          else ok++;
        }
        if (ok) toast("Berhasil mengaktifkan " + ok + " santri.");
        if (galat.length) peringatan(galat.join("\n"));
        loadCalon();
      }

      // ===== TAMBAH & EDIT =====
      function openForm(id) {
        editId = id || null;
        buka("form");
        loadForm();
      }

      async function loadForm() {
        let row = null;
        if (editId) {
          const { data, error } = await sb.from("santri").select("*").eq("id", editId).maybeSingle();
          if (error) return gagal(error);
          row = data;
        }

        panel("form").innerHTML = `
          <h5 class="mb-3">${row ? "Edit: " + esc(row.nama_lengkap) : "Tambah Santri Baru"}</h5>
          <form id="fSantri">
            <div class="row">
              ${FIELD.map(([k, l, t, o]) => `
                <div class="col-md-6 col-12 mb-2" id="wrap_${k}">
                  <label class="small mb-1">${esc(l)}</label>
                  ${inputHtml(k, t, o, row)}
                </div>`).join("")}
            </div>
            <button class="btn btn-kuning" type="submit"><i class="fas fa-save"></i> Simpan</button>
            <button class="btn btn-secondary" type="button" id="fBatal">Batal</button>
          </form>`;

        if (!row) document.getElementById("f_agama").value = "Islam";

        // Bidang usaha hanya tampil jika Tempat Usaha dicentang
        const tu = document.querySelector('.eko-cb[value="Tempat Usaha"]');
        const wrapUsaha = document.getElementById("wrap_bidang_usaha");
        const sinkronUsaha = () => wrapUsaha.classList.toggle("d-none", !tu.checked);
        tu.onchange = sinkronUsaha;
        sinkronUsaha();

        document.getElementById("fBatal").onclick = () => { editId = null; buka("daftar"); };
        document.getElementById("fSantri").onsubmit = simpanForm;
      }

      async function simpanForm(e) {
        e.preventDefault();
        const d = {};
        FIELD.forEach(([k, , t]) => {
          if (t === "ekonomi") {
            d[k] = [...document.querySelectorAll(".eko-cb:checked")].map(x => x.value);
            return;
          }
          const el = document.getElementById("f_" + k);
          let v = el ? el.value.trim() : "";
          if (t === "anak" && v === "lainnya") {
            v = document.getElementById("f_" + k + "_lain").value.trim();
          }
          d[k] = v === "" ? null : v;
        });

        if (!d.nama_lengkap || !d.jenis_kelamin) return peringatan("Nama lengkap dan jenis kelamin wajib diisi.");
        if (d.anak_ke && !/^\d{1,2}$/.test(d.anak_ke)) return peringatan("Anak ke harus berupa angka.");
        if (d.wali_telp && !/^\d{8,15}$/.test(d.wali_telp.replace(/\D/g, ""))) {
          return peringatan("No. telp wali tidak valid.");
        }
        if (d.status_ekonomi.includes("Tempat Usaha") && !d.bidang_usaha) {
          return peringatan("Sebutkan bidang usaha.");
        }
        if (!d.status_ekonomi.includes("Tempat Usaha")) d.bidang_usaha = null;

        d.nama_lengkap = titleCase(d.nama_lengkap);
        if (d.tingkat_masuk !== null) d.tingkat_masuk = Number(d.tingkat_masuk);
        if (d.email_ortu) d.email_ortu = d.email_ortu.toLowerCase();
        if (d.wali_telp) d.wali_telp = d.wali_telp.replace(/\D/g, "");
        d.hp_orang_tua = d.hp_ibu || d.hp_ayah || null;
        ["nama_panggilan", "tempat_lahir", "desa_kelurahan", "kecamatan", "nama_ibu", "nama_ayah", "wali_nama"]
          .forEach(k => { if (d[k]) d[k] = d[k].toUpperCase(); });

        const btn = document.querySelector("#fSantri button[type=submit]");
        btn.disabled = true;

        const wasEdit = !!editId;
        let error;
        if (wasEdit) {
          ({ error } = await sb.from("santri").update(d).eq("id", editId));
        } else {
          Object.assign(d, {
            nis: null, status: "Calon Santri", tanggal_aktif: null,
            tingkat_sekarang: d.tingkat_masuk, tahun_ajaran_masuk: taKode
          });
          ({ error } = await sb.from("santri").insert(d));
        }
        btn.disabled = false;

        if (error) return gagal(error);

        if (wasEdit) {
          editId = null;
          toast("Data santri diperbarui.");
          buka("daftar");
          tampilDaftar();
        } else {
          toast("Calon santri tersimpan. Proses dilanjutkan dari tab Calon Santri.");
          loadForm();
        }
      }

      // ===== AKTIVASI & PINDAH (ADMIN) =====
      async function loadPindah() {
        const { data } = await sb.from("santri")
          .select("id, nis, nama_lengkap, status, tingkat_masuk, tingkat_sekarang").order("nama_lengkap");
        daftarPindah = data || [];

        panel("pindah").innerHTML = `
          <div class="row">
            <div class="col-md-6 mb-2">
              <label class="small mb-1">Santri</label>
              <select id="pSantri" class="form-control">
                <option value="">-- pilih santri --</option>
                ${daftarPindah.map(s => `<option value="${s.id}">${esc((s.nis || "belum ber-NIS") + " - " + s.nama_lengkap)}</option>`).join("")}
              </select>
            </div>
            <div class="col-md-3 mb-2">
              <label class="small mb-1">Status</label>
              <select id="pStatus" class="form-control">${STATUS.map(s => `<option>${s}</option>`).join("")}</select>
            </div>
            <div class="col-md-3 mb-2">
              <label class="small mb-1">Kelas (TA aktif)</label>
              <select id="pRombel" class="form-control"></select>
            </div>
          </div>
          <button class="btn btn-kuning" id="pSimpan"><i class="fas fa-save"></i> Simpan Perubahan</button>
          <p class="text-muted small mt-2">
            Status Aktif membuat NIS (jika belum punya) dan memasukkan santri ke kelas.
            Status lain melepas santri dari kelas tahun ajaran ini.
          </p>`;

        document.getElementById("pSantri").onchange = muatStatusPindah;
        document.getElementById("pSimpan").onclick = simpanPindah;
        isiRombelPindah(null);
      }

      function isiRombelPindah(tingkat, pilih) {
        const sel = document.getElementById("pRombel");
        const list = tingkat === null ? [] : rombelAll.filter(x => x.tingkat_kode === tingkat);
        sel.innerHTML = `<option value="">(tidak di kelas)</option>` +
          list.map(x => `<option value="${x.id}">${esc(x.nama)}</option>`).join("");
        if (pilih) sel.value = String(pilih);
      }

      async function muatStatusPindah() {
        const id = Number(document.getElementById("pSantri").value);
        if (!id) return isiRombelPindah(null);

        const s = daftarPindah.find(x => x.id === id);
        const { data: kr } = await sb.from("keanggotaan_rombel").select("rombel_id")
          .eq("santri_id", id).eq("tahun_ajaran_id", taId).maybeSingle();

        document.getElementById("pStatus").value = s.status;
        isiRombelPindah(s.tingkat_sekarang ?? s.tingkat_masuk, kr ? kr.rombel_id : null);
      }

      async function simpanPindah() {
        const id = Number(document.getElementById("pSantri").value);
        if (!id) return peringatan("Pilih santri terlebih dahulu.");
        const status = document.getElementById("pStatus").value;
        const rid = Number(document.getElementById("pRombel").value) || null;

        if (status === "Aktif") {
          if (!rid) return peringatan("Santri aktif harus dimasukkan ke kelas.");
          const { data: nis, error } = await sb.rpc("aktifkan_santri", { p_santri: id, p_rombel: rid });
          if (error) return peringatan(error.message);
          toast("Tersimpan. NIS: " + nis + ".");
        } else {
          if (!(await konfirmasi("Ubah status menjadi " + status + "?",
            "Santri akan dilepas dari kelas tahun ajaran ini."))) return;

          const { error: e1 } = await sb.from("santri").update({ status }).eq("id", id);
          if (e1) return gagal(e1);

          const { error: e2 } = await sb.from("keanggotaan_rombel").delete()
            .eq("santri_id", id).eq("tahun_ajaran_id", taId);
          if (e2) return gagal(e2);

          toast("Status tersimpan.");
        }
        await loadPindah();
      }

      // ===== MULAI =====
      buka("daftar");
      loadDaftar();
    }
  });
</script>
</body>
</html>

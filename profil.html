<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil - Kuttab Al-Kalam</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
<link rel="stylesheet" href="ui.css">
<style>
  .profil-avatar {
    width: 88px; height: 88px; border-radius: 50%; background: #1a1a1a; color: #f2c94c;
    display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 10px;
  }
  .profil-nama { text-align: center; font-weight: 700; font-size: 18px; color: #1a1a1a; }
  .profil-peran { text-align: center; margin-bottom: 12px; }
  .baris-info { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
  .baris-info:last-child { border-bottom: 0; }
  .baris-info .k { color: #666; }
  .baris-info .v { font-weight: 600; text-align: right; word-break: break-all; }
  .pesan-form { min-height: 20px; font-size: 14px; margin-top: 8px; }
</style>
</head>
<body class="hold-transition sidebar-mini">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="ui.js"></script>

<script>
  KUTTAB.halaman({
    aktif: "profil",
    judul: "Profil Saya",
    roles: ["admin", "kepala", "staf", "guru"],
    render: async ({ sb, me, konten, toast, gagal, peringatan, esc }) => {
      const $ = id => document.getElementById(id);
      const PERAN = { admin: "Admin", kepala: "Kepala", guru: "Guru", staf: "Staf" };

      const { data: { session } } = await sb.auth.getSession();

      const { data: p, error } = await sb.from("pegawai")
        .select("id, nama_lengkap, email, nomor_hp, peran")
        .eq("id", me.id).maybeSingle();
      if (error) return gagal(error);
      let data = p;

      konten.innerHTML = `
        <div class="row">
          <div class="col-lg-4 mb-3">
            <div class="card card-outline card-warning">
              <div class="card-body">
                <div class="profil-avatar"><i class="fas fa-user"></i></div>
                <div class="profil-nama" id="vNama"></div>
                <div class="profil-peran"><span class="badge badge-dark" id="vPeran"></span></div>
                <div class="baris-info"><span class="k">Email</span><span class="v" id="vEmail"></span></div>
                <div class="baris-info"><span class="k">Nomor HP</span><span class="v" id="vHp"></span></div>
                <p class="small text-muted mt-3 mb-0">
                  Nama, email, dan peran diubah oleh admin. Nomor HP bisa Anda ubah sendiri.
                </p>
              </div>
            </div>
          </div>

          <div class="col-lg-8">
            <div class="card card-outline card-info">
              <div class="card-header"><h3 class="card-title"><i class="fas fa-phone"></i> Nomor HP</h3></div>
              <div class="card-body">
                <div class="form-group">
                  <label class="small mb-1">Nomor HP (WhatsApp aktif)</label>
                  <input id="hp" type="tel" inputmode="tel" class="form-control" placeholder="08xxxxxxxxxx">
                </div>
                <button class="btn btn-kuning" id="simpanHp"><i class="fas fa-save"></i> Simpan Nomor HP</button>
                <div class="pesan-form" id="pesanHp"></div>
              </div>
            </div>

            <div class="card card-outline card-warning">
              <div class="card-header"><h3 class="card-title"><i class="fas fa-key"></i> Ganti Password</h3></div>
              <div class="card-body">
                <div class="form-group">
                  <label class="small mb-1">Password lama</label>
                  <input id="pwLama" type="password" autocomplete="current-password" class="form-control">
                </div>
                <div class="form-row">
                  <div class="col-12 col-md-6 form-group">
                    <label class="small mb-1">Password baru (minimal 8 karakter)</label>
                    <input id="pwBaru" type="password" autocomplete="new-password" minlength="8" class="form-control">
                  </div>
                  <div class="col-12 col-md-6 form-group">
                    <label class="small mb-1">Ulangi password baru</label>
                    <input id="pwUlang" type="password" autocomplete="new-password" minlength="8" class="form-control">
                  </div>
                </div>
                <button class="btn btn-hitam" id="gantiPw"><i class="fas fa-save"></i> Ganti Password</button>
                <div class="pesan-form" id="pesanPw"></div>
                <p class="small text-muted mt-2 mb-0">Password lama diperiksa dulu sebelum diganti.</p>
              </div>
            </div>
          </div>
        </div>`;

      function isiData() {
        $("vNama").textContent = data.nama_lengkap;
        $("vEmail").textContent = data.email;
        $("vPeran").textContent = PERAN[data.peran] || data.peran;
        $("vHp").textContent = data.nomor_hp || "-";
        $("hp").value = data.nomor_hp || "";
      }
      isiData();

      const pesanHp = (t, ok = true) => {
        $("pesanHp").textContent = t;
        $("pesanHp").className = "pesan-form " + (ok ? "text-success" : "text-danger");
      };
      const pesanPw = (t, ok = true) => {
        $("pesanPw").textContent = t;
        $("pesanPw").className = "pesan-form " + (ok ? "text-success" : "text-danger");
      };

      function normalisasiHp(v) {
        const bersih = v.replace(/[\s\-()]/g, "");
        if (!/^(\+?62|0)[0-9]{8,13}$/.test(bersih)) return null;
        return bersih.replace(/^\+/, "").replace(/^0/, "62");
      }

      $("simpanHp").onclick = async () => {
        const hp = normalisasiHp($("hp").value.trim());
        if (!hp) return pesanHp("Nomor HP tidak valid. Contoh: 081234567890", false);

        $("simpanHp").disabled = true;
        const { error } = await sb.from("pegawai").update({ nomor_hp: hp }).eq("id", me.id);
        $("simpanHp").disabled = false;
        if (error) return gagal(error);

        data.nomor_hp = hp;
        isiData();
        pesanHp("Nomor HP tersimpan.");
        toast("Nomor HP tersimpan.");
      };

      $("gantiPw").onclick = async () => {
        const lama = $("pwLama").value;
        const baru = $("pwBaru").value;
        const ulang = $("pwUlang").value;

        if (!lama || !baru || !ulang) return pesanPw("Lengkapi ketiga kolom password.", false);
        if (baru.length < 8) return pesanPw("Password baru minimal 8 karakter.", false);
        if (baru !== ulang) return pesanPw("Password baru dan ulangannya tidak sama.", false);
        if (baru === lama) return pesanPw("Password baru harus berbeda dari password lama.", false);

        $("gantiPw").disabled = true;
        pesanPw("Memeriksa password lama...");

        const { error: eLogin } = await sb.auth.signInWithPassword({
          email: session.user.email,
          password: lama
        });
        if (eLogin) {
          $("gantiPw").disabled = false;
          return pesanPw("Password lama tidak sesuai.", false);
        }

        const { error } = await sb.auth.updateUser({ password: baru });
        $("gantiPw").disabled = false;
        if (error) return pesanPw("Gagal mengganti password: " + error.message, false);

        $("pwLama").value = "";
        $("pwBaru").value = "";
        $("pwUlang").value = "";
        pesanPw("Password berhasil diganti.");
        toast("Password berhasil diganti.");
      };
    }
  });
</script>
</body>
</html>

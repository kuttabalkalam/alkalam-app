<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atur Password - Kuttab Al-Kalam</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
</head>
<body style="font-family:sans-serif;max-width:380px;margin:60px auto;padding:0 16px">
  <h2>Atur Password</h2>
  <p id="msg">Memverifikasi undangan...</p>
  <form id="f" style="display:none">
    <input id="pw" type="password" minlength="8" required
      placeholder="Password baru (min. 8 karakter)"
      style="width:100%;padding:8px;margin:8px 0;box-sizing:border-box">
    <button type="submit" style="padding:8px 16px">Simpan Password</button>
  </form>

  <script>
    const SUPABASE_URL = "ISI_URL_PROYEK";        // dari Project Settings → API
    const SUPABASE_ANON_KEY = "ISI_ANON_KEY";     // anon public key, bukan service_role

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const msg = document.getElementById("msg");
    const form = document.getElementById("f");

    function tampilkanForm() {
      msg.textContent = "Undangan terverifikasi. Silakan buat password.";
      form.style.display = "block";
    }

    sb.auth.onAuthStateChange((event, session) => {
      if (session) tampilkanForm();
    });

    sb.auth.getSession().then(({ data }) => {
      if (data.session) tampilkanForm();
      else if (!location.hash) msg.textContent = "Tautan tidak valid atau sudah kedaluwarsa.";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.updateUser({
        password: document.getElementById("pw").value
      });
      if (error) {
        msg.textContent = "Gagal: " + error.message;
      } else {
        msg.textContent = "Password berhasil disimpan. Silakan login.";
        form.style.display = "none";
      }
    });
  </script>
</body>
</html>

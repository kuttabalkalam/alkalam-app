<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atur Password - Kuttab Al-Kalam</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
</head>
<body style="font-family:sans-serif;max-width:380px;margin:60px auto;padding:0 16px">
  <h2>Atur Password</h2>
  <p id="msg">Memverifikasi undangan...</p>
  <form id="f" style="display:none">
    <input id="pw" type="password" minlength="8" required
      placeholder="Password baru (min. 8 karakter)"
      style="width:100%;padding:8px;margin:8px 0;box-sizing:border-box">
    <button type="submit" style="padding:8px 16px">Simpan Password</button>
  </form>

  <script>
  const SUPABASE_URL = "https://epynlmuqxumuwcjsrnsz.supabase.co";  // isi dengan Project URL kamu
  const SUPABASE_ANON_KEY = "sb_publishable_Oq_to1zgHLnachvWYLV_yA_DoOTGI3s";                  // isi dengan anon public key

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const msg = document.getElementById("msg");
  const form = document.getElementById("f");
  let sudahSiap = false;

  function tampilkanForm() {
    sudahSiap = true;
    msg.textContent = "Undangan terverifikasi. Silakan buat password.";
    form.style.display = "block";
  }

  function tampilkanGagal(teks) {
    sudahSiap = true;
    msg.textContent = teks;
  }

  // Cek apakah Supabase mengembalikan error di alamat
  const params = new URLSearchParams(location.hash.substring(1));
  if (params.get("error")) {
    const kode = params.get("error_code");
    tampilkanGagal(kode === "otp_expired"
      ? "Tautan sudah kedaluwarsa atau sudah pernah dipakai. Minta undangan baru dari admin."
      : "Tautan tidak valid. Minta undangan baru dari admin.");
  }

  sb.auth.onAuthStateChange((event, session) => {
    if (session) tampilkanForm();
  });

  sb.auth.getSession().then(({ data }) => {
    if (data.session) tampilkanForm();
  });

  // Jika setelah 10 detik belum ada sesi, beri tahu pengguna
  setTimeout(() => {
    if (!sudahSiap) {
      tampilkanGagal("Verifikasi belum berhasil. Coba buka ulang tautan undangan, atau minta undangan baru dari admin.");
    }
  }, 10000);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.updateUser({
      password: document.getElementById("pw").value
    });
    if (error) {
      msg.textContent = "Gagal: " + error.message;
    } else {
      msg.textContent = "Password berhasil disimpan. Silakan login.";
      form.style.display = "none";
    }
  });
</script>
</body>
</html>

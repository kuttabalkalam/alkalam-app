<style>
  body { font-family: Arial, sans-serif; font-size: 12px; color: #111; margin: 0; }

  .controls { max-width: 900px; margin: 16px auto; padding: 12px; }
  .controls a { display: inline-block; margin-bottom: 8px; }
  .controls label { display: inline-block; margin: 4px 12px 4px 0; }
  .controls select, .controls input[type=date] { padding: 4px; }
  .controls button { padding: 6px 12px; margin: 4px 6px 4px 0; }
  #pesan { font-weight: bold; min-height: 18px; }

  .page { width: 210mm; margin: 0 auto 10mm; padding-bottom: 8mm; box-sizing: border-box; background: #fff; }
  .page.lampiran { border-top: 1px dashed #ccc; }
  .kop { display: block; width: 100%; margin: 0; }
  .isi { padding: 0 12mm; }

  h3.judul { text-align: center; font-size: 14px; font-weight: bold; margin: 8mm 0 5mm; line-height: 1.5; }

  /* Identitas: label dan nilai berdekatan */
  .ident { display: grid; grid-template-columns: 130px 1fr 55px 1fr; row-gap: 2px; font-size: 12px; margin-bottom: 5mm; }

  table { border-collapse: collapse; }
  table.tabel { width: 100%; table-layout: fixed; font-size: 12px; }
  table.tabel th, table.tabel td { border: 1px solid #000; padding: 6px; vertical-align: middle; word-wrap: break-word; }
  table.tabel th { background: #fff; text-align: center; font-weight: bold; }
  table.tabel td.kel { font-weight: bold; text-align: center; }
  table.tabel td.c { text-align: center; }
  table.tabel td.sub { padding-left: 18px; }
  table.tabel td.isi { text-align: justify; line-height: 1.5; white-space: pre-line; padding: 6px 8px; }

  /* Border per kotak mata pelajaran (judul + sub). Selector dibuat lebih spesifik
     agar tidak kalah dengan aturan border umum di atas. */
  table.tabel td.r-top { border-bottom: none; }
  table.tabel td.r-mid { border-top: none; border-bottom: none; }
  table.tabel td.r-bot { border-top: none; }

  .absen { margin-top: 6mm; }
  .absen p { text-align: center; margin: 0 0 2mm; font-weight: bold; }
  table.kecil { margin: 0 auto; width: auto; font-size: 12px; }
  table.kecil th, table.kecil td { border: 1px solid #000; padding: 3px 14px; font-size: 12px; }

  /* Tanda tangan: dua kolom sama lebar.
     Baris 1: tanggal di kolom kanan (rata tengah terhadap Guru Kelas).
     Baris 2: Orang Tua dan Guru Kelas sejajar horizontal. */
  .ttd { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8mm; margin-top: 10mm; }
  .ttd > div { text-align: center; }
  .ttd .tgl { margin-bottom: 4mm; }

  @media print {
    @page { size: A4; margin: 0; }
    body { margin: 0; }
    .no-print { display: none !important; }
    .page { width: 210mm; margin: 0; padding-bottom: 8mm; border: none; page-break-after: always; }
    .page:last-child { page-break-after: auto; }
    .page.lampiran { border-top: none; }
  }
</style>
</head>

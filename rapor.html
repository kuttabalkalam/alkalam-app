<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapor - Kuttab Al-Kalam</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
<link rel="stylesheet" href="ui.css">
<style>
  /* ===== Pratinjau di layar ===== */
  .pratinjau { overflow-x: auto; background: #dfe7ef; padding: 12px; border-radius: 6px; }
  .page {
    width: 210mm; margin: 0 auto 14px; padding-bottom: 8mm; box-sizing: border-box;
    background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  .page.lampiran, .page.mawas, .page.identitas { border-top: 1px dashed #ccc; }
  .kop { display: block; width: 100%; margin: 0; }
  .isi { padding: 0 12mm; color: #111; font-size: 12px; }
  h3.judul { text-align: center; font-size: 14px; font-weight: bold; margin: 8mm 0 5mm; line-height: 1.5; }

  .ident { display: grid; grid-template-columns: 130px 1fr 55px 1fr; row-gap: 2px; font-size: 12px; margin-bottom: 5mm; }

  table.tabel { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 12px; }
  table.tabel th, table.tabel td { border: 1px solid #000; padding: 6px; vertical-align: middle; word-wrap: break-word; }
  table.tabel th { background: #fff; text-align: center; font-weight: bold; }
  table.tabel td.kel { font-weight: bold; text-align: center; }
  table.tabel td.c { text-align: center; }
  table.tabel td.sub { padding-left: 18px; }
  table.tabel td.isi { text-align: justify; line-height: 1.5; white-space: pre-line; padding: 6px 8px; }

  /* Border per kotak mata pelajaran (judul + sub) */
  table.tabel td.r-top { border-bottom: none; }
  table.tabel td.r-mid { border-top: none; border-bottom: none; }
  table.tabel td.r-bot { border-top: none; }

  .absen { margin-top: 6mm; }
  .absen p { text-align: center; margin: 0 0 2mm; font-weight: bold; }
  table.kecil { margin: 0 auto; width: auto; font-size: 12px; }
  table.kecil th, table.kecil td { border: 1px solid #000; padding: 3px 14px; font-size: 12px; }

  .kesimpulan { margin-top: 5mm; font-size: 12px; line-height: 1.7; }

  /* Tanda tangan rapor dan lampiran: tanggal di atas Guru Kelas, Orang Tua dan Guru Kelas sejajar */
  .ttd { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8mm; margin-top: 10mm; }
  .ttd > div { text-align: center; }
  .ttd .tgl { margin-bottom: 4mm; }

  /* Tanda tangan MAWAS: orang tua dan kepala sejajar, masing-masing setengah lebar */
  .ttd-kepala { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8mm; margin-top: 10mm; font-size: 12px; }
  .ttd-kepala > div { text-align: center; }
  .ttd-kepala .tgl { margin-bottom: 4mm; }

  /* Halaman identitas santri */
  .judul-id { text-align: center; font-size: 14px; font-weight: bold; margin: 14mm 0 10mm; }
  .id-tabel { width: 100%; border-collapse: collapse; font-size: 12px; }
  .id-tabel td { padding: 2px 4px; vertical-align: top; line-height: 1.7; }
  .id-tabel td.no { width: 7%; }
  .id-tabel td.lbl { width: 38%; }
  .id-tabel td.lbl.sisip { padding-left: 18px; }
  .id-tabel td.colon { width: 3%; }
  .id-tabel td.val { width: 52%; }
  .id-bawah { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10mm; font-size: 12px; }
  .id-foto { width: 30mm; height: 40mm; border: 1px solid #000; }
  .id-ttd { width: 70mm; text-align: center; }

  /* ===== Cetak: hanya halaman rapor yang keluar, mulai dari pojok kiri atas ===== */
  @media print {
    @page { size: A4; margin: 0; }
    html, body { width: 210mm !important; margin: 0 !important; padding: 0 !important; background: #fff !important; }
    body > *:not(#cetak) { display: none !important; }
    #cetak {
      display: block !important; width: 210mm !important; margin: 0 !important; padding: 0 !important;
      background: #fff !important; border: 0 !important; box-shadow: none !important; overflow: visible !important;
    }
    .page {
      width: 210mm !important; max-width: 210mm !important; margin: 0 !important; padding-bottom: 8mm;
      border: 0 !important; box-shadow: none !important; overflow: hidden; page-break-after: always;
    }
    .page:last-child { page-break-after: auto; }
    .page.lampiran, .page.mawas, .page.identitas { border-top: 0 !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  }
</style>
</head>
<body class="hold-transition sidebar-mini">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="ui.js"></script>

<script>
  KUTTAB.halaman({
    aktif: "rapor",
    judul: "Rapor",
    roles: ["admin", "kepala"],
    render: async ({ sb, me, konten, gagal, esc }) => {
      const $ = id => document.getElementById(id);
      const admin = me.peran === "admin";

      const pesan = (t, tipe = "info") => {
        const el = $("pesan");
        el.textContent = t;
        el.className = "small ml-2 " + (tipe === "error" ? "text-danger" : tipe === "ok" ? "text-success" : "text-muted");
      };

      // ===== Helper rapor =====
      const SATUAN = ["Nol","Satu","Dua","Tiga","Empat","Lima","Enam","Tujuh","Delapan","Sembilan","Sepuluh","Sebelas"];
      function bilangan(n) {
        if (n < 12) return SATUAN[n];
        if (n < 20) return SATUAN[n - 10] + " Belas";
        if (n < 100) { const p = Math.floor(n / 10), s = n % 10; return SATUAN[p] + " Puluh" + (s ? " " + SATUAN[s] : ""); }
        return "Seratus";
      }
      function nilaiTeks(v) {
        if (v == null || v === "") return { a: "-", t: "-" };
        const [b, d] = Number(v).toFixed(2).split(".");
        return { a: b + "," + d, t: bilangan(Number(b)) + " Koma " + d.split("").map(x => SATUAN[Number(x)]).join(" ") };
      }

      const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
      const tglIndo = iso => { if (!iso) return "-"; const [y, m, d] = iso.split("-"); return Number(d) + " " + BULAN[Number(m) - 1] + " " + y; };
      const teksAman = v => v == null || v === "" ? "-" : esc(v);

      const SANTRI_IDENT = "id, nis, nama_lengkap, jenis_kelamin, tempat_lahir, tanggal_lahir, agama, alamat, alamat_dom_rt, alamat_dom_rw, alamat_dom_desa, alamat_dom_kecamatan, alamat_dom_kodepos, hp_orang_tua, nama_ayah, nama_ibu, pekerjaan_ayah, pekerjaan_ibu, tanggal_aktif, tanggal_diterima, identitas_cetak_at";

      // Struktur: kelompok > mapel > sub-komponen (anak). Mapel tanpa anak adalah baris tunggal.
      const STRUKTUR = [
        { kelompok: "I. Muatan Khusus", mapel: [
          { label: "A. Karakter Iman", anak: [
            { kode: "iman", label: "1) Pemahaman" }
          ]},
          { label: "B. Al-Qur'an", anak: [
            { kode: "tahfidz", label: "1) Tahfidz" },
            { kode: "tilawah", label: "2) Tilawah" },
            { kode: "kitabah", label: "3) Kitabah" }
          ]},
          { label: "C. Ibadah", kode: "ibadah" }
        ]},
        { kelompok: "II. Murofaqot", mapel: [
          { label: "A. Matematika / Berhitung", kode: "mtk" },
          { label: "B. Bahasa Indonesia", kode: "bindo" },
          { label: "C. Ilmu Pengetahuan Alam", kode: "ipa" },
          { label: "D. Ilmu Pengetahuan Sosial", kode: "ips" }
        ]},
        { kelompok: "III. Muatan Penunjang", mapel: [
          { label: "A. Keterampilan Fisik / Olahraga", kode: "olahraga" },
          { label: "B. Keterampilan Hidup / Life Skill", kode: "lifeskill" },
          { label: "C. Bahasa Peradaban / Bahasa Arab", kode: "arab" }
        ]}
      ];

      function htmlIdentitas(s, ctx) {
        return `<div class="ident">
          <div>Nama Santri</div><div>: ${esc(s.nama_lengkap)}</div>
          <div>Kelas</div><div>: ${esc(ctx.rombel.nama)}</div>
          <div>Nomor Induk Santri</div><div>: ${esc(s.nis || "-")}</div>
          <div></div><div></div>
        </div>`;
      }

      function htmlTtd(ctx) {
        return `<div class="ttd">
          <div></div>
          <div class="tgl">Tangerang Selatan, ${tglIndo(ctx.tanggal)}</div>
          <div>Orang Tua / Wali<br><br><br><br>( ........................................ )</div>
          <div>Guru Kelas Kuttab Al Kalam<br><br><br><br><b><u>${esc(ctx.waliLabel || "........................")}</u></b></div>
        </div>`;
      }

      // Tanda tangan MAWAS: orang tua di kiri dan kepala kuttab di kanan, sejajar seperti rapor
      function htmlTtdKepala(ctx) {
        return `<div class="ttd-kepala">
          <div>
            <div class="tgl">&nbsp;</div>
            <div>Orang Tua / Wali<br><br><br><br>( ........................................ )</div>
          </div>
          <div>
            <div class="tgl">Tangerang Selatan, ${tglIndo(ctx.tanggal)}</div>
            <div>Kepala Kuttab Al Kalam<br><br><br><br><b><u>${esc(ctx.kepalaLabel || "........................")}</u></b></div>
          </div>
        </div>`;
      }

      function htmlRapor(s, ctx, nilaiMap, absenMap) {
        const n = nilaiMap[s.id] || {};
        const ab = absenMap[s.id];
        const semLabel = ctx.sem.nomor === 1 ? "GANJIL" : "GENAP";
        const nilaiList = [];
        const ambil = kode => { const v = n[kode]; if (v != null) nilaiList.push(Number(v)); return v; };
        const rows = [];

        STRUKTUR.forEach(g => {
          const baris = [];
          g.mapel.forEach(m => {
            if (m.anak) {
              baris.push({ label: m.label, cls: "r-top", kode: null, sub: false });
              m.anak.forEach((a, i) => baris.push({
                label: a.label, kode: a.kode, sub: true,
                cls: i === m.anak.length - 1 ? "r-bot" : "r-mid"
              }));
            } else {
              baris.push({ label: m.label, kode: m.kode, sub: false, cls: "r-solo" });
            }
          });

          baris.forEach((r, i) => {
            const kel = i === 0 ? `<td rowspan="${baris.length}" class="kel">${esc(g.kelompok)}</td>` : "";
            let angka = "", huruf = "";
            if (r.kode) {
              const f = nilaiTeks(ambil(r.kode));
              angka = f.a; huruf = f.t;
            }
            rows.push(`<tr>${kel}<td class="${r.cls}${r.sub ? " sub" : ""}">${esc(r.label)}</td>` +
              `<td class="c ${r.cls}">${angka}</td><td class="c ${r.cls}">${huruf}</td></tr>`);
          });
        });

        const rata = nilaiList.length ? nilaiList.reduce((a, b) => a + b, 0) / nilaiList.length : null;
        const fr = nilaiTeks(rata);
        const absen = k => ab ? ab[k] : "-";

        return `<section class="page rapor">
          <img class="kop" src="kop.png" alt="Kop Kuttab Al-Kalam">
          <div class="isi">
            <h3 class="judul">RAPOR SEMESTER ${semLabel}<br>TAHUN AJARAN ${esc(ctx.ta.kode)}</h3>
            ${htmlIdentitas(s, ctx)}
            <table class="tabel">
              <colgroup><col style="width:22%"><col style="width:40%"><col style="width:15%"><col style="width:23%"></colgroup>
              <tr><th colspan="2" rowspan="2">MATA PELAJARAN</th><th colspan="2">PENILAIAN</th></tr>
              <tr><th>ANGKA</th><th>HURUF</th></tr>
              ${rows.join("")}
              <tr><td colspan="2" class="c"><b>Nilai rata-rata</b></td><td class="c"><b>${fr.a}</b></td><td class="c"><b>${fr.t}</b></td></tr>
            </table>
            <div class="absen">
              <p>Ketidakhadiran/Absensi</p>
              <table class="tabel kecil">
                <tr><th>No</th><th>Alasan</th><th>Hari</th></tr>
                <tr><td class="c">1</td><td>Sakit</td><td class="c">${absen("sakit")}</td></tr>
                <tr><td class="c">2</td><td>Izin</td><td class="c">${absen("izin")}</td></tr>
                <tr><td class="c">3</td><td>Tanpa Uzur Syar'i</td><td class="c">${absen("tanpa_uzur")}</td></tr>
              </table>
            </div>
            ${htmlTtd(ctx)}
          </div>
        </section>`;
      }

      function htmlLampiran(s, ctx, deskMap, aspekByKode) {
        const d = deskMap[s.id] || {};
        let body = "";

        STRUKTUR.forEach(g => {
          const baris = [];
          g.mapel.forEach(m => {
            if (m.anak) {
              const subs = [];
              m.anak.forEach(a => (aspekByKode[a.kode] || []).forEach(asp => {
                const isi = (d[asp.id] || "").trim();
                if (isi) subs.push({ nama: asp.nama, isi });
              }));
              if (!subs.length) return;
              baris.push({ label: m.label + ":", isi: "", cls: "r-top", sub: false });
              subs.forEach((x, i) => baris.push({
                label: (i + 1) + ". " + x.nama, isi: x.isi, sub: true,
                cls: i === subs.length - 1 ? "r-bot" : "r-mid"
              }));
            } else {
              (aspekByKode[m.kode] || []).forEach(asp => {
                const isi = (d[asp.id] || "").trim();
                if (isi) baris.push({ label: m.label, isi, sub: false, cls: "r-solo" });
              });
            }
          });

          if (!baris.length) return;
          body += baris.map((r, i) => {
            const kel = i === 0 ? `<td rowspan="${baris.length}" class="kel">${esc(g.kelompok)}</td>` : "";
            return `<tr>${kel}<td class="${r.cls}${r.sub ? " sub" : ""}">${esc(r.label)}</td>` +
              `<td class="isi ${r.cls}">${esc(r.isi)}</td></tr>`;
          }).join("");
        });

        if (!body) body = `<tr><td colspan="3" class="c">Belum ada deskripsi untuk santri ini.</td></tr>`;

        return `<section class="page lampiran">
          <img class="kop" src="kop.png" alt="Kop Kuttab Al-Kalam">
          <div class="isi">
            <h3 class="judul">LAMPIRAN DESKRIPSI CAPAIAN<br>SEMESTER GANJIL TAHUN AJARAN ${esc(ctx.ta.kode)}</h3>
            ${htmlIdentitas(s, ctx)}
            <table class="tabel">
              <colgroup><col style="width:20%"><col style="width:30%"><col style="width:50%"></colgroup>
              <tr><th colspan="2">MATA PELAJARAN</th><th>DESKRIPSI</th></tr>
              ${body}
            </table>
            ${htmlTtd(ctx)}
          </div>
        </section>`;
      }

      // Kehadiran orang tua dalam MAWAS. Persentase dihitung dari seluruh sesi di semester.
      function htmlMawas(s, ctx, sesi, hadirMap) {
        const h = hadirMap[s.id] || {};
        const total = sesi.length;
        let a = 0, b = 0;
        const baris = sesi.map((x, i) => {
          const r = h[x.id] || {};
          if (r.ayah) a++;
          if (r.bunda) b++;
          return `<tr>
            <td class="c">${i + 1}</td>
            <td class="c">${tglIndo(x.tanggal)}</td>
            <td>${esc(x.tema)}</td>
            <td>${esc(x.pemateri)}</td>
            <td class="c">${r.ayah ? "✓" : "-"}</td>
            <td class="c">${r.bunda ? "✓" : "-"}</td>
          </tr>`;
        }).join("");

        const pa = total ? Math.round(a * 100 / total) : 0;
        const pb = total ? Math.round(b * 100 / total) : 0;

        return `<section class="page mawas">
          <img class="kop" src="kop.png" alt="Kop Kuttab Al-Kalam">
          <div class="isi">
            <h3 class="judul">KEHADIRAN ORANG TUA DALAM MAWAS<br>(MAJELIS ILMU WALI SANTRI)<br>TAHUN AJARAN ${esc(ctx.ta.kode)}</h3>
            ${htmlIdentitas(s, ctx)}
            <table class="tabel">
              <colgroup><col style="width:7%"><col style="width:17%"><col style="width:36%"><col style="width:24%"><col style="width:8%"><col style="width:8%"></colgroup>
              <tr><th>No</th><th>Tanggal</th><th>Judul / Tema Kajian</th><th>Pemateri</th><th>Ayah</th><th>Bunda</th></tr>
              ${baris || `<tr><td colspan="6" class="c">Belum ada kegiatan MAWAS pada semester ini.</td></tr>`}
            </table>
            <div class="kesimpulan">
              <b>Kesimpulan kehadiran:</b><br>
              Ayah: <b>${pa}%</b> (${a} dari ${total} kegiatan)<br>
              Ibu/Bunda: <b>${pb}%</b> (${b} dari ${total} kegiatan)
            </div>
            ${htmlTtdKepala(ctx)}
          </div>
        </section>`;
      }

      // Identitas santri: hanya data yang ada di database. Dicetak sekali, kecuali admin memilih cetak ulang.
      function htmlIdentitasSantri(s, ctx) {
        const jk = s.jenis_kelamin === "L" ? "Laki-laki" : s.jenis_kelamin === "P" ? "Perempuan" : "-";
        const alamat = [
          s.alamat,
          s.alamat_dom_rt ? "RT " + s.alamat_dom_rt : "",
          s.alamat_dom_rw ? "RW " + s.alamat_dom_rw : "",
          s.alamat_dom_desa, s.alamat_dom_kecamatan, s.alamat_dom_kodepos
        ].filter(Boolean).join(", ");
        const ttl = [s.tempat_lahir, s.tanggal_lahir ? tglIndo(s.tanggal_lahir) : ""].filter(Boolean).join(", ");
        const tglMasuk = s.tanggal_aktif || s.tanggal_diterima;

        const isi = (no, label, nilai) =>
          `<tr><td class="no">${no}</td><td class="lbl">${esc(label)}</td><td class="colon">:</td><td class="val">${teksAman(nilai)}</td></tr>`;
        const judul = (no, label) =>
          `<tr><td class="no">${no}</td><td class="lbl" colspan="3">${esc(label)}</td></tr>`;
        const sisip = (label, nilai) =>
          `<tr><td></td><td class="lbl sisip">${esc(label)}</td><td class="colon">:</td><td class="val">${teksAman(nilai)}</td></tr>`;

        return `<section class="page identitas">
          <div class="isi">
            <h3 class="judul-id">IDENTITAS SANTRI KUTTAB AL KALAM</h3>
            <table class="id-tabel">
              ${isi(1, "Nama Santri", s.nama_lengkap)}
              ${isi(2, "Nomor Induk Santri", s.nis)}
              ${isi(3, "Tempat, Tanggal Lahir", ttl)}
              ${isi(4, "Agama", s.agama)}
              ${isi(5, "Jenis Kelamin", jk)}
              ${isi(6, "Alamat Santri", alamat)}
              ${isi(7, "Nomor Telepon", s.hp_orang_tua)}
              ${judul(8, "Diterima di sekolah ini")}
              ${sisip("Di kelas", ctx.rombel.nama)}
              ${sisip("Pada tanggal", tglMasuk ? tglIndo(tglMasuk) : "-")}
              ${sisip("Semester", ctx.sem.nomor === 1 ? "Ganjil" : "Genap")}
              ${judul(9, "Nama Orang Tua")}
              ${sisip("a. Ayah", s.nama_ayah)}
              ${sisip("b. Ibu", s.nama_ibu)}
              ${judul(10, "Pekerjaan Orang Tua")}
              ${sisip("a. Ayah", s.pekerjaan_ayah)}
              ${sisip("b. Ibu", s.pekerjaan_ibu)}
            </table>
            <div class="id-bawah">
              <div class="id-foto"></div>
              <div class="id-ttd">
                <div style="margin-bottom:4mm;">Tangerang Selatan, ${tglIndo(ctx.tanggal)}</div>
                <div>Kepala Kuttab Al Kalam</div>
                <div style="height:18mm;"></div>
                <div><b><u>${esc(ctx.kepalaLabel || "........................")}</u></b></div>
              </div>
            </div>
          </div>
        </section>`;
      }

      // ===== Data =====
      const [tas, sems] = await Promise.all([
        sb.from("tahun_ajaran").select("id, kode, aktif").order("kode"),
        sb.from("semester").select("id, nomor, aktif, tahun_ajaran_id").order("nomor")
      ]);
      if (tas.error) return gagal(tas.error);
      if (sems.error) return gagal(sems.error);

      const taList = tas.data || [];
      const semList = sems.data || [];
      let rombelList = [];
      let identitasIds = [];

      // ===== Kerangka halaman =====
      konten.innerHTML = `
        <div class="card card-outline card-warning no-print">
          <div class="card-header">
            <h3 class="card-title"><i class="fas fa-file-alt"></i> Filter Rapor</h3>
          </div>
          <div class="card-body">
            <div class="row">
              <div class="col-12 col-md-3">
                <div class="form-group"><label class="small mb-1">Tahun ajaran</label>
                  <select id="taSel" class="form-control"></select></div>
              </div>
              <div class="col-12 col-md-3">
                <div class="form-group"><label class="small mb-1">Semester</label>
                  <select id="semSel" class="form-control"></select></div>
              </div>
              <div class="col-12 col-md-3">
                <div class="form-group"><label class="small mb-1">Kelas</label>
                  <select id="rombelSel" class="form-control"></select></div>
              </div>
              <div class="col-12 col-md-3">
                <div class="form-group"><label class="small mb-1">Tanggal rapor</label>
                  <input type="date" id="tanggal" class="form-control"></div>
              </div>
            </div>
            <div class="custom-control custom-checkbox">
              <input class="custom-control-input" type="checkbox" id="lampiranChk" checked>
              <label class="custom-control-label" for="lampiranChk">Sertakan lampiran deskripsi (semester ganjil)</label>
            </div>
            ${admin ? `
            <div class="custom-control custom-checkbox mt-2">
              <input class="custom-control-input" type="checkbox" id="identitasChk" checked>
              <label class="custom-control-label" for="identitasChk">Sertakan halaman identitas santri (hanya yang belum pernah dicetak)</label>
            </div>
            <div class="custom-control custom-checkbox">
              <input class="custom-control-input" type="checkbox" id="identitasUlang">
              <label class="custom-control-label" for="identitasUlang">Cetak ulang identitas untuk semua santri</label>
            </div>` : ""}
          </div>
          <div class="card-footer">
            <button class="btn btn-kuning" id="tampil"><i class="fas fa-search"></i> Tampilkan</button>
            <button class="btn btn-hitam" id="cetakBtn"><i class="fas fa-print"></i> Cetak / Simpan PDF</button>
            <span id="pesan"></span>
          </div>
        </div>

        <div class="card card-outline card-info">
          <div class="card-header">
            <h3 class="card-title"><i class="fas fa-eye"></i> Pratinjau</h3>
          </div>
          <div class="card-body p-0">
            <div class="pratinjau" id="cetak">
              <p class="text-center text-muted p-4 mb-0">Pilih kelas dan semester, lalu klik Tampilkan.</p>
            </div>
          </div>
        </div>`;

      $("taSel").innerHTML = taList.map(t =>
        `<option value="${t.id}" ${t.aktif ? "selected" : ""}>${esc(t.kode)}${t.aktif ? " (aktif)" : ""}</option>`).join("");
      $("tanggal").value = new Date().toLocaleDateString("sv-SE");

      async function muatRombel() {
        const taId = Number($("taSel").value);
        const { data, error } = await sb.from("rombel")
          .select("id, nama, tingkat_kode, wali_kelas_id")
          .eq("tahun_ajaran_id", taId).order("nama");
        if (error) return gagal(error);

        rombelList = data || [];
        $("rombelSel").innerHTML = rombelList.map(r => `<option value="${r.id}">${esc(r.nama)}</option>`).join("");

        if (!rombelList.length) pesan("Belum ada kelas di tahun ajaran ini.", "info");
        else pesan("");
      }

      function isiSemester() {
        const taId = Number($("taSel").value);
        const ta = taList.find(t => t.id === taId);
        const list = semList.filter(s => s.tahun_ajaran_id === taId);
        $("semSel").innerHTML = list.map(s =>
          `<option value="${s.id}">Semester ${s.nomor === 1 ? "Ganjil" : "Genap"}</option>`).join("");
        const def = list.find(s => ta && ta.aktif && s.aktif) || list.find(s => s.nomor === 2) || list[0];
        if (def) $("semSel").value = String(def.id);
      }

      // Cetak: rapor dibuka di jendela baru yang hanya berisi halaman rapor
      function cetakRapor() {
        const area = $("cetak");
        if (!area.querySelector(".page")) return pesan("Tampilkan rapor terlebih dahulu.", "error");

        const css = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n");
        const w = window.open("", "_blank");
        if (!w) return pesan("Jendela cetak diblokir browser. Izinkan pop-up untuk situs ini.", "error");

        w.document.open();
        w.document.write(`<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rapor</title>
<base href="${location.href}">
<style>
${css}
@page { size: A4; margin: 0; }
html, body { margin: 0 !important; padding: 0 !important; background: #fff !important; width: 210mm !important; }
#cetak { display: block !important; width: 210mm !important; margin: 0 !important; padding: 0 !important; }
.page { width: 210mm !important; margin: 0 !important; box-shadow: none !important; border: 0 !important; page-break-after: always; }
.page:last-child { page-break-after: auto; }
.page.lampiran, .page.mawas, .page.identitas { border-top: 0 !important; }
</style>
</head>
<body>
<div id="cetak">${area.innerHTML}</div>
</body>
</html>`);
        w.document.close();
        w.addEventListener("load", () => setTimeout(() => w.print(), 300));
      }

      // Admin menandai identitas sebagai sudah dicetak sebelum cetak dijalankan
      async function cetakKlik() {
        if (!$("cetak").querySelector(".page")) return pesan("Tampilkan rapor terlebih dahulu.", "error");

        if (identitasIds.length) {
          const r = await Swal.fire({
            icon: "question",
            title: "Tandai identitas sebagai sudah dicetak?",
            text: "Halaman identitas " + identitasIds.length + " santri akan ditandai sudah dicetak. " +
              "Status ini tidak berubah jika cetakan dibatalkan.",
            showCancelButton: true,
            confirmButtonText: "Lanjutkan cetak",
            cancelButtonText: "Batal",
            confirmButtonColor: "#1a1a1a"
          });
          if (!r.isConfirmed) return;

          const { error } = await sb.rpc("tandai_identitas_cetak", { p_ids: identitasIds });
          if (error) return gagal(error);
        }
        cetakRapor();
      }

      $("taSel").onchange = async () => { isiSemester(); await muatRombel(); };
      $("tampil").onclick = tampilkan;
      $("cetakBtn").onclick = cetakKlik;

      // Perubahan pilihan identitas langsung memperbarui pratinjau
      if (admin) {
        const ulangPratinjau = () => { if ($("cetak").querySelector(".page")) tampilkan(); };
        $("identitasChk").onchange = ulangPratinjau;
        $("identitasUlang").onchange = ulangPratinjau;
      }

      isiSemester();
      await muatRombel();

      // ===== Tampilkan pratinjau =====
      async function tampilkan() {
        const rombel = rombelList.find(r => r.id === Number($("rombelSel").value));
        const sem = semList.find(s => s.id === Number($("semSel").value));
        const ta = taList.find(t => t.id === Number($("taSel").value));
        if (!rombel || !sem) return pesan("Pilih kelas dan semester.", "error");

        pesan("Memuat...");
        $("cetak").innerHTML = "";

        const { data: kr, error } = await sb.from("keanggotaan_rombel")
          .select("santri:santri_id(id, nis, nama_lengkap)")
          .eq("rombel_id", rombel.id).eq("tahun_ajaran_id", ta.id);
        if (error) return gagal(error);

        const santri = (kr || []).map(x => x.santri).filter(Boolean)
          .sort((a, b) => a.nama_lengkap.localeCompare(b.nama_lengkap));
        if (!santri.length) return pesan("Belum ada santri di kelas ini.", "error");
        const ids = santri.map(s => s.id);

        const [mapelRes, naRes, absRes] = await Promise.all([
          sb.from("mata_pelajaran").select("id, kode"),
          sb.from("nilai_akhir").select("santri_id, mapel_id, nilai_rapor").eq("semester_id", sem.id).in("santri_id", ids),
          sb.from("absensi_rapor").select("santri_id, sakit, izin, tanpa_uzur").eq("semester_id", sem.id).in("santri_id", ids)
        ]);
        for (const r of [mapelRes, naRes, absRes]) if (r.error) return gagal(r.error);

        const kodeMapel = {};
        (mapelRes.data || []).forEach(m => kodeMapel[m.id] = m.kode);

        const nilaiMap = {};
        (naRes.data || []).forEach(r => {
          (nilaiMap[r.santri_id] ||= {})[kodeMapel[r.mapel_id]] = r.nilai_rapor;
        });

        const absenMap = {};
        (absRes.data || []).forEach(a => absenMap[a.santri_id] = a);

        // Lampiran deskripsi (semester ganjil)
        const adaLampiran = sem.nomor === 1 && $("lampiranChk").checked;
        let aspekByKode = {}, deskMap = {};
        if (adaLampiran) {
          const [asp, desk] = await Promise.all([
            sb.from("aspek_deskripsi").select("id, mapel_id, nama, urutan").eq("aktif", true).order("urutan"),
            sb.from("deskripsi_rapor").select("santri_id, aspek_id, isi").eq("semester_id", sem.id).in("santri_id", ids)
          ]);
          if (asp.error) return gagal(asp.error);
          if (desk.error) return gagal(desk.error);
          (asp.data || []).forEach(a => (aspekByKode[kodeMapel[a.mapel_id]] ||= []).push(a));
          (desk.data || []).forEach(d => (deskMap[d.santri_id] ||= {})[d.aspek_id] = d.isi);
        }

        // Kehadiran MAWAS (per semester)
        const sesiRes = await sb.from("mawas_sesi").select("id, tanggal, tema, pemateri")
          .eq("semester_id", sem.id).order("tanggal");
        if (sesiRes.error) return gagal(sesiRes.error);
        const sesiList = sesiRes.data || [];

        const hadirMap = {};
        if (sesiList.length) {
          const hr = await sb.from("mawas_hadir").select("sesi_id, santri_id, ayah, bunda")
            .in("sesi_id", sesiList.map(x => x.id)).in("santri_id", ids);
          if (hr.error) return gagal(hr.error);
          (hr.data || []).forEach(h => ((hadirMap[h.santri_id] ||= {})[h.sesi_id] = h));
        }

        // Data identitas (hanya untuk admin)
        let detailSantri = {};
        if (admin) {
          const { data: dd, error: eD } = await sb.from("santri").select(SANTRI_IDENT).in("id", ids);
          if (eD) return gagal(eD);
          (dd || []).forEach(x => detailSantri[x.id] = x);
        }

        // Wali kelas dengan gelar (untuk rapor dan lampiran)
        let waliLabel = "";
        if (rombel.wali_kelas_id) {
          const { data: w } = await sb.from("pegawai")
            .select("nama_lengkap, gelar_belakang").eq("id", rombel.wali_kelas_id).maybeSingle();
          if (w) waliLabel = w.nama_lengkap + (w.gelar_belakang ? ", " + w.gelar_belakang : "");
        }

        // Kepala kuttab dengan gelar (untuk tanda tangan MAWAS dan identitas)
        const { data: kep } = await sb.from("pegawai")
          .select("nama_lengkap, gelar_belakang").eq("peran", "kepala").eq("status_aktif", true)
          .order("id").limit(1).maybeSingle();
        const kepalaLabel = kep ? kep.nama_lengkap + (kep.gelar_belakang ? ", " + kep.gelar_belakang : "") : "";

        const ctx = {
          ta, sem, rombel, waliLabel, kepalaLabel, adaLampiran,
          tanggal: $("tanggal").value || new Date().toLocaleDateString("sv-SE")
        };

        // Identitas: hanya jika admin memilih, dan santri belum pernah dicetak (kecuali cetak ulang)
        const chk = $("identitasChk");
        const ikut = !!(chk && chk.checked);
        const ulang = !!($("identitasUlang") && $("identitasUlang").checked);
        identitasIds = [];

        let html = "";
        santri.forEach(s => {
          const d = { ...s, ...(detailSantri[s.id] || {}) };
          const perluIdentitas = ikut && (ulang || !d.identitas_cetak_at);
          if (perluIdentitas) identitasIds.push(s.id);

          html += (perluIdentitas ? htmlIdentitasSantri(d, ctx) : "") +
            htmlRapor(s, ctx, nilaiMap, absenMap) +
            (adaLampiran ? htmlLampiran(s, ctx, deskMap, aspekByKode) : "") +
            htmlMawas(s, ctx, sesiList, hadirMap);
        });
        $("cetak").innerHTML = html;

        const skip = ikut ? santri.length - identitasIds.length : 0;
        pesan("Siap dicetak: " + santri.length + " santri." +
          (ikut ? " Identitas: " + identitasIds.length + " akan dicetak, " + skip + " sudah pernah dicetak." : ""), "ok");
      }
    }
  });
</script>
</body>
</html>

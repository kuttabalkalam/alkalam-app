<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapor - Kuttab Al-Kalam</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; font-size: 11px; color: #111; margin: 0; }

  .controls { max-width: 900px; margin: 16px auto; padding: 12px; }
  .controls a { display: inline-block; margin-bottom: 8px; }
  .controls label { display: inline-block; margin: 4px 12px 4px 0; }
  .controls select, .controls input[type=date] { padding: 4px; }
  .controls button { padding: 6px 12px; margin: 4px 6px 4px 0; }
  #pesan { font-weight: bold; min-height: 18px; }

  /* Satu halaman A4. Kop menempel di tepi atas, isi diberi padding samping */
  .page { width: 210mm; margin: 0 auto 10mm; background: #fff; box-sizing: border-box; padding-bottom: 8mm; }
  .page.lampiran { border-top: 1px dashed #ccc; }
  .kop { display: block; width: 100%; margin: 0; }
  .isi { padding: 0 12mm; }

  h3.judul { text-align: center; font-size: 13px; font-weight: bold; margin: 8mm 0 5mm; line-height: 1.5; }

  table { border-collapse: collapse; }

  table.identitas { width: 100%; table-layout: fixed; margin-bottom: 4mm; font-size: 11px; }
  table.identitas td { padding: 2px 3px; vertical-align: top; }
  table.identitas td.l1 { width: 22%; }
  table.identitas td.v1 { width: 36%; }
  table.identitas td.l2 { width: 14%; }
  table.identitas td.v2 { width: 28%; }

  table.tabel { width: 100%; table-layout: fixed; font-size: 11px; }
  table.tabel th, table.tabel td { border: 1px solid #000; padding: 6px 6px; vertical-align: middle; word-wrap: break-word; }
  table.tabel th { background: #fff; text-align: center; font-weight: bold; }
  table.tabel td.kel { font-weight: bold; text-align: center; }
  table.tabel td.mapel { text-align: left; }
  table.tabel td.c { text-align: center; }
  table.tabel td.isi { text-align: justify; line-height: 1.45; white-space: pre-line; }

  /* Border per mata pelajaran: judul dan sub-baris dibungkus satu kotak, sub tanpa garis pemisah */
  table.tabel td.m-atas { border-bottom: none; }
  table.tabel td.m-sub { border-top: none; border-bottom: none; padding-left: 18px; }
  table.tabel td.m-sub.akhir { border-bottom: 1px solid #000; }

  .absen { margin-top: 6mm; }
  .absen p { text-align: center; margin: 0 0 2mm; font-weight: bold; }
  table.kecil { margin: 0 auto; width: auto; }
  table.kecil th, table.kecil td { border: 1px solid #000; padding: 3px 14px; font-size: 11px; }

  /* Tanda tangan: tanggal sejajar dengan Guru Kelas */
  .ttd { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 10mm; }
  .ttd .kiri { width: 45%; text-align: center; }
  .ttd .kanan { width: 45%; text-align: center; }

  @media print {
    @page { size: A4; margin: 0; }
    body { margin: 0; }
    .no-print { display: none !important; }
    .page { width: 210mm; margin: 0; padding-bottom: 8mm; border: none; page-break-after: always; }
    .page:last-child { page-break-after: auto; }
    .page.lampiran { border-top: none; }
  }
</style>
</head>
<body>

<div class="controls no-print">
  <a href="dashboard.html">← Dashboard</a>
  <h2>Rapor</h2>
  <label>Tahun ajaran <select id="taSel"></select></label>
  <label>Semester <select id="semSel"></select></label>
  <label>Kelas <select id="rombelSel"></select></label>
  <label>Tanggal rapor <input type="date" id="tanggal"></label>
  <label><input type="checkbox" id="lampiranChk" checked> Sertakan lampiran deskripsi (semester ganjil)</label>
  <br>
  <button id="tampil">Tampilkan</button>
  <button id="cetakBtn">Cetak / Simpan PDF</button>
  <p id="pesan"></p>
</div>

<div id="cetak"></div>

<script>
  const SUPABASE_URL = "https://epynlmuqxumuwcjsrnsz.supabase.co";
  const SUPABASE_ANON_KEY = "ISI_ANON_KEY";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const pesan = t => $("pesan").textContent = t;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const SATUAN = ["Nol","Satu","Dua","Tiga","Empat","Lima","Enam","Tujuh","Delapan","Sembilan","Sepuluh","Sebelas"];
  function bilangan(n) {
    if (n < 12) return SATUAN[n];
    if (n < 20) return SATUAN[n - 10] + " Belas";
    if (n < 100) { const p = Math.floor(n / 10), s = n % 10; return SATUAN[p] + " Puluh" + (s ? " " + SATUAN[s] : ""); }
    return "Seratus";
  }
  function nilaiTeks(v) {
    if (v == null || v === "") return { a: "-", t: "-" };
    const [b, d] = Number(v).toFixed(2).split(".");
    return { a: b + "," + d, t: bilangan(Number(b)) + " Koma " + d.split("").map(x => SATUAN[Number(x)]).join(" ") };
  }

  const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  const tglIndo = iso => { const [y, m, d] = iso.split("-"); return Number(d) + " " + BULAN[Number(m) - 1] + " " + y; };

  // Struktur: kelompok > mapel > sub-komponen (anak). Mapel tanpa anak adalah baris tunggal.
  const STRUKTUR = [
    { kelompok: "I. Muatan Khusus", mapel: [
      { label: "A. Karakter Iman", anak: [
        { kode: "iman", label: "1) Pemahaman" }
      ]},
      { label: "B. Al-Qur'an", anak: [
        { kode: "tahfidz", label: "1) Tahfidz" },
        { kode: "tilawah", label: "2) Tilawah" },
        { kode: "kitabah", label: "3) Kitabah" }
      ]},
      { label: "C. Ibadah", kode: "ibadah" }
    ]},
    { kelompok: "II. Murofaqot", mapel: [
      { label: "A. Matematika / Berhitung", kode: "mtk" },
      { label: "B. Bahasa Indonesia", kode: "bindo" },
      { label: "C. Ilmu Pengetahuan Alam", kode: "ipa" },
      { label: "D. Ilmu Pengetahuan Sosial", kode: "ips" }
    ]},
    { kelompok: "III. Muatan Penunjang", mapel: [
      { label: "A. Keterampilan Fisik / Olahraga", kode: "olahraga" },
      { label: "B. Keterampilan Hidup / Life Skill", kode: "lifeskill" },
      { label: "C. Bahasa Peradaban / Bahasa Arab", kode: "arab" }
    ]}
  ];

  let me = null, taList = [], semList = [], rombelList = [];
  let nilaiMap = {}, absenMap = {}, deskMap = {}, aspekByKode = {}, kodeMapel = {};

  function htmlIdentitas(s, ctx) {
    return `<table class="identitas">
      <tr>
        <td class="l1">Nama Santri</td><td class="v1">: ${esc(s.nama_lengkap)}</td>
        <td class="l2">Kelas</td><td class="v2">: ${esc(ctx.rombel.nama)}</td>
      </tr>
      <tr>
        <td class="l1">Nomor Induk Santri</td><td class="v1">: ${esc(s.nis || "-")}</td>
        <td class="l2"></td><td class="v2"></td>
      </tr>
    </table>`;
  }

  function htmlTtd(ctx) {
    return `<div class="ttd">
      <div class="kiri">Orang Tua / Wali<br><br><br><br>( ........................................ )</div>
      <div class="kanan">Tangerang Selatan, ${tglIndo(ctx.tanggal)}<br>Guru Kelas Kuttab Al Kalam<br><br><br><br><b><u>${esc(ctx.waliNama || "........................")}</u></b></div>
    </div>`;
  }

  function htmlRapor(s, ctx) {
    const n = nilaiMap[s.id] || {};
    const ab = absenMap[s.id];
    const semLabel = ctx.sem.nomor === 1 ? "GANJIL" : "GENAP";
    const nilaiList = [];
    const ambil = kode => { const v = n[kode]; if (v != null) nilaiList.push(Number(v)); return v; };
    const rows = [];

    STRUKTUR.forEach(g => {
      const grup = [];
      g.mapel.forEach(m => {
        if (m.anak) {
          grup.push(`<tr><td class="mapel m-atas">${esc(m.label)}</td><td></td><td></td></tr>`);
          m.anak.forEach((a, i) => {
            const f = nilaiTeks(ambil(a.kode));
            const akhir = i === m.anak.length - 1 ? " akhir" : "";
            grup.push(`<tr><td class="mapel m-sub${akhir}">${esc(a.label)}</td><td class="c">${f.a}</td><td class="c">${f.t}</td></tr>`);
          });
        } else {
          const f = nilaiTeks(ambil(m.kode));
          grup.push(`<tr><td class="mapel">${esc(m.label)}</td><td class="c">${f.a}</td><td class="c">${f.t}</td></tr>`);
        }
      });
      if (grup.length) {
        grup[0] = grup[0].replace("<tr>", `<tr><td rowspan="${grup.length}" class="kel">${esc(g.kelompok)}</td>`);
        rows.push(...grup);
      }
    });

    const rata = nilaiList.length ? nilaiList.reduce((a, b) => a + b, 0) / nilaiList.length : null;
    const fr = nilaiTeks(rata);
    const absen = k => ab ? ab[k] : "-";

    return `<section class="page rapor">
      <img class="kop" src="kop.png" alt="Kop Kuttab Al-Kalam">
      <div class="isi">
        <h3 class="judul">RAPOR SEMESTER ${semLabel}<br>TAHUN AJARAN ${esc(ctx.ta.kode)}</h3>
        ${htmlIdentitas(s, ctx)}
        <table class="tabel">
          <colgroup><col style="width:22%"><col style="width:40%"><col style="width:15%"><col style="width:23%"></colgroup>
          <tr><th colspan="2" rowspan="2">MATA PELAJARAN</th><th colspan="2">PENILAIAN</th></tr>
          <tr><th>ANGKA</th><th>HURUF</th></tr>
          ${rows.join("")}
          <tr><td colspan="2" class="c"><b>Nilai rata-rata</b></td><td class="c"><b>${fr.a}</b></td><td class="c"><b>${fr.t}</b></td></tr>
        </table>
        <div class="absen">
          <p>Ketidakhadiran/Absensi</p>
          <table class="tabel kecil">
            <tr><th>No</th><th>Alasan</th><th>Hari</th></tr>
            <tr><td class="c">1</td><td>Sakit</td><td class="c">${absen("sakit")}</td></tr>
            <tr><td class="c">2</td><td>Izin</td><td class="c">${absen("izin")}</td></tr>
            <tr><td class="c">3</td><td>Tanpa Uzur Syar'i</td><td class="c">${absen("tanpa_uzur")}</td></tr>
          </table>
        </div>
        ${htmlTtd(ctx)}
      </div>
    </section>`;
  }

  function htmlLampiran(s, ctx) {
    const d = deskMap[s.id] || {};
    let body = "";
    let adaIsi = false;

    STRUKTUR.forEach(g => {
      const rows = [];
      g.mapel.forEach(m => {
        if (m.anak) {
          const subs = [];
          m.anak.forEach(a => (aspekByKode[a.kode] || []).forEach(asp => {
            const isi = (d[asp.id] || "").trim();
            if (isi) subs.push({ nama: asp.nama, isi });
          }));
          if (!subs.length) return;
          rows.push(`<tr><td class="mapel m-atas">${esc(m.label)}:</td><td></td></tr>`);
          subs.forEach((x, i) => {
            const akhir = i === subs.length - 1 ? " akhir" : "";
            rows.push(`<tr><td class="mapel m-sub${akhir}">${i + 1}. ${esc(x.nama)}</td><td class="isi">${esc(x.isi)}</td></tr>`);
          });
        } else {
          (aspekByKode[m.kode] || []).forEach(asp => {
            const isi = (d[asp.id] || "").trim();
            if (isi) rows.push(`<tr><td class="mapel">${esc(m.label)}</td><td class="isi">${esc(isi)}</td></tr>`);
          });
        }
      });
      if (rows.length) {
        adaIsi = true;
        rows[0] = rows[0].replace("<tr>", `<tr><td rowspan="${rows.length}" class="kel">${esc(g.kelompok)}</td>`);
        body += rows.join("");
      }
    });

    if (!adaIsi) body = `<tr><td colspan="3" class="c">Belum ada deskripsi untuk santri ini.</td></tr>`;

    return `<section class="page lampiran">
      <img class="kop" src="kop.png" alt="Kop Kuttab Al-Kalam">
      <div class="isi">
        <h3 class="judul">LAMPIRAN DESKRIPSI CAPAIAN<br>SEMESTER GANJIL TAHUN AJARAN ${esc(ctx.ta.kode)}</h3>
        ${htmlIdentitas(s, ctx)}
        <table class="tabel">
          <colgroup><col style="width:20%"><col style="width:30%"><col style="width:50%"></colgroup>
          <tr><th colspan="2">MATA PELAJARAN</th><th>DESKRIPSI</th></tr>
          ${body}
        </table>
      </div>
    </section>`;
  }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { location.href = "login.html"; return; }

    const { data: p, error: eP } = await sb.from("pegawai")
      .select("id, nama_lengkap, peran").eq("auth_user_id", session.user.id).maybeSingle();
    if (eP) { pesan("Gagal memuat akun: " + eP.message); return; }
    if (!p) { pesan("Akun " + session.user.email + " belum terhubung ke data pegawai."); return; }
    if (!["admin", "kepala", "guru"].includes(p.peran)) {
      pesan("Peran '" + p.peran + "' tidak punya akses ke rapor."); return;
    }
    me = p;

    const [{ data: tas }, { data: sems }] = await Promise.all([
      sb.from("tahun_ajaran").select("id, kode, aktif").order("kode"),
      sb.from("semester").select("id, nomor, aktif, tahun_ajaran_id").order("nomor")
    ]);
    taList = tas || [];
    semList = sems || [];

    $("taSel").innerHTML = taList.map(t =>
      `<option value="${t.id}" ${t.aktif ? "selected" : ""}>${esc(t.kode)}${t.aktif ? " (aktif)" : ""}</option>`).join("");
    $("tanggal").value = new Date().toLocaleDateString("sv-SE");

    $("taSel").onchange = async () => { isiSemester(); await isiRombel(); };
    $("tampil").onclick = tampilkan;
    $("cetakBtn").onclick = () => window.print();

    isiSemester();
    await isiRombel();
  }

  function isiSemester() {
    const taId = Number($("taSel").value);
    const ta = taList.find(t => t.id === taId);
    const list = semList.filter(s => s.tahun_ajaran_id === taId);
    $("semSel").innerHTML = list.map(s =>
      `<option value="${s.id}">Semester ${s.nomor === 1 ? "Ganjil" : "Genap"}</option>`).join("");
    const def = list.find(s => ta && ta.aktif && s.aktif) || list.find(s => s.nomor === 2) || list[0];
    if (def) $("semSel").value = String(def.id);
  }

  async function isiRombel() {
    const taId = Number($("taSel").value);
    const { data, error } = await sb.from("rombel")
      .select("id, nama, tingkat_kode, wali_kelas_id")
      .eq("tahun_ajaran_id", taId).order("nama");
    if (error) { pesan("Gagal memuat kelas: " + error.message); return; }

    rombelList = (data || []).filter(r => me.peran !== "guru" || r.wali_kelas_id === me.id);
    $("rombelSel").innerHTML = rombelList.map(r => `<option value="${r.id}">${esc(r.nama)}</option>`).join("");

    if (!rombelList.length) {
      pesan(me.peran === "guru"
        ? "Anda belum menjadi wali kelas di tahun ajaran ini."
        : "Belum ada kelas di tahun ajaran ini.");
    } else {
      pesan("");
    }
  }

  async function tampilkan() {
    const rombel = rombelList.find(r => r.id === Number($("rombelSel").value));
    const sem = semList.find(s => s.id === Number($("semSel").value));
    const ta = taList.find(t => t.id === Number($("taSel").value));
    if (!rombel || !sem) { pesan("Pilih kelas dan semester."); return; }

    pesan("Memuat...");
    $("cetak").innerHTML = "";

    const { data: kr, error } = await sb.from("keanggotaan_rombel")
      .select("santri:santri_id(id, nis, nama_lengkap)")
      .eq("rombel_id", rombel.id).eq("tahun_ajaran_id", ta.id);
    if (error) { pesan("Gagal memuat santri: " + error.message); return; }

    const santri = (kr || []).map(x => x.santri).filter(Boolean)
      .sort((a, b) => a.nama_lengkap.localeCompare(b.nama_lengkap));
    if (!santri.length) { pesan("Belum ada santri di kelas ini."); return; }
    const ids = santri.map(s => s.id);

    const [mapelRes, naRes, absRes] = await Promise.all([
      sb.from("mata_pelajaran").select("id, kode"),
      sb.from("nilai_akhir").select("santri_id, mapel_id, nilai_rapor").eq("semester_id", sem.id).in("santri_id", ids),
      sb.from("absensi_rapor").select("santri_id, sakit, izin, tanpa_uzur").eq("semester_id", sem.id).in("santri_id", ids)
    ]);

    kodeMapel = {};
    (mapelRes.data || []).forEach(m => kodeMapel[m.id] = m.kode);

    nilaiMap = {};
    (naRes.data || []).forEach(r => {
      (nilaiMap[r.santri_id] ||= {})[kodeMapel[r.mapel_id]] = r.nilai_rapor;
    });

    absenMap = {};
    (absRes.data || []).forEach(a => absenMap[a.santri_id] = a);

    const adaLampiran = sem.nomor === 1 && $("lampiranChk").checked;
    if (adaLampiran) {
      const [asp, desk] = await Promise.all([
        sb.from("aspek_deskripsi").select("id, mapel_id, nama, urutan").eq("aktif", true).order("urutan"),
        sb.from("deskripsi_rapor").select("santri_id, aspek_id, isi").eq("semester_id", sem.id).in("santri_id", ids)
      ]);
      aspekByKode = {};
      (asp.data || []).forEach(a => (aspekByKode[kodeMapel[a.mapel_id]] ||= []).push(a));
      deskMap = {};
      (desk.data || []).forEach(d => (deskMap[d.santri_id] ||= {})[d.aspek_id] = d.isi);
    }

    let waliNama = "";
    if (rombel.wali_kelas_id) {
      const { data: w } = await sb.from("pegawai").select("nama_lengkap").eq("id", rombel.wali_kelas_id).maybeSingle();
      waliNama = w ? w.nama_lengkap : "";
    }

    const ctx = {
      ta, sem, rombel, waliNama, adaLampiran,
      tanggal: $("tanggal").value || new Date().toLocaleDateString("sv-SE")
    };

    $("cetak").innerHTML = santri.map(s =>
      htmlRapor(s, ctx) + (adaLampiran ? htmlLampiran(s, ctx) : "")).join("");
    pesan("Siap dicetak: " + santri.length + " santri.");
  }

  init();
</script>
</body>
</html>

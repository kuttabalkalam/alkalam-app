<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Nilai - Kuttab Al-Kalam</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
<link rel="stylesheet" href="ui.css">
<style>
  .tabel-wrap { overflow-x: auto; }
  .tabel-wrap input[type=number] { width: 80px; }
  .tabel-wrap td, .tabel-wrap th { white-space: nowrap; vertical-align: middle; }
  .tabel-wrap td.nama { white-space: normal; min-width: 170px; }
  .tabel-wrap textarea.isi { min-width: 240px; min-height: 72px; font-size: 14px; }
</style>
</head>
<body class="hold-transition sidebar-mini">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="ui.js"></script>

<script>
  KUTTAB.halaman({
    aktif: "input-nilai",
    judul: "Input Nilai",
    roles: ["admin", "guru"],
    render: async ({ sb, me, sem, konten, toast, gagal, peringatan, esc }) => {
      if (!sem) {
        konten.innerHTML = '<div class="alert alert-warning">Belum ada semester aktif.</div>';
        return;
      }
      const ganjil = sem.nomor === 1;

      const { data: pm, error } = await sb.from("penugasan_mapel")
        .select("rombel_id, pegawai_id, rombel:rombel_id(id, nama, tahun_ajaran_id), mapel:mapel_id(id, kode, nama, urutan)");
      if (error) { gagal(error); return; }

      const penugasan = (pm || []).filter(x =>
        x.rombel && x.mapel &&
        x.rombel.tahun_ajaran_id === sem.tahun_ajaran_id &&
        (me.peran === "admin" || x.pegawai_id === me.id));

      const rombelMap = new Map();
      penugasan.forEach(x => rombelMap.set(x.rombel_id, x.rombel.nama));
      const rombelOpts = [...rombelMap.entries()].sort((a, b) => a[1].localeCompare(b[1]));

      if (!rombelOpts.length) {
        konten.innerHTML = '<div class="alert alert-info">Anda belum punya penugasan mapel di tahun ajaran ini.</div>';
        return;
      }

      konten.innerHTML = `
        <div class="card">
          <div class="card-body">
            <div class="form-row align-items-end">
              <div class="col-12 col-md-3 mb-2">
                <label class="small mb-1">Mode</label>
                <select id="mode" class="form-control">
                  <option value="nilai">Nilai</option>
                  <option value="deskripsi" ${ganjil ? "" : "disabled"}>Deskripsi Rapor${ganjil ? "" : " (hanya semester ganjil)"}</option>
                </select>
              </div>
              <div class="col-12 col-md-3 mb-2">
                <label class="small mb-1">Kelas</label>
                <select id="rombel" class="form-control"></select>
              </div>
              <div class="col-12 col-md-3 mb-2">
                <label class="small mb-1">Mapel</label>
                <select id="mapel" class="form-control"></select>
              </div>
              <div class="col-6 col-md-2 mb-2" id="wrapJumlah">
                <label class="small mb-1">Jumlah ujian/tema</label>
                <input id="jumlah" type="number" min="1" max="10" value="4" class="form-control">
              </div>
              <div class="col-6 col-md-1 mb-2">
                <button class="btn btn-kuning btn-block" id="tampil" title="Tampilkan"><i class="fas fa-search"></i></button>
              </div>
            </div>
            <p class="text-muted small mb-0" id="info"></p>
            <button class="btn btn-outline-dark btn-sm mt-2" id="btnRekap" type="button">
              <i class="fas fa-table"></i> Lihat Rekap Nilai
            </button>
          </div>
        </div>
        <div class="tabel-wrap" id="tabel"></div>
        <button class="btn btn-kuning mt-2" id="simpan" style="display:none"><i class="fas fa-save"></i> Simpan</button>`;

      const $ = id => document.getElementById(id);
      const rombelSel = $("rombel"), mapelSel = $("mapel"), modeSel = $("mode"), jumlahIn = $("jumlah");

      let santri = [], kolom = [], nilaiLama = {}, akhir = {}, aspek = [], deskLama = {};
      let mapelId = null;

      rombelSel.innerHTML = rombelOpts.map(([id, nama]) => `<option value="${id}">${esc(nama)}</option>`).join("");

      const info = t => {
        $("tabel").innerHTML = "";
        $("simpan").style.display = "none";
        $("info").textContent = t || "";
      };

      function isiMapel() {
        const r = Number(rombelSel.value);
        const list = penugasan.filter(x => x.rombel_id === r).map(x => x.mapel)
          .sort((a, b) => a.urutan - b.urutan);
        mapelSel.innerHTML = list.map(m => `<option value="${m.id}">${esc(m.nama)}</option>`).join("");
      }

      function gantiMode() {
        $("wrapJumlah").style.display = modeSel.value === "nilai" ? "" : "none";
        info("");
      }

      rombelSel.onchange = () => { isiMapel(); info(""); };
      mapelSel.onchange = () => info("");
      modeSel.onchange = gantiMode;
      jumlahIn.onchange = () => { if (modeSel.value === "nilai" && santri.length) tampil(); };
      $("tampil").onclick = tampil;
      $("simpan").onclick = simpan;
      $("btnRekap").onclick = bukaRekap;

      isiMapel();
      gantiMode();

      // ===== REKAP DI DALAM DIALOG =====
      const MODAL_HTML = `
        <div class="modal fade" id="modalRekap" tabindex="-1" role="dialog">
          <div class="modal-dialog modal-xl" role="document" style="max-width:96vw;">
            <div class="modal-content">
              <div class="modal-header" style="background:#1a1a1a;color:#f2c94c;">
                <h5 class="modal-title"><i class="fas fa-table"></i> Rekap Nilai</h5>
                <button type="button" class="close" data-dismiss="modal" style="color:#f2c94c;opacity:1;">&times;</button>
              </div>
              <div class="modal-body p-0">
                <iframe id="iframeRekap" style="width:100%;height:75vh;border:0;"></iframe>
              </div>
            </div>
          </div>
        </div>`;

      function bukaRekap() {
        const rid = Number(rombelSel.value), mid = Number(mapelSel.value);
        if (!rid || !mid) return peringatan("Pilih kelas dan mapel terlebih dahulu.");
        if (!document.getElementById("modalRekap")) {
          document.body.insertAdjacentHTML("beforeend", MODAL_HTML);
        }
        document.getElementById("iframeRekap").src =
          `rekap-nilai.html?embed=1&rombel=${rid}&mapel=${mid}`;
        jQuery("#modalRekap").modal("show");
      }

      async function tampil() {
        const rid = Number(rombelSel.value);
        mapelId = Number(mapelSel.value);
        if (!rid || !mapelId) return peringatan("Pilih kelas dan mapel terlebih dahulu.");

        const { data: kr, error: e1 } = await sb.from("keanggotaan_rombel")
          .select("santri:santri_id(id, nis, nama_lengkap)")
          .eq("rombel_id", rid).eq("tahun_ajaran_id", sem.tahun_ajaran_id);
        if (e1) return gagal(e1);

        santri = (kr || []).map(x => x.santri).filter(Boolean)
          .sort((a, b) => a.nama_lengkap.localeCompare(b.nama_lengkap));
        if (!santri.length) return info("Belum ada santri di kelas ini.");

        if (modeSel.value === "deskripsi") return tampilDeskripsi();
        return tampilNilai();
      }

      // ===== MODE NILAI =====
      async function tampilNilai() {
        const ids = santri.map(s => s.id);

        const { data: bn, error: e1 } = await sb.from("bobot_nilai")
          .select("komponen_id, komponen:komponen_id(kode, nama, urutan)")
          .eq("mapel_id", mapelId);
        if (e1) return gagal(e1);

        const komponen = (bn || [])
          .filter(b => b.komponen && !["kehadiran", "uas"].includes(b.komponen.kode))
          .map(b => ({ id: b.komponen_id, ...b.komponen }))
          .sort((a, b) => a.urutan - b.urutan);

        const jumlah = Math.min(10, Math.max(1, Number(jumlahIn.value) || 1));
        kolom = [];
        komponen.forEach(k => {
          if (k.kode === "ujian_periodik") {
            for (let i = 1; i <= jumlah; i++) {
              kolom.push({ komponenId: k.id, item: String(i), label: "Ujian " + i });
            }
          } else {
            kolom.push({ komponenId: k.id, item: "", label: k.nama });
          }
        });

        const [nl, na] = await Promise.all([
          sb.from("nilai").select("santri_id, komponen_id, item, nilai")
            .eq("semester_id", sem.id).eq("mapel_id", mapelId).in("santri_id", ids),
          sb.from("nilai_akhir").select("santri_id, nilai_akhir, nilai_rapor")
            .eq("semester_id", sem.id).eq("mapel_id", mapelId).in("santri_id", ids)
        ]);
        if (nl.error) return gagal(nl.error);
        if (na.error) return gagal(na.error);

        nilaiLama = {};
        (nl.data || []).forEach(n => nilaiLama[n.santri_id + "|" + n.komponen_id + "|" + n.item] = n.nilai);
        akhir = {};
        (na.data || []).forEach(a => akhir[a.santri_id] = a);

        renderNilai();
      }

      function renderNilai() {
        const head = ["No", "NIS", "Nama", ...kolom.map(k => k.label), "Nilai Akhir (skala 90)", "Nilai Rapor"];
        $("tabel").innerHTML = `
          <table class="table table-sm table-bordered bg-white">
            <thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
            <tbody>
              ${santri.map((s, i) => {
                const a = akhir[s.id];
                return `<tr>
                  <td>${i + 1}</td>
                  <td>${esc(s.nis || "-")}</td>
                  <td class="nama">${esc(s.nama_lengkap)}</td>
                  ${kolom.map(k => {
                    const v = nilaiLama[s.id + "|" + k.komponenId + "|" + k.item];
                    return `<td><input type="number" min="0" max="100" step="0.01" class="form-control form-control-sm"
                      data-santri="${s.id}" data-komponen="${k.komponenId}" data-item="${esc(k.item)}"
                      value="${v != null ? v : ""}"></td>`;
                  }).join("")}
                  <td class="text-center">${a ? a.nilai_akhir : "-"}</td>
                  <td class="text-center">${a ? a.nilai_rapor : "-"}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>`;
        $("simpan").style.display = "inline-block";
        $("info").textContent = santri.length + " santri. Isi nilai dalam skala 0 sampai 100, lalu simpan.";
      }

      // ===== MODE DESKRIPSI =====
      async function tampilDeskripsi() {
        const { data: asp, error: e1 } = await sb.from("aspek_deskripsi")
          .select("id, nama, urutan").eq("mapel_id", mapelId).eq("aktif", true).order("urutan");
        if (e1) return gagal(e1);

        aspek = asp || [];
        if (!aspek.length) return info("Mapel ini tidak memakai deskripsi rapor.");

        const ids = santri.map(s => s.id);
        const { data: ds, error: e2 } = await sb.from("deskripsi_rapor")
          .select("santri_id, aspek_id, isi")
          .eq("semester_id", sem.id)
          .in("santri_id", ids)
          .in("aspek_id", aspek.map(a => a.id));
        if (e2) return gagal(e2);

        deskLama = {};
        (ds || []).forEach(d => deskLama[d.santri_id + "|" + d.aspek_id] = d.isi);
        renderDeskripsi();
      }

      function renderDeskripsi() {
        $("tabel").innerHTML = `
          <table class="table table-sm table-bordered bg-white">
            <thead><tr><th>No</th><th>Nama</th>${aspek.map(a => `<th>${esc(a.nama)}</th>`).join("")}</tr></thead>
            <tbody>
              ${santri.map((s, i) => `<tr>
                <td>${i + 1}</td>
                <td class="nama">${esc(s.nama_lengkap)}</td>
                ${aspek.map(a => `<td><textarea class="form-control form-control-sm isi" rows="3"
                  data-santri="${s.id}" data-aspek="${a.id}">${esc(deskLama[s.id + "|" + a.id] || "")}</textarea></td>`).join("")}
              </tr>`).join("")}
            </tbody>
          </table>`;
        $("simpan").style.display = "inline-block";
        $("info").textContent = santri.length + " santri. Isi deskripsi untuk tiap aspek, lalu simpan.";
      }

      // ===== SIMPAN =====
      async function simpan() {
        const btn = $("simpan");
        btn.disabled = true;
        try {
          if (modeSel.value === "deskripsi") await simpanDeskripsi();
          else await simpanNilai();
        } finally {
          btn.disabled = false;
        }
      }

      async function simpanNilai() {
        const rows = [], salah = [];
        document.querySelectorAll("#tabel input[data-santri]").forEach(inp => {
          inp.classList.remove("is-invalid");
          const v = inp.value.trim();
          if (v === "") return;
          const n = Number(v);
          if (isNaN(n) || n < 0 || n > 100) {
            inp.classList.add("is-invalid");
            salah.push(inp);
            return;
          }
          rows.push({
            santri_id: Number(inp.dataset.santri),
            komponen_id: Number(inp.dataset.komponen),
            item: inp.dataset.item,
            nilai: n,
            semester_id: sem.id,
            mapel_id: mapelId,
            diisi_oleh: me.id,
            updated_at: new Date().toISOString()
          });
        });

        if (salah.length) {
          salah[0].focus();
          return peringatan("Ada nilai di luar 0 sampai 100. Kotak merah perlu diperbaiki.");
        }
        if (!rows.length) return peringatan("Belum ada nilai yang diisi.");

        const { error } = await sb.from("nilai").upsert(rows,
          { onConflict: "santri_id,semester_id,mapel_id,komponen_id,item" });
        if (error) return gagal(error);

        toast("Tersimpan " + rows.length + " nilai.");
        tampil();
      }

      async function simpanDeskripsi() {
        const rows = [];
        document.querySelectorAll("#tabel textarea[data-santri]").forEach(t => {
          const isi = t.value.trim();
          if (!isi) return;
          rows.push({
            santri_id: Number(t.dataset.santri),
            aspek_id: Number(t.dataset.aspek),
            mapel_id: mapelId,
            semester_id: sem.id,
            isi,
            diisi_oleh: me.id,
            updated_at: new Date().toISOString()
          });
        });

        if (!rows.length) return peringatan("Belum ada deskripsi yang diisi.");

        const { error } = await sb.from("deskripsi_rapor")
          .upsert(rows, { onConflict: "santri_id,semester_id,aspek_id" });
        if (error) return gagal(error);

        toast("Tersimpan " + rows.length + " deskripsi.");
        tampil();
      }
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penilaian UAS, Tahfidz & Tilawah - Kuttab Al-Kalam</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
<link rel="stylesheet" href="ui.css">
<style>
  .daftar-santri { max-height: 60vh; overflow-y: auto; }
  .daftar-santri .list-group-item.aktif { background: #f2c94c; border-color: #d4a52a; color: #1a1a1a; font-weight: 600; }
  .aturan-box { font-size: 13px; color: #444; background: #fff; border-left: 4px solid #f2c94c; padding: 8px 10px; }
  .total-box { font-size: 18px; }
  .badge-skor { background: #1a1a1a; color: #f2c94c; font-size: 13px; }
  .jenis-tag { font-size: 12px; }
</style>
</head>
<body class="hold-transition sidebar-mini">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="ui.js"></script>

<script>
  KUTTAB.halaman({
    aktif: "koreksi-uas",
    judul: "Penilaian UAS, Tahfidz & Tilawah",
    roles: ["admin", "guru"],
    render: async ({ sb, me, sem, konten, toast, gagal, peringatan, esc }) => {
      if (!sem) {
        konten.innerHTML = '<div class="alert alert-warning">Belum ada semester aktif.</div>';
        return;
      }

      const $ = id => document.getElementById(id);

      // Mapel yang dinilai dengan form aspek (fashohah, tajwid, kelancaran).
      // Kitabah tidak termasuk karena hanya punya satu nilai akhir.
      const KODE_ASPEK = ["tahfidz", "tilawah"];

      const aturanUas = t => t <= 1
        ? { pgBobot: 5, isi: 5, isiMax: 10, essay: 0, essayMax: 0,
            label: "Awal 1 dan 2: PG 10 soal × 5 poin, isian 5 soal (maks 10 per soal). Total 100." }
        : { pgBobot: 3, isi: 5, isiMax: 5, essay: 5, essayMax: 9,
            label: "Awal 3 sampai Qonuni 4: PG 10 soal × 3 poin, isian 5 soal (maks 5 per soal), essay 5 soal (maks 9 per soal). Total 100." };

      const [rb, pm, bn] = await Promise.all([
        sb.from("rombel").select("id, nama, wali_kelas_id, tingkat_kode")
          .eq("tahun_ajaran_id", sem.tahun_ajaran_id).order("nama"),
        sb.from("penugasan_mapel").select("rombel_id, pegawai_id, mapel:mapel_id(id, kode, nama, urutan)"),
        sb.from("bobot_nilai").select("mapel_id, komponen:komponen_id(kode)")
      ]);
      const err = [rb, pm, bn].find(r => r.error);
      if (err) return gagal(err.error);

      const rombelMap = new Map(rb.data.map(r => [r.id, r]));
      const mapelUas = new Set((bn.data || []).filter(b => b.komponen && b.komponen.kode === "uas").map(b => b.mapel_id));

      // Mapel yang bisa dinilai: mapel dengan komponen UAS, atau Tahfidz/Tilawah
      const penugasan = (pm.data || []).filter(x =>
        x.mapel && rombelMap.has(x.rombel_id) &&
        (me.peran === "admin" || x.pegawai_id === me.id) &&
        (mapelUas.has(x.mapel.id) || KODE_ASPEK.includes(x.mapel.kode)));

      const rombelOpts = [...new Map(penugasan.map(x => [x.rombel_id, rombelMap.get(x.rombel_id)])).values()]
        .sort((a, b) => a.nama.localeCompare(b.nama));
      if (!rombelOpts.length) {
        konten.innerHTML = '<div class="alert alert-info">Belum ada mapel yang perlu dinilai untuk akun Anda.</div>';
        return;
      }

      konten.innerHTML = `
        <div class="card"><div class="card-body">
          <div class="form-row align-items-end">
            <div class="col-12 col-md-5 mb-2">
              <label class="small mb-1">Kelas</label>
              <select id="rombel" class="form-control"></select>
            </div>
            <div class="col-12 col-md-7 mb-2">
              <label class="small mb-1">Mapel</label>
              <select id="mapel" class="form-control"></select>
            </div>
          </div>
          <p class="small text-muted mb-0" id="jenisInfo"></p>
        </div></div>
        <div class="row">
          <div class="col-lg-5 mb-3">
            <div class="card">
              <div class="card-header"><strong>Daftar santri</strong></div>
              <div class="p-0 daftar-santri" id="daftar"></div>
            </div>
          </div>
          <div class="col-lg-7 mb-3">
            <div class="card" id="form"></div>
          </div>
        </div>`;

      let rombelId = null, mapel = null, santriList = [], nilaiMap = {}, curId = null;

      $("rombel").innerHTML = rombelOpts.map(r => `<option value="${r.id}">${esc(r.nama)}</option>`).join("");
      $("rombel").onchange = () => { isiMapel(); muatKelas(); };
      $("mapel").onchange = muatKelas;

      function isiMapel() {
        const rid = Number($("rombel").value);
        const list = [...new Map(penugasan.filter(x => x.rombel_id === rid).map(x => [x.mapel.id, x.mapel])).values()]
          .sort((a, b) => a.urutan - b.urutan);
        $("mapel").innerHTML = list.map(m => `<option value="${m.id}" data-kode="${m.kode}">${esc(m.nama)}</option>`).join("");
      }

      const jenisDari = m => KODE_ASPEK.includes(m.kode) ? "aspek" : "uas";

      async function muatKelas() {
        rombelId = Number($("rombel").value);
        const opt = $("mapel").selectedOptions[0];
        if (!rombelId || !opt) return;
        mapel = { id: Number(opt.value), kode: opt.dataset.kode };
        mapel.jenis = jenisDari(mapel);

        $("jenisInfo").innerHTML = mapel.jenis === "aspek"
          ? '<span class="badge badge-warning jenis-tag">UAS</span> Isi fashohah, tajwid, dan kelancaran. Hasilnya masuk ke komponen UAS.'
          : '<span class="badge badge-dark jenis-tag">UAS</span> Isi PG, isian, dan essay. Hasilnya masuk ke komponen UAS.';

        $("daftar").innerHTML = '<div class="p-3 text-muted">Memuat...</div>';

        const [kr, nl] = await Promise.all([
          sb.from("keanggotaan_rombel").select("santri:santri_id(id, nis, nama_lengkap, tingkat_sekarang)")
            .eq("rombel_id", rombelId).eq("tahun_ajaran_id", sem.tahun_ajaran_id),
          mapel.jenis === "aspek"
            ? sb.from("penilaian_aspek").select("santri_id, fashohah, tajwid, kelancaran, jilid, skor")
                .eq("semester_id", sem.id).eq("mapel_id", mapel.id)
            : sb.from("uas_koreksi").select("santri_id, pg_benar, isian, essay, skor")
                .eq("semester_id", sem.id).eq("mapel_id", mapel.id)
        ]);
        if (kr.error) return gagal(kr.error);
        if (nl.error) return gagal(nl.error);

        santriList = (kr.data || []).map(x => x.santri).filter(Boolean)
          .sort((a, b) => a.nama_lengkap.localeCompare(b.nama_lengkap));
        nilaiMap = {};
        (nl.data || []).forEach(u => nilaiMap[u.santri_id] = u);
        curId = null;
        renderDaftar();
        kosongkanForm();
      }

      function renderDaftar() {
        if (!santriList.length) {
          $("daftar").innerHTML = '<div class="p-3 text-muted">Belum ada santri di kelas ini.</div>';
          return;
        }
        const sudah = santriList.filter(s => nilaiMap[s.id]).length;
        $("daftar").innerHTML = `
          <div class="px-3 pt-2 small text-muted">${sudah} dari ${santriList.length} santri sudah dinilai</div>
          <div class="list-group list-group-flush">
            ${santriList.map((s, i) => {
              const n = nilaiMap[s.id];
              return `<button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center ${s.id === curId ? "aktif" : ""}" data-id="${s.id}">
                <span>${i + 1}. ${esc(s.nama_lengkap)}<br><small class="text-muted">${esc(s.nis || "-")}</small></span>
                ${n ? `<span class="badge badge-skor">${Number(n.skor).toFixed(2)}</span>`
                    : '<span class="badge badge-light border">belum</span>'}
              </button>`;
            }).join("")}
          </div>`;
        $("daftar").querySelectorAll("[data-id]").forEach(b => b.onclick = () => pilihSantri(Number(b.dataset.id)));
      }

      function kosongkanForm() {
        $("form").innerHTML = '<div class="card-body text-muted">Pilih santri dari daftar di sebelah kiri.</div>';
      }

      function pilihSantri(id) {
        curId = id;
        renderDaftar();
        const s = santriList.find(x => x.id === id);
        if (!s) return kosongkanForm();
        if (mapel.jenis === "aspek") return formAspek(s);
        return formUas(s);
      }

      // ===== FORM UAS (PG, isian, essay) =====
      function formUas(s) {
        const a = aturanUas(s.tingkat_sekarang);
        const u = nilaiMap[s.id] || {};
        const isian = Array.isArray(u.isian) ? u.isian : [];
        const essay = Array.isArray(u.essay) ? u.essay : [];

        $("form").innerHTML = `
          <div class="card-header">
            <strong>${esc(s.nama_lengkap)}</strong>
            <span class="text-muted small ml-2">NIS ${esc(s.nis || "-")}</span>
          </div>
          <div class="card-body">
            <div class="aturan-box mb-3">${esc(a.label)}</div>

            <div class="form-group">
              <label class="font-weight-bold">Pilihan ganda: jumlah benar (0–10)</label>
              <div class="input-group" style="max-width:240px">
                <input type="number" id="uPg" class="form-control" min="0" max="10" step="1" value="${u.pg_benar ?? ""}">
                <div class="input-group-append"><span class="input-group-text">× ${a.pgBobot} poin</span></div>
              </div>
            </div>

            <div class="form-group">
              <label class="font-weight-bold">Isian (maks ${a.isiMax} per soal)</label>
              <div class="form-row">
                ${Array.from({ length: a.isi }, (_, i) => `
                  <div class="col-6 col-md-4 mb-2">
                    <small class="text-muted">No ${i + 1}</small>
                    <input type="number" class="form-control uIsi" min="0" max="${a.isiMax}" step="0.5" value="${isian[i] ?? ""}">
                  </div>`).join("")}
              </div>
            </div>

            ${a.essay ? `
            <div class="form-group">
              <label class="font-weight-bold">Essay (maks ${a.essayMax} per soal)</label>
              <div class="form-row">
                ${Array.from({ length: a.essay }, (_, i) => `
                  <div class="col-6 col-md-4 mb-2">
                    <small class="text-muted">No ${i + 1}</small>
                    <input type="number" class="form-control uEssay" min="0" max="${a.essayMax}" step="0.5" value="${essay[i] ?? ""}">
                  </div>`).join("")}
              </div>
            </div>` : ""}

            <div class="total-box mb-3">Total skor: <strong id="uTotal">0.00</strong> / 100</div>
            <button class="btn btn-kuning" id="uSimpan"><i class="fas fa-save"></i> Simpan skor UAS</button>
          </div>`;

        const hitung = () => {
          const pg = Number($("uPg").value) || 0;
          const isiSum = [...document.querySelectorAll(".uIsi")].reduce((t, x) => t + (Number(x.value) || 0), 0);
          const esSum = [...document.querySelectorAll(".uEssay")].reduce((t, x) => t + (Number(x.value) || 0), 0);
          $("uTotal").textContent = (pg * a.pgBobot + isiSum + esSum).toFixed(2);
        };
        document.querySelectorAll("#form input").forEach(i => i.oninput = hitung);
        hitung();
        $("uSimpan").onclick = () => simpanUas(s, a);
      }

      const angkaDalam = (v, maks) => {
        const n = Number(v);
        if (v === "" || !Number.isFinite(n) || n < 0 || n > maks) return null;
        return n;
      };

      async function simpanUas(s, a) {
        document.querySelectorAll("#form input").forEach(i => i.classList.remove("is-invalid"));

        const pgRaw = $("uPg").value.trim();
        const pgN = Number(pgRaw);
        if (pgRaw === "" || !Number.isInteger(pgN) || pgN < 0 || pgN > 10) {
          $("uPg").classList.add("is-invalid");
          return peringatan("Jumlah benar PG harus bilangan bulat 0 sampai 10.");
        }

        const isianEl = [...document.querySelectorAll(".uIsi")];
        const isian = isianEl.map(x => angkaDalam(x.value.trim(), a.isiMax));
        if (isian.some(v => v === null)) {
          isianEl.forEach((x, i) => { if (isian[i] === null) x.classList.add("is-invalid"); });
          return peringatan("Isi semua nomor isian dengan angka 0 sampai " + a.isiMax + ". Isi 0 jika salah.");
        }

        const essayEl = [...document.querySelectorAll(".uEssay")];
        const essay = essayEl.map(x => angkaDalam(x.value.trim(), a.essayMax));
        if (essay.some(v => v === null)) {
          essayEl.forEach((x, i) => { if (essay[i] === null) x.classList.add("is-invalid"); });
          return peringatan("Isi semua nomor essay dengan angka 0 sampai " + a.essayMax + ". Isi 0 jika salah.");
        }

        const total = pgN * a.pgBobot + isian.reduce((t, v) => t + v, 0) + essay.reduce((t, v) => t + v, 0);

        const btn = $("uSimpan");
        btn.disabled = true;
        const { error } = await sb.from("uas_koreksi").upsert({
          santri_id: s.id, semester_id: sem.id, mapel_id: mapel.id,
          pg_benar: pgN, isian, essay,
          diisi_oleh: me.id, updated_at: new Date().toISOString()
        }, { onConflict: "santri_id,semester_id,mapel_id" });
        btn.disabled = false;
        if (error) return gagal(error);

        nilaiMap[s.id] = { santri_id: s.id, pg_benar: pgN, isian, essay, skor: total };
        toast("Skor UAS " + s.nama_lengkap + ": " + total.toFixed(2) + " tersimpan.");
        pilihSantri(s.id);
      }

      // ===== FORM ASPEK (TAHFIDZ / TILAWAH) =====
      async function formAspek(s) {
        // Jilid tilawah diambil dari jurnal tilawati terakhir
        let jilid = null;
        if (mapel.kode === "tilawah") {
          const { data, error } = await sb.rpc("jilid_tilawah_terakhir", { p_santri: s.id });
          if (error) return gagal(error);
          jilid = data;

          if (jilid === null) {
            $("form").innerHTML = `
              <div class="card-header"><strong>${esc(s.nama_lengkap)}</strong></div>
              <div class="card-body">
                <div class="alert alert-warning mb-0">
                  Belum ada jurnal tilawati untuk santri ini, jadi jilid belum bisa ditentukan.
                  Isi jurnal tilawati terlebih dahulu.
                </div>
              </div>`;
            return;
          }
        }

        const u = nilaiMap[s.id] || {};
        const jilid1 = mapel.kode === "tilawah" && jilid <= 1;
        const perluTajwid = mapel.kode === "tahfidz" || (mapel.kode === "tilawah" && !jilid1);

        const bobotInfo = mapel.kode === "tahfidz"
          ? "Fashohah 40%, tajwid 30%, kelancaran 30%."
          : jilid1
            ? "Jilid 1: fashohah 60%, kelancaran 40%."
            : "Jilid 2 ke atas: fashohah 40%, tajwid 30%, kelancaran 30%.";

        $("form").innerHTML = `
          <div class="card-header">
            <strong>${esc(s.nama_lengkap)}</strong>
            <span class="text-muted small ml-2">NIS ${esc(s.nis || "-")}</span>
          </div>
          <div class="card-body">
            <div class="aturan-box mb-3">${esc(bobotInfo)} Skor 0 sampai 100.</div>
            ${mapel.kode === "tilawah" ? `
              <div class="small text-muted mb-3">Jilid terakhir dari jurnal: <strong>${jilid}</strong></div>` : ""}

            <div class="form-row">
              <div class="col-12 col-md-4 mb-2">
                <label class="font-weight-bold">Fashohah</label>
                <input type="number" id="aFash" class="form-control" min="0" max="100" step="0.5" value="${u.fashohah ?? ""}">
              </div>
              ${perluTajwid ? `
              <div class="col-12 col-md-4 mb-2">
                <label class="font-weight-bold">Tajwid</label>
                <input type="number" id="aTaj" class="form-control" min="0" max="100" step="0.5" value="${u.tajwid ?? ""}">
              </div>` : ""}
              <div class="col-12 col-md-4 mb-2">
                <label class="font-weight-bold">Kelancaran</label>
                <input type="number" id="aLanc" class="form-control" min="0" max="100" step="0.5" value="${u.kelancaran ?? ""}">
              </div>
            </div>

            <div class="total-box mb-3">Skor UAS: <strong id="aTotal">0.00</strong> / 100</div>
            <button class="btn btn-kuning" id="aSimpan"><i class="fas fa-save"></i> Simpan penilaian</button>
          </div>`;

        const hitung = () => {
          const f = Number($("aFash").value) || 0;
          const l = Number($("aLanc").value) || 0;
          const t = perluTajwid ? (Number($("aTaj").value) || 0) : 0;
          const hasil = perluTajwid ? f * 0.4 + t * 0.3 + l * 0.3 : f * 0.6 + l * 0.4;
          $("aTotal").textContent = hasil.toFixed(2);
        };
        document.querySelectorAll("#form input").forEach(i => i.oninput = hitung);
        hitung();

        $("aSimpan").onclick = () => simpanAspek(s, perluTajwid);
      }

      async function simpanAspek(s, perluTajwid) {
        document.querySelectorAll("#form input").forEach(i => i.classList.remove("is-invalid"));

        const cek = (el, label) => {
          const v = el.value.trim();
          const n = Number(v);
          if (v === "" || !Number.isFinite(n) || n < 0 || n > 100) {
            el.classList.add("is-invalid");
            return { ok: false, msg: label + " harus angka 0 sampai 100." };
          }
          return { ok: true, n };
        };

        const fash = cek($("aFash"), "Fashohah");
        const lanc = cek($("aLanc"), "Kelancaran");
        const taj = perluTajwid ? cek($("aTaj"), "Tajwid") : { ok: true, n: null };
        const gagalCek = [fash, lanc, taj].find(x => !x.ok);
        if (gagalCek) return peringatan(gagalCek.msg);

        const btn = $("aSimpan");
        btn.disabled = true;
        const { error } = await sb.from("penilaian_aspek").upsert({
          santri_id: s.id, semester_id: sem.id, mapel_id: mapel.id,
          fashohah: fash.n, tajwid: taj.n, kelancaran: lanc.n,
          diisi_oleh: me.id, updated_at: new Date().toISOString()
        }, { onConflict: "santri_id,semester_id,mapel_id" });
        btn.disabled = false;
        if (error) return gagal(error);

        const { data: baru } = await sb.from("penilaian_aspek")
          .select("santri_id, fashohah, tajwid, kelancaran, jilid, skor")
          .eq("santri_id", s.id).eq("semester_id", sem.id).eq("mapel_id", mapel.id).maybeSingle();
        if (baru) nilaiMap[s.id] = baru;

        toast("Penilaian " + s.nama_lengkap + " tersimpan. Skor UAS: " + Number(baru?.skor ?? 0).toFixed(2));
        pilihSantri(s.id);
      }

      isiMapel();
      muatKelas();
    }
  });
</script>
</body>
</html>
